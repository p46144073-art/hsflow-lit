    contribution: "本文的核心發現是一個容易被誤讀的假象：Taylor–Maccoll 解幾乎與比熱比 γ 無關，而文獻中看到的強烈 γ 依賴，完全來自參考速度的選擇。Maccoll 以氣體膨脹進真空所能達到的速度 V_max 作正規化時，級數自四次項起就出現強烈的 γ 依賴；作者改以錐面徑向速度 wc 作參考速度重新展開，γ 依賴便退到六次項才出現，並證明一般項可寫成 M_c² 與 cot²θc 的多項式、係數至多是 (γ−1)/2 的函數。四個極端測試案例（θc = 5 度配 Mc = 1 與 10、θc = 40 度配 Mc = 1 與 2，各跑 γ = 1、1.4、5/3、2）證實此點：γ 由 1.4 變到 5/3，正規化速度的最大差異只有三千分之一，最吻合的案例甚至只有一萬五千分之一。實用推論是既有的 Sims（γ = 1.4）或 Kopal（γ = 1.405）表格可直接用於任意 γ——只需把表列速度改以 wc 正規化，再把想要的 γ 代入激波條件與自由流馬赫數關係式，所得激波角與 M∞ 至少準到小數第三位。本文的第二個貢獻是解析結構：作者用 Domb–Sykes 圖定出級數的奇點，證實 Kopal 指出的 a² = u² 奇點是 3/2 次方分支點，一個位於錐體之內、一個位於激波之外，並分別對應右行與左行特徵線的包絡。由於已知奇點是 3/2 次方分支點，作者把級數先取 2/3 次方、化為有理分式後再取 3/2 次方，使有理分式的每個零點都轉成正確類型的分支點，僅用四項就得到一個閉式近似，四個測試案例中三個的最大誤差小於百分之一。",
    summary: "本摘要由本站自出版社排版版 PDF（Birkhäuser／ZAMP）整理，頁碼為期刊印刷頁。\n\n問題與作者的切入點（第 407 頁）：作者在用級數展開法研究一般的錐形對稱超音速流時，注意到零偏航正圓錐這個特例的一項有趣性質——流場解幾乎與比熱比無關，唯一有感的 γ 依賴來自激波跳躍條件。文中先按慣例把問題寫成球極坐標下的二階非線性方程，錐面條件為法向速度為零；給定錐面徑向速度後即可自錐面往外數值積分，直到速度分量與 Hugoniot 關係相容為止。作者順帶指出也可以反過來自激波往內積分到法向速度為零，兩者複雜度相當，某些應用下後者甚至更合適；無論哪個方向，要對上指定的自由流馬赫數與錐角都需要迭代。\n\n參考速度的選擇造成了假象（第 407 至 408 頁）：Maccoll 曾用級數解處理大錐角，展開到五次項，其結果自四次項起呈現對 γ 的強烈依賴。作者改以錐面速度 wc 為參考速度重新推導，級數中 γ 只在六次項才出現，並進一步證明一般項的形式可寫成 M_c² 與 cot²θc 的多項式，係數至多是 (γ−1)/2 的函數。結論很直接：Maccoll 級數裡那個看似強烈的 γ 依賴，完全來自他選的參考速度。\n\n四個極端案例的驗證（第 409 頁）：測試涵蓋 θc = 5 度配錐面馬赫數 1 與 10，以及半錐角 40 度配 Mc = 1 與 2（後者已接近該大錐角所能達到的上限），每個案例各跑 γ = 1、1.4、5/3、2。每個解都自錐面以 ε 展開到 30 階，再改寫成 [15/15] 的 Padé 近似（有理分式）。作者說明標準數值積分也能得到等價結果，但級數路線可以額外給出解的解析行為資訊。數值顯示 γ 自 1.4 變到 5/3 時，正規化速度 w/(wc − ws) 的最大差異出現在案例二的激波附近，僅三千分之一；而最吻合的是案例一（激波角約為錐角的 15 倍），最大差異只有一萬五千分之一。\n\n實用推論與真實氣體（第 409 頁）：既然 w 幾乎與 γ 無關，Sims（γ = 1.4）或 Kopal（γ = 1.405）的表格就能用於任意 γ——把表列的 w 與 u 改以 wc 而非 V_max 正規化，再把想要的 γ 代入激波條件與自由流馬赫數關係式即可，所得激波角與 M∞ 至少準到小數第三位，作者認為對實驗數據的化算已經足夠。只要氣體溫度未高到產生顯著解離，真實氣體效應也可用調整有效 γ 來近似模擬；由於給定 Mc 與 θc 時有效 γ 即使變動不小也只造成錐形速度場的微小改變，這種模擬相當穩健。\n\n奇點的位置與性質（第 409 至 411 頁）：這是本站追問要對照的段落。Kopal 早已指出方程在 a² = u² 處奇異；作者說明這些奇點落在物理錐形流場的解析延拓上，一個位於錐體之內（0 < θ < θc），一個位於激波之外（θ > θs）。作者用 Domb 與 Sykes 的圖解法定出其位置與性質：把級數係數比 aₙ/aₙ₋₁ 對 1/n 作圖，若最靠近原點的奇點屬於冪次或對數型，該圖在 1/n 變小時會趨於直線，其縱軸截距給出收斂半徑的倒數、橫軸截距給出奇點指數。對 Mc = 2、θc = 40 度、γ = 1.4 的情形，圖中在漸近線附近呈阻尼振盪，由斜率與截距得指數 3/2 與 ε₀ = −0.156，與 Kopal 用數值積分得到的結果相符，故 w 的局部行為為 R₁ + R₂(ε − ε₀)^(3/2)。圖中的振盪來自外側不連續對係數的貢獻，該處同樣可證明是 3/2 次方分支點。關鍵的方法論後果在於：此例中 |ε₀| 大於 θs − θc，因此激波落在自錐體展開的級數收斂範圍之內；但作者立刻指出這在一般情況並不成立，案例一就是一個顯著的反例。兩個不連續都是 3/2 次方分支點，並分別對應右行與左行特徵線的包絡。\n\n把奇點知識反過來用（第 412 至 413 頁）：Taylor–Maccoll 解常被當成更複雜流場數值迭代的起點（作者舉 Kutler 自軸對稱解出發計算大偏航錐流為例），因此一個簡單的近似解有實用價值。作者指出冪級數只在複 ε 平面的一個圓內收斂，有理分式則能給出定義域大得多的近似解析延拓；但一般有理分式只有單極點可用，無法模擬更複雜的奇點。既然已知重要奇點是 3/2 次方分支點，就先把級數解取 2/3 次方、把新級數化為有理分式、最後再取 3/2 次方還原，如此有理分式的每個零點都被轉成正確類型的分支點。僅用四項就得到一個 [3/1]（三個零點、一個極點）的閉式近似；與 γ = 1.4 的精確結果相比，四個測試案例的吻合都算可信，最大誤差約百分之四，出現在 Mc = 1、θc = 5 度且 θ 接近激波處，其餘三例最大誤差都小於百分之一。作者強調這是自解析性質推導出的有理近似而非曲線擬合，因此保留更多項就能系統性地改善。\n\nγ = 1 的極限與對數奇點（第 413 至 414 頁）：Kopal 認為 γ = 1 對應等溫流並給出解 w = wc cos(θ − θc)，其推理應是假定 γ 趨於 1 時溫度維持有限、因而音速平方趨於零。作者不同意，認為這既非正確的物理模型，該解在此極限下也未與 γ > 1 的解解析相連；真正相連的極限要求溫度趨於無限大而音速維持有限。作者並建議把 γ = 1 當成標準問題進一步研究，因為它保留了原方程的全部非線性行為卻較為簡化。另一方面 w 趨於 wc cos(θ − θc) 確實是 θc 趨於零時對任意 Mc 與 γ 的正確極限行為，對應均勻超音速流通過無限細的針。作者最後指出級數每一項都含一個特定形式的 cot 冪次項，代入對數恆等式後可把最奇異的部分抽出，顯示原點附近另有一個對數奇點；當錐角很小時它只比 3/2 次方分支點稍遠，但因為更強而支配了級數的前段，要靠在有理近似中保留更多項才能壓下去。",

    question: "把非線性項在錐面與震波上同時歸零的定密度近似，何時會失效？",
    contribution: "三頁的技術短文。作者把錐流方程重新整理，使全部非線性集中到等號右邊的單一項，並證明該項在斜震波上與錐面上都恰為零——震波處為零是因為把它令為零所得的解正好就是斜震波關係式本身，錐面處為零是因為該處極角等於錐半角。既然這一項在區間兩端都為零，假設它在震波與錐面之間整段都小就有了依據；忽略它之後方程退化為 Legendre 方程，可直接解出，這就是定密度近似。由此得到震波角與錐角的關係式，以及錐面壓力係數的顯式公式。高馬赫極限下壓力係數化為 (γ+3)/2 乘以 sin²δc，對 γ = 1.4 與精確值吻合良好，取 γ = 1 則退化為牛頓近似。就本站追問而言，作者自己給出的失效邊界很明確：震波角的誤差在入射馬赫數 1.1 至 1.5 之間小於 10%、在 1.75 時小於 5%，且錐角越大誤差越小；壓力係數則在馬赫數約 1.25 以下、且錐角小時誤差超過 20%，同樣是錐角越大越準、馬赫數越高收斂越快。也就是說這個近似壞在低馬赫數配小錐角，而不是壞在大錐角。作者另把相似律推廣到錐流：跨音速相似參數為同半角楔形流的 M1 sin δc 倍，高超音速相似參數則可取 M1 sin δc；並由震波脫體條件推得 γ = 1.4 時最大震波角 73.9 度、對應最大錐半角 57.6 度。",
    summary: "本摘要由本站自出版社排版版 PDF（AIAA，arc.aiaa.org）整理，頁碼為期刊印刷頁；方程與數值均已回頁面影像核對。\n\n定位（第 1561 頁）：高超音速範圍的錐流定密度解已有 Feldman、Hayes 與 Probstein 等人研究過。本文的新意在於把 Taylor–Maccoll 方程重新安排，使非線性可集中到一項，而該項在錐面與斜震波上皆為零，因此忽略它之後的定密度近似連超音速範圍也能有不錯的精度——原本定密度近似被視為高超音速專用。\n\n關鍵的重整（第 1562 頁）：以 θ 為震波角、ω 為極角、δc 為錐半角、δ 為速度向量與錐軸的夾角，把定常無黏無旋錐流方程整理成左邊為線性、右邊為單一非線性項的形式。若把右邊令為零並配上震波處的邊界條件求解，所得結果恰好就是斜震波關係式；而在錐面上極角等於錐半角、速度偏折角也等於錐半角，右邊同樣為零。兩端皆零，於是假設它在整段都小；捨去後方程即為 Legendre 方程，配上錐面法向速度為零的條件即可解出。\n\n失效邊界（第 1562 頁）：這是本站追問的直接答案，作者以 Sims 的精確值（即本站 B-05 的 NASA SP-3004）為基準逐項比對。震波角方面，入射馬赫數在 1.1 至 1.5 之間誤差小於 10%，到 1.75 時小於 5%；對固定馬赫數，錐半角越大誤差越小。壓力係數方面，馬赫數約 1.25 以下時小錐角的誤差超過 20%，錐半角增大則誤差下降；對固定錐角，馬赫數上升時誤差迅速下降。相似律關聯圖則顯示 M1 sin δc 大於 1 時關聯良好。換言之這個近似的弱點在低馬赫數配小錐角，恰與一般對定密度近似的直覺（以為它只適用高超音速）相反。\n\n兩個極限的檢核（第 1562 頁）：馬赫數趨於無限大且震波角趨近錐角時，壓力係數式的第一項與最後一項都趨於零，餘下 (γ+3)/2 乘以 sin²δc；此式對 γ = 1.4 與精確值吻合良好，取 γ = 1 則化為牛頓近似。另給出 M1 sin δc 大於 1 時的近似式，其關聯曲線與把 M1² 換成 2M1² 所得的另一條曲線，恰把精確點夾在中間；作者指出這兩條曲線之差類似於 van Dyke 與 Cole 兩種小擾動近似之差，只是後兩者的關聯建立在 tan δc 而非 sin δc 上。\n\n相似參數（第 1563 頁）：跨音速方面，楔形流的熵變依賴一個標準的跨音速參數；把錐流的關係式在馬赫角處近似後代入，可證明錐流的跨音速參數是同半角楔形流的 M1 sin δc 倍。高超音速方面，以類似手法可得震波偏折角與錐半角的關係，代回壓力係數式所得結果與高馬赫極限式一致，作者因此主張錐流的高超音速相似參數可取 M1 sin δc。\n\n震波脫體（第 1563 頁）：作者先指出對給定楔角或錐角，震波脫體發生在震波前後密度比達到最大值的那個震波角。由此推得錐流的脫體條件式，並給出一個誤差在錐半角不大於 20 度時小於 5%、大於 20 度時小於 3% 的近似式。以馬赫數趨於無限大取極限，得 γ = 1.4 時最大震波角為 73.9 度，對應的最大錐半角為 57.6 度，作者稱與精確值約 58 度吻合良好。作者並指出在震波角對錐角的圖上，脫體線排除了馬赫數低於脫體值的區域，因此唯一可能的強震波是脫體的正震波。",

/* ---------- 首頁 ---------- */
function viewHome(){
  const PAPERS=papersOf(LIBRARY), BOOKS=booksOf(LIBRARY);
  const nAll=PAPERS.length, nBk=BOOKS.length;
  const nV=PAPERS.filter(p=>p.biblioCheck==="verified").length;
  const nVBk=BOOKS.filter(p=>p.biblioCheck==="verified").length;
  const nPg=PAPERS.filter(p=>p.pages).length;
  const tc=t=>{const it=papersOf(ORDER[t]),T=TRACKS[t];return `
    <button class="tcard" data-go="${t}" style="--ac:${AC[t].ac};--acl:${AC[t].acl}">
      <span class="code">${t}</span>
      <span class="lat">${esc(T.latin)}</span>
      <h2>${esc(T.label)}</h2>
      <p>${esc(T.thesis)}</p>
      <span class="foot"><span><b>${it.length}</b> 篇</span>
        <span>年代 <b>${Math.min(...it.map(p=>p.year))}–${Math.max(...it.map(p=>p.year))}</b></span>
        <span>已細讀 <b>${it.filter(p=>done[p.id]).length}</b></span></span>
      <span class="go">進入軌道 ${t} →</span>
    </button>`;};

  return `
  <section class="slab fade">
    <p class="eyebrow">Compressible Flow · Reading Route · 01</p>
    <h1>別只問「模型對不對」<br><span class="g">要問這個數字<br>是在哪一種量測情境下產生的。</span></h1>
    <p class="lede">三條路線，三種不同的知識形態。軌道 A 是非穩態的、設施相依的、必須靠診斷技術才能定義的量；軌道 B 是一條常微分方程與它九十年來的近似解族譜；軌道 C 則追問那條方程究竟被什麼光學手段量到過。放在同一個站裡，是因為現代超燃衝壓與乘波體設計同時需要這三種知識。</p>
    <div class="cta">
      <button class="btn solid" data-go="A">進入軌道 A →</button>
      <button class="btn" data-go="B">進入軌道 B</button>
      <button class="btn" data-go="C">進入軌道 C</button>
    </div>
    <div class="plate">${PLATE}
      <div class="cap"><span>軌道 A：回饋迴路決定頻率，量測情境決定數字</span><span>軌道 B：一條 ODE 決定整個流場</span></div>
      <p class="cap-note">此圖只畫軌道 A 與 B 這兩種知識形態的對照。軌道 C 是對右半邊那條 ODE 的實證檢驗，不在圖中。</p>
    </div>
  </section>

  <div class="stats">
    <div class="stat"><b>${nAll}</b><span>篇文獻</span></div>
    <div class="stat"><b>${nV}</b><span>書目已核</span></div>
    <div class="stat"><b>${nBk}</b><span>參考書</span></div>
    <div class="stat era"><b>1933–2025</b><span>涵蓋年代</span></div>
    <div class="stat hi"><b>${Math.round(nPg/nAll*100)}%</b><span>關鍵主張附頁碼</span></div>
  </div>

  <div class="tcards">${tc("A")}${tc("B")}${tc("C")}</div>

  <section class="band">
    <p class="eyebrow">Reading rule</p><h2>閱讀規則</h2>
    <ul>
      <li><b>數字不能脫離量測法。</b>剪切層成長率取決於厚度定義（Pitot 剖面、視覺邊界、渦度厚度）；凹槽頻率取決於 L/D、來流邊界層厚度與感測器位置。同一個物理量，換個定義就換個值。</li>
      <li><b>理論解不能脫離假設。</b>Taylor–Maccoll 假設無黏、無旋、軸對稱、量熱完全氣體。與實驗有偏差時，先檢查是哪一條假設被違反，再懷疑數值方法。</li>
      <li><b>表格不是獨立驗證來源。</b>Sims（NASA SP-3004）的數據源自 Kopal（1947）；用兩者互相驗證等於自我驗證。</li>
      <li><b>「核心貢獻」只在讀過原文後才填。</b>沒讀過就是「待補」，不用摘要或二次文獻補位。</li>
    </ul>
  </section>

  <section class="band">
    <p class="eyebrow">Data honesty</p><h2>資料誠實性</h2>
    <ul>
      <li><b>書目已核</b>　卷、期、頁碼或 DOI 至少對過出版社頁面，或在兩個以上獨立來源中一致。目前 ${nAll} 篇文獻中有 ${nV} 筆，另有 ${nVBk} 本參考書亦已核。</li>
      <li><b>書目待核</b>　僅單一來源或憑印象，引用前請自行確認。</li>
      <li><b>來源不一致</b>　不同文獻記載相衝突，卡片底部寫明衝突內容與建議採用版本。目前四筆：Taylor &amp; Maccoll (1933) 頁碼、Maccoll (1937) 年份、Mölder (1967) 頁碼、Rylov (1990) 頁碼。</li>
      <li><b>頁碼欄目前 ${nPg===0?"全部空白":"完成 "+nPg+" 筆"}。</b>關鍵主張要對到頁碼必須逐篇讀 PDF，這是留給你的工作。</li>
    </ul>
  </section>

  <section class="band">
    <p class="eyebrow">How to extend</p><h2>新增你自己的文獻</h2>
    <ul>
      <li>整站是<b>單一個 index.html</b>，沒有外部檔案、沒有資料夾、沒有建置流程。用文字編輯器打開，找到頂端的 <code>LIBRARY</code> 陣列，照格式加一個物件即可。</li>
      <li>年代導軌、側欄編號、篩選晶片、統計數字全部自動更新，<b>不用改任何其他地方</b>。</li>
      <li><code>topic</code> 是自由字串，填新值就會自動長出新的篩選晶片。</li>
      <li>沒讀過原文的，<code>contribution</code> 一律留 <code>null</code>，卡片會誠實顯示「待補」。</li>
    </ul>
  </section>

  <footer>本站為文獻導引工具，不構成設計程序或試驗規範。書目以出版社頁面為準；卡片上的「追問」由編輯者撰寫，不代表原作者觀點。進度僅存於這台裝置的瀏覽器。</footer>`;
}

/* ---------- 軌道頁 ---------- */
function viewTrack(t){
  const T=TRACKS[t], items=ORDER[t];
  const uniq=k=>[...new Set(items.map(p=>p[k]))].sort();
  const chip=(v,b)=>`<button class="chip" data-b="${b}" data-v="${esc(v)}" aria-pressed="${(b==="m"?state.methods:state.topics).has(v)}">${esc(v)}</button>`;
  return `
  <section class="slab fade" style="padding:40px 44px">
    <p class="eyebrow">Track ${t} · ${esc(T.latin)}</p>
    <h1 style="font-size:clamp(26px,3.4vw,40px)">${esc(T.label)}</h1>
    <p class="lede">${esc(T.long||T.thesis)}</p>
  </section>
  <div class="railbox"><div class="rail" id="rail" aria-label="年代導軌"></div></div>
  <div class="filters">
    <span class="lab">方法</span>${uniq("method").map(v=>chip(v,"m")).join("")}
  </div>
  <div class="filters">
    <span class="lab">主題</span>${uniq("topic").map(v=>chip(v,"t")).join("")}
    <input class="srch" id="srch" type="search" placeholder="搜尋標題、作者、追問…" value="${esc(state.q)}">
    <button class="chip" id="rst">清除</button>
  </div>
  <div class="cards" id="cards"></div>
  <footer>卡片上的「追問」由編輯者撰寫，用來標示該文獻要面對的可證偽問題，不代表原作者結論。</footer>`;
}

function cardHTML(p){
  const c=CHK[p.biblioCheck]||CHK.unverified;
  const doi=p.doi?` · <a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">doi:${esc(p.doi)}</a>`:"";
  /* 每筆都給一個入口：有 DOI 的直達出版社，沒有的用標題丟去 Google Scholar 搜。
     這裡不寫入任何書目欄位，只是把既有的 title 組成查詢網址。 */
  const find=` · <a class="find" href="https://scholar.google.com/scholar?q=${encodeURIComponent(p.title)}" target="_blank" rel="noopener" title="用標題到 Google Scholar 搜尋全文">找全文 ↗</a>`;
  /* url 是選填欄位：確定可取得全文時才填，沒填就只顯示上面的搜尋連結。 */
  const url=p.url?` · <a href="${esc(p.url)}" target="_blank" rel="noopener">全文 ↗</a>`:"";
  return `<article class="card" id="c-${esc(p.id)}" data-done="${done[p.id]?1:0}">
    <div class="card-top">
      <span class="c-num">${seqOf(p)}</span>
      <span class="c-id">${esc(p.id)} · ${p.year}</span>
      <span class="tag">${esc(p.method)}</span><span class="tag">${esc(p.topic)}</span>
      <span class="tag${c.w?" warn":""}">${c.t}</span>
    </div>
    <h3>${esc(p.title)}</h3>
    <div class="meta">${esc(p.authors)}<br><span class="vn">${esc(p.venue)}</span>${doi}${url}${find}</div>
    <div class="q"><span class="l">追問</span>${esc(p.question)}</div>
    ${p.contribution
      ?`<div class="contrib"><span class="l">核心貢獻</span>${esc(p.contribution)}</div>`
      :`<div class="contrib todo"><span class="l">核心貢獻</span>待補 —— 尚未讀原文，不預先填寫。</div>`}
    ${p.summary?`<details class="sum"><summary>重點摘要</summary><div>${esc(p.summary)}</div></details>`:""}
    ${p.note?`<div class="nb">${esc(p.note)}</div>`:""}
    <div class="card-foot">
      <button class="done" data-id="${esc(p.id)}" aria-pressed="${done[p.id]?"true":"false"}">${done[p.id]?"✓ 已細讀":"標記為已細讀"}</button>
      <span class="pg">${p.pages?"頁碼："+esc(p.pages):"頁碼：待補"}</span>
    </div></article>`;
}

function paintCards(t){
  const items=ORDER[t].filter(p=>{
    if(state.methods.size&&!state.methods.has(p.method))return false;
    if(state.topics.size&&!state.topics.has(p.topic))return false;
    if(state.q){const h=[p.title,p.authors,p.venue,p.question,p.contribution,p.topic,p.id].join(" ").toLowerCase();
      if(!h.includes(state.q))return false;}
    return true;});
  const el=document.getElementById("cards");
  el.innerHTML=items.length?items.map(cardHTML).join(""):`<div class="empty">沒有符合的文獻。放寬篩選，或在 LIBRARY 陣列新增一筆。</div>`;
  el.querySelectorAll(".done").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id; done[id]?delete done[id]:(done[id]=1); save();
    paintCards(t); paintRail(t); paintRoute(); paintXP();});
}

function paintRail(t){
  const items=ORDER[t], Y0=1930,Y1=2030, pos=y=>((y-Y0)/(Y1-Y0))*100;
  let h='<div class="rail-ax"></div>';
  for(let y=Y0;y<=Y1;y+=10) h+=`<div class="rail-dec" style="left:${pos(y)}%"><span>${y}</span></div>`;
  const seen={};
  items.forEach(p=>{const n=(seen[p.year]=(seen[p.year]||0)+1)-1;
    h+=`<button class="rail-t" data-id="${esc(p.id)}" data-done="${done[p.id]?1:0}"
        style="left:${Math.min(99.6,pos(p.year)+n*0.55)}%" aria-label="${esc(p.year+" "+p.title)}">
        <span class="tip">${p.year} · ${esc(p.authors.split(";")[0])}</span></button>`;});
  const el=document.getElementById("rail"); el.innerHTML=h;
  el.querySelectorAll(".rail-t").forEach(b=>b.onclick=()=>
    document.getElementById("c-"+b.dataset.id)?.scrollIntoView({block:"start"}));
}

/* ---------- 側欄 ---------- */
function paintRoute(){
  const g=t=>{const T=TRACKS[t];return `
    <div class="r-group"><i style="background:${AC[t].ac}"></i>軌道 ${t} · ${esc(T.label)}</div>`+
    ORDER[t].map((p,i)=>`<button class="r-item${state.view===t.toLowerCase()?"":""}" data-id="${esc(p.id)}" data-t="${t}" data-done="${done[p.id]?1:0}">
      <span class="r-num">${done[p.id]?"✓":i+1}</span>
      <span class="r-txt"><span>${esc(p.method)} · ${p.year}</span><b>${esc(p.title)}</b></span>
    </button>`).join("");};
  const el=document.getElementById("rlist"); el.innerHTML=g("A")+g("B")+g("C");
  el.querySelectorAll(".r-item").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t.toLowerCase();
    if(state.view!==t){ location.hash="#/"+t; setTimeout(()=>document.getElementById("c-"+b.dataset.id)?.scrollIntoView({block:"start"}),90); }
    else document.getElementById("c-"+b.dataset.id)?.scrollIntoView({block:"start"});
    document.getElementById("route").classList.remove("open");});
  document.getElementById("rhome").setAttribute("aria-current",state.view==="home"?"page":"false");
}

function paintXP(){
  const n=Object.keys(done).filter(k=>LIBRARY.some(p=>p.id===k)).length, tot=LIBRARY.length;
  document.getElementById("xpv").textContent=(n*20)+" XP";
  document.getElementById("xpb").style.width=(tot?n/tot*100:0)+"%";
  document.getElementById("xpc").textContent=n+"/"+tot;
}

/* ---------- 路由 ---------- */
function route(){
  const h=location.hash.replace("#/","").toLowerCase();
  const v=(h==="a"||h==="b"||h==="c")?h:"home";
  state.view=v; document.documentElement.setAttribute("data-view",v);
  const main=document.getElementById("main");
  if(v==="home"){ main.innerHTML=viewHome();
    main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash="#/"+b.dataset.go.toLowerCase());
  }else{
    const t=v.toUpperCase();
    state.methods.clear(); state.topics.clear(); state.q="";
    main.innerHTML=viewTrack(t);
    main.querySelectorAll(".chip[data-b]").forEach(b=>b.onclick=()=>{
      const bucket=b.dataset.b==="m"?state.methods:state.topics, val=b.dataset.v;
      const on=b.getAttribute("aria-pressed")==="true";
      b.setAttribute("aria-pressed",String(!on)); on?bucket.delete(val):bucket.add(val);
      paintCards(t);});
    document.getElementById("srch").oninput=e=>{state.q=e.target.value.trim().toLowerCase();paintCards(t);};
    document.getElementById("rst").onclick=()=>{state.methods.clear();state.topics.clear();state.q="";
      main.querySelectorAll(".chip[data-b]").forEach(c=>c.setAttribute("aria-pressed","false"));
      document.getElementById("srch").value=""; paintCards(t);};
    paintRail(t); paintCards(t);
  }
  paintRoute(); paintXP(); window.scrollTo(0,0);
}
addEventListener("hashchange",route);
document.getElementById("routebtn").onclick=()=>document.getElementById("route").classList.toggle("open");
route();
</script>
