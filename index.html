<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高速流場文獻導引｜三條可追證據的閱讀路線</title>
<meta name="description" content="超音速剪切層與凹槽流場、Taylor–Maccoll 三維錐流理論解、三維錐流風洞實驗與紋影實證：48 篇文獻與 3 本參考書，以追問句串起的三條閱讀路線。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   配色：風洞報告 / 藍圖。冷調紙面 + 深藍墨卡片 + 金色重點。
   ===================================================================== */
:root{
  --paper:#EBEEF2; --white:#FFFFFF; --paper-2:#F5F7F9;
  --ink:#141C28;   --ink-2:#1E2A3C;  --ink-3:#2A3A50;
  --line:#D5DBE3;  --line-2:#E4E9EF;
  --txt:#18202C;   --dim:#5D6B7E;    --dim-2:#8A97A8;
  --gold:#F0B429;  --blue:#2B57D6;
  --teal:#0E8A8A;  --teal-lite:#E3F2F2;  --teal-bright:#4FC6DE;
  --rust:#B4611A;  --rust-lite:#FBEFE0;  --rust-bright:#E8A03C;
  --iris:#5B57A6;  --iris-lite:#EDECF8;  --iris-bright:#8F8AD8;
  --hue:var(--blue); --hue-lite:#E7ECFB;
  --disp:"Archivo","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,Menlo,monospace;
  --side:296px; --top:62px;
}
[data-view="a"]{ --hue:var(--teal); --hue-lite:var(--teal-lite); }
[data-view="b"]{ --hue:var(--rust); --hue-lite:var(--rust-lite); }
[data-view="c"]{ --hue:var(--iris); --hue-lite:var(--iris-lite); }

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } }
body{
  margin:0; background:var(--paper); color:var(--txt);
  font-family:var(--body); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{ color:var(--hue); text-decoration:none; }
a:hover{ text-decoration:underline; text-underline-offset:3px; }
:focus-visible{ outline:2px solid var(--blue); outline-offset:3px; border-radius:4px; }
h1,h2,h3{ font-family:var(--disp); font-weight:700; line-height:1.2; margin:0; letter-spacing:-.01em; }

/* ---------- 頂列 ---------- */
.topbar{
  position:fixed; inset:0 0 auto 0; height:var(--top); z-index:60;
  background:rgba(235,238,242,.88); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; gap:20px;
}
.logo{ display:flex; align-items:center; gap:11px; min-width:0; }
.logo .mark{
  width:32px; height:32px; border-radius:9px; background:var(--ink);
  display:grid; place-items:center; color:var(--gold);
  font-family:var(--mono); font-size:13px; font-weight:600; flex-shrink:0;
}
.logo b{ font-family:var(--disp); font-size:15.5px; font-weight:700; white-space:nowrap; }
.xp{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
.xp .val{ font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--gold); }
.xp .bar{ width:132px; height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
.xp .bar i{ display:block; height:100%; width:0; background:var(--gold); border-radius:99px; transition:width .4s ease; }
.xp .cnt{ font-family:var(--mono); font-size:12.5px; color:var(--dim); }
@media (max-width:640px){ .xp .bar{ width:70px; } .logo b{ display:none; } }

/* ---------- 側欄學習路徑 ---------- */
.route{
  position:fixed; top:var(--top); left:0; bottom:0; width:var(--side); z-index:50;
  background:var(--paper-2); border-right:1px solid var(--line);
  overflow-y:auto; padding:22px 16px 60px;
}
.route::-webkit-scrollbar{ width:8px; }
.route::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }
.route .cap{
  font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--dim-2); padding:0 10px; margin-bottom:12px;
}
.r-home{
  display:block; padding:11px 14px; border-radius:11px; margin-bottom:18px;
  background:var(--white); border:1px solid var(--line); color:var(--txt);
  font-weight:500; font-size:14px;
}
.r-home[aria-current="page"]{ background:var(--ink); color:var(--white); border-color:var(--ink); }
.r-home:hover{ text-decoration:none; }
.r-group{
  display:flex; align-items:center; gap:9px; padding:14px 10px 9px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim);
}
.r-group i{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
.r-item{
  display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
  padding:8px 10px; border-radius:10px; border:0; background:transparent;
  cursor:pointer; font-family:var(--body); color:var(--txt);
  font-size:12.8px; line-height:1.5; transition:background .15s ease;
}
.r-item:hover{ background:var(--white); }
.r-item.on{ background:var(--white); box-shadow:inset 2px 0 0 var(--hue); }
.r-num{
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
  border:1px solid var(--line); display:grid; place-items:center;
  font-family:var(--mono); font-size:11px; color:var(--dim);
  font-variant-numeric:tabular-nums; margin-top:1px; transition:.15s ease;
}
.r-item[data-done="1"] .r-num{ background:var(--ink); border-color:var(--ink); color:var(--gold); }
.r-item[data-done="1"] .r-txt{ color:var(--dim); }
.r-txt{ min-width:0; }
.r-txt b{ display:block; font-weight:500; }
.r-txt span{ font-family:var(--mono); font-size:10px; color:var(--dim-2); letter-spacing:.05em; }

.routebtn{ display:none; }
@media (max-width:1040px){
  .route{ transform:translateX(-100%); transition:transform .25s ease; box-shadow:0 0 40px rgba(20,28,40,.18); }
  .route.open{ transform:none; }
  .routebtn{
    display:grid; place-items:center; width:36px; height:36px; flex-shrink:0;
    border:1px solid var(--line); border-radius:10px; background:var(--white); cursor:pointer;
  }
  .routebtn span{ display:block; width:15px; height:1.6px; background:var(--txt); box-shadow:0 5px 0 var(--txt),0 -5px 0 var(--txt); }
}

/* ---------- 主區 ---------- */
main{ margin-left:var(--side); padding:calc(var(--top) + 30px) 34px 96px; }
@media (max-width:1040px){ main{ margin-left:0; padding-left:20px; padding-right:20px; } }
.wrap{ max-width:1280px; margin:0 auto; }

/* ---------- 深色卡片（招牌元件） ---------- */
.slab{
  background:var(--ink); color:#EDF1F6; border-radius:24px;
  padding:52px 48px; position:relative; overflow:hidden;
}
@media (max-width:640px){ .slab{ padding:34px 24px; border-radius:18px; } }
.slab .eyebrow{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.24em;
  text-transform:uppercase; color:#7E90A8; margin-bottom:22px;
}
.slab h1{
  font-size:clamp(30px,4.4vw,54px); line-height:1.28; color:#fff;
  font-family:var(--disp); font-weight:700;
}
.slab h1 .g{ color:var(--gold); }
.slab .lede{ margin:26px 0 0; max-width:60ch; color:#AFBCCC; font-size:15px; }
.cta{ display:flex; flex-wrap:wrap; gap:11px; margin-top:30px; }
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:12px 22px; border-radius:99px; font-size:14px; font-weight:500;
  border:1px solid rgba(255,255,255,.24); color:#EDF1F6; background:transparent;
  cursor:pointer; font-family:var(--body); transition:.16s ease;
}
.btn:hover{ background:rgba(255,255,255,.09); text-decoration:none; }
.btn.solid{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:700; }
.btn.solid:hover{ filter:brightness(1.06); }

.plate{ margin-top:38px; border-top:1px solid rgba(255,255,255,.12); padding-top:26px; }
.plate svg{ display:block; width:100%; height:auto; }
.plate .cap{
  display:flex; gap:18px; justify-content:space-between; flex-wrap:wrap; margin-top:14px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:#6F819A; text-transform:uppercase;
}
.plate .cap-note{ margin-top:9px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:#6F819A; }

/* ---------- 統計五格 ---------- */
.stats{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin:22px 0; }
@media (max-width:1000px){ .stats{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:760px){ .stats{ grid-template-columns:repeat(2,1fr); } }
.stat{ background:var(--white); border:1px solid var(--line); border-radius:16px; padding:22px 20px; }
.stat b{ display:block; font-family:var(--disp); font-size:38px; font-weight:700; line-height:1; letter-spacing:-.02em; }
.stat span{ font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.05em; }
.stat.hi b{ color:var(--gold); }
.stat.era{ padding-left:15px; padding-right:15px; }
.stat.era b{ font-size:24px; letter-spacing:0; white-space:nowrap; }

/* ---------- 軌道卡 ---------- */
.tcards{ display:grid; gap:14px; margin:22px 0 34px; }
@media (min-width:860px){ .tcards{ grid-template-columns:1fr 1fr; } }
@media (min-width:1240px){ .tcards{ grid-template-columns:repeat(3,1fr); } }
.tcard{
  background:var(--white); border:1px solid var(--line); border-radius:20px;
  padding:28px 26px; display:flex; flex-direction:column; gap:12px;
  cursor:pointer; text-align:left; font-family:var(--body); color:var(--txt);
  transition:.18s ease;
}
.tcard:hover{ border-color:var(--ac); box-shadow:0 8px 26px rgba(20,28,40,.07); transform:translateY(-2px); }
.tcard .code{
  width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
  background:var(--acl); color:var(--ac); font-family:var(--disp); font-size:20px; font-weight:700;
}
.tcard h2{ font-size:21px; }
.tcard .lat{ font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim-2); }
.tcard p{ margin:0; color:var(--dim); font-size:14px; }
.tcard .foot{
  display:flex; gap:16px; flex-wrap:wrap; margin-top:auto; padding-top:16px;
  border-top:1px solid var(--line-2); font-family:var(--mono); font-size:11px; color:var(--dim-2);
}
.tcard .foot b{ color:var(--txt); font-weight:600; }
.tcard .go{ font-family:var(--mono); font-size:12px; color:var(--ac); letter-spacing:.06em; }

/* ---------- 內容區塊 ---------- */
.band{ background:var(--white); border:1px solid var(--line); border-radius:20px; padding:32px 30px; margin-bottom:14px; }
.band h2{ font-size:20px; margin-bottom:6px; }
.band .eyebrow{ font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim-2); margin-bottom:8px; }
.band ul{ list-style:none; padding:0; margin:20px 0 0; display:grid; gap:14px; }
.band li{ padding-left:18px; border-left:2px solid var(--line); color:var(--dim); font-size:14.5px; }
.band li b{ color:var(--txt); font-weight:700; }
.band code{ font-family:var(--mono); font-size:12.5px; background:var(--paper); padding:2px 6px; border-radius:5px; color:var(--txt); }

/* ---------- 軌道頁：年代導軌 ---------- */
.railbox{
  background:var(--white); border:1px solid var(--line); border-radius:16px;
  padding:14px 22px 8px; margin:16px 0;
}
.rail{ position:relative; height:66px; }
.rail-ax{ position:absolute; left:0; right:0; top:42px; height:1px; background:var(--line); }
.rail-dec{ position:absolute; top:42px; width:1px; height:5px; background:var(--line); }
.rail-dec span{ position:absolute; top:8px; left:50%; transform:translateX(-50%); font-family:var(--mono); font-size:9.5px; color:var(--dim-2); }
.rail-t{
  position:absolute; top:22px; width:2px; height:20px; border:0; padding:0;
  background:var(--hue); opacity:.4; cursor:pointer; transition:.15s ease;
}
.rail-t:hover,.rail-t:focus-visible{ opacity:1; height:28px; top:14px; }
.rail-t[data-done="1"]{ background:var(--ink); opacity:.85; }
.rail-t .tip{
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%); white-space:nowrap;
  background:var(--ink); color:#fff; padding:3px 9px; border-radius:6px;
  font-family:var(--mono); font-size:10px; opacity:0; pointer-events:none; transition:opacity .12s;
}
.rail-t:hover .tip,.rail-t:focus-visible .tip{ opacity:1; }

/* ---------- 篩選 ---------- */
.filters{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:16px 0 18px; }
.filters .lab{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim-2); margin-right:2px; }
.chip{
  font-family:var(--mono); font-size:11.5px; padding:6px 13px; border-radius:99px;
  border:1px solid var(--line); background:var(--white); color:var(--dim); cursor:pointer; transition:.15s;
}
.chip:hover{ border-color:var(--dim-2); color:var(--txt); }
.chip[aria-pressed="true"]{ background:var(--hue); border-color:var(--hue); color:#fff; font-weight:600; }
.srch{
  flex:1 1 190px; min-width:150px; padding:8px 14px; border-radius:99px;
  border:1px solid var(--line); background:var(--white); color:var(--txt);
  font-family:var(--mono); font-size:12px;
}

/* ---------- 文獻卡 ---------- */
.cards{ display:grid; gap:12px; }
.card{
  background:var(--white); border:1px solid var(--line); border-radius:18px;
  padding:26px 26px 22px; scroll-margin-top:88px; transition:.18s ease;
}
.card:hover{ box-shadow:0 6px 22px rgba(20,28,40,.06); }
.card[data-done="1"]{ background:var(--paper-2); }
.card-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.c-num{
  width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  background:var(--hue-lite); color:var(--hue); font-family:var(--mono); font-size:12px; font-weight:600;
}
.card[data-done="1"] .c-num{ background:var(--ink); color:var(--gold); }
.c-id{ font-family:var(--mono); font-size:11px; color:var(--dim-2); letter-spacing:.08em; }
.tag{ font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:99px; background:var(--paper); color:var(--dim); }
.tag.warn{ background:#FDECEA; color:#B3341F; }
.card h3{ font-size:17.5px; line-height:1.42; font-weight:600; margin-bottom:7px; }
.meta{ font-family:var(--mono); font-size:11.5px; color:var(--dim); line-height:1.75; }
.meta .vn{ color:var(--dim-2); }
.meta .find{ color:var(--dim); border-bottom:1px dotted currentColor; }
.meta .find:hover{ color:var(--hue); }
.q{
  margin-top:18px; padding:15px 18px; border-radius:12px;
  background:var(--hue-lite); border-left:3px solid var(--hue); font-size:15px; line-height:1.7;
}
.q .l{ display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-bottom:5px; }
.contrib{ margin-top:14px; font-size:14.5px; color:var(--dim); }
.contrib .l{ display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim-2); margin-bottom:3px; }
.contrib.todo{ font-style:italic; color:var(--dim-2); }
.sum{ margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; }
.sum>summary{
  cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
}
.sum>summary::-webkit-details-marker{ display:none; }
.sum>summary::before{ content:"▸"; font-size:11px; transition:transform .15s ease; }
.sum[open]>summary::before{ transform:rotate(90deg); }
.sum>summary:hover{ color:var(--hue); }
.sum>div{ margin-top:10px; font-size:14px; line-height:1.85; color:var(--dim); white-space:pre-line; }
.card .nb{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-family:var(--mono); font-size:11.5px; line-height:1.7; color:var(--dim-2); }
.card-foot{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:18px; }
.done{
  font-family:var(--mono); font-size:11.5px; padding:7px 15px; border-radius:99px;
  border:1px solid var(--line); background:var(--white); color:var(--dim); cursor:pointer; transition:.15s;
}
.done:hover{ border-color:var(--dim-2); color:var(--txt); }
.done[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--gold); }
.pg{ font-family:var(--mono); font-size:11px; color:var(--dim-2); }
.empty{ background:var(--white); border:1px solid var(--line); border-radius:18px; padding:46px; text-align:center; font-family:var(--mono); font-size:13px; color:var(--dim-2); }

footer{ margin-top:34px; font-family:var(--mono); font-size:11px; color:var(--dim-2); line-height:1.9; }

@media (prefers-reduced-motion:no-preference){
  .fade{ animation:rise .42s ease both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <button class="routebtn" id="routebtn" aria-label="開關學習路徑"><span></span></button>
    <span class="mark">HS</span>
    <b>高速流場文獻導引</b>
  </div>
  <div class="xp">
    <span class="val" id="xpv">0 XP</span>
    <div class="bar"><i id="xpb"></i></div>
    <span class="cnt" id="xpc">0/0</span>
  </div>
</div>

<aside class="route" id="route">
  <p class="cap">Learning route</p>
  <a class="r-home" href="#/" id="rhome">課程總覽</a>
  <div id="rlist"></div>
</aside>

<main><div class="wrap" id="main"></div></main>

<script>
/* ===================================================================
   ▼▼▼ 文獻資料庫：要新增文獻就改這裡（LIBRARY 陣列） ▼▼▼
   =================================================================== */

const LIBRARY = [

  /* ============ 軌道 A：超音速剪切層與凹槽流場 ============ */

  /* --- A1 可壓縮剪切層：壓縮性抑制混合 --- */
  {
    id: "A-01", track: "A", year: 1974, method: "實驗", topic: "自由剪切層",
    title: "On density effects and large structure in turbulent mixing layers",
    authors: "Brown, G.L.; Roshko, A.",
    venue: "J. Fluid Mech. 64(4), 775–816",
    doi: "10.1017/S002211207400190X",
    question: "混合層的成長，究竟被密度比控制，還是被大尺度結構的配對過程控制？",
    contribution: "以氮／氦兩股不同氣體改變密度比，火花陰影照顯示不論密度比為何，混合層都由大尺度擬序結構主導；高速攝影顯示這些結構以近乎定速對流，並藉與鄰近結構合併而不連續地增大其尺寸與間距。跨層密度比的大幅改變對展開角影響相對小，因此把一股為超音速時觀察到的強效應歸因於壓縮性，而非長期以來認定的密度效應。",
    summary: "本摘要由本站自出版社排版版 PDF 整理，頁碼為期刊頁。\n\n實驗配置（第 775 頁摘要）：在新設計的裝置中做兩股不同氣體的平面湍流混合，主要用氮與氦以改變密度比。火花陰影照與高速攝影為主要診斷手段。\n\n主要觀察（第 775 頁摘要）：不論兩側密度比為何，混合層都由大尺度擬序結構主導。高速攝影顯示這些結構以近乎定速對流，並藉與鄰近結構合併，不連續地增大其尺寸與間距。照片與密度擾動量測顯示，湍流混合與捲吸是一種發生在大結構尺度上的纏繞過程。\n\n關鍵結論（第 775 頁摘要）：跨層密度比的大幅改變，對展開角的影響相對小。因此一股為超音速時觀察到的強效應，應歸因於壓縮性，而非長期以來所認定的密度效應。\n\n壓縮性與密度效應的區分（第 802 至 803 頁）：原文明確論證，若只有密度差異在作用，則三種情況——兩側氣體分子量不同、兩側溫度不同、高速壓縮性造成的密度差——在相同速度比與密度比下應無區別。作者指出高速情形另有一項與馬赫數相關的效應，與任何密度差異造成的效應不同。這是本站追問要對照的段落。\n\n捲吸模型與其誤差（第 814 頁）：作者以大結構的統計性質推估捲吸率。在速度比為零的情形，模型給出的纏繞流量成長率約為自由流速度的 0.052 倍，而由 Liepmann 與 Laufer（1947）實驗推得的內流速度為 0.035 倍。作者自陳兩者吻合度不算突出，但考量模型中的多項假設，仍足以支持基本想法可能正確。密度比為 7 與 3 時該常數分別變為 0.070 與 0.038。\n\n作者自陳的限制（第 814 頁 Concluding remarks）：本研究原始目標是釐清不可壓縮流中密度比對湍流混合的影響，但資料量不如預期——關鍵圖僅三個資料點。這足以支持一般性結論與壓縮性效應的比較，卻不足以妥善決定密度依賴關係；連速度比的依賴關係也仍有不確定性。作者明言密度效應相對壓縮性效應為小，並表示將補充量測。",

    contribution: "以新建的雙流吹放式超音速風洞，讓兩股可為不同氣體、不同馬赫數的流交會，量測十種氣體與馬赫數組合（自由流馬赫數 0.2 至 4）的 Pitot 厚度成長率。援引 Bogdanoff (1983) 隨波移動座標的構想定義對流馬赫數 Mc，並先以自行計算的可壓縮渦片線性解檢驗：放大率對 Mc 作圖時，不同密度比的曲線幾乎收攏成一條，對 M1 作圖則否。把實測成長率除以同速度比、同密度比下的不可壓縮模型值後，十組資料大致落在單一曲線上——正規化成長率自次音速 Mc 就開始下降，至 Mc 約 0.8 後趨平，約為不可壓縮值的五分之一。",
    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n研究對象與動機（第 453 至 455 頁）：因超音速燃燒的需求而重新檢視可壓縮平面剪切層。過去單流實驗普遍觀察到成長率隨馬赫數下降，但當時多把成因歸給噴流與外界的密度比；Brown & Roshko (1974) 已指出密度效應遠小於超音速下所見，因此壓縮性本身才是關鍵。作者並指出，雙流剪切層若沿用實驗室座標衡量壓縮性並不合理——兩股皆為超音速但速度接近時，該層本質上並不算超音速。\n\n設備與量測（第 456 至 460 頁）：新建雙流吹放式風洞，兩側供氣獨立，更換中心體即可改變馬赫數與氣體組合；測試段高 23 mm、長 230 mm，每次運轉僅 1.5 至 2.0 s。以 20 ns 火花光源紋影做瞬時可視化。成長率由 Pitot 壓力剖面決定，Pitot 厚度定義為剖面自 5% 至 95% 的寬度。近拖曳邊處靜壓上升 20% 至 50%，故成長率只取下游等壓區（x 大於 75 mm）以最小平方直線擬合，整體誤差估計約 10%。\n\n對流馬赫數的導出（第 465 至 469 頁）：援引 Bogdanoff (1983) 隨不穩定波移動座標的想法定義 Mc。先以渦片線性解檢驗其收攏能力，再對亂流情形，以大結構之間鞍點兩側總壓相等（等靜壓、穩態）導出對流速度 Uc，得到聲速加權平均的形式。\n\n主要結果（第 470 至 471 頁）：直接把成長率對 Mc 作圖並不收斂，在高 Mc 反而上升，可見必須先除掉速度比與密度比的影響。作者以常數 0.17（取自 Brown & Roshko 1974）建立不可壓縮視覺成長率模型，再依 δpit,0 = 0.8 δvis,0 換算成係數 0.14 的 Pitot 版本。以此正規化後，資料大致收攏成單一曲線：正規化成長率隨 Mc 上升急遽下降，至 Mc 約 0.8 後趨平，約為不可壓縮值的五分之一。\n\n厚度定義的影響（第 465、473 頁）：δpit/δvis = 0.8 是取理論值 0.72 與自 Brown & Roshko (1974)、Konrad (1976) 反推的 0.90、0.83 的約略平均，作者自陳這個決定有些武斷，反映出不可壓縮異質剪切層的厚度資料稀少。把 Maydew & Reed 等人以渦度厚度量得的舊資料同樣正規化後（常數改為 0.085），曲線的定性行為相同，但趨平值落在約 0.4 而非 0.2，開始下降的位置在 Mc 約 0.4 而非 0.25。作者把此差異歸因於 δω/δpit 可能隨密度比與馬赫數變化。這是本站追問要對照的段落。\n\n機制詮釋與作者自陳的限制（第 473 至 476 頁）：成長率下降在 Mc 仍為次音速時就開始，且在 Mc 變成超音速之前大致完成，因此壓縮性是在任何震波或膨脹波出現之前就已起作用。作者提出的解釋是：Mc 越高，擾動越傾向把能量輻射到層外，而非擾動層本身。另指出有限厚度剪切層在對流座標中永遠存在一層次音速次層，故不論馬赫數多高都不會完全穩定。限制方面，全篇分析僅限二維擾動，實驗設置無法偵測斜向擾動，而斜波可使有效對流馬赫數下降、令流場重新變得本質次音速；結構是否展向連貫僅由紋影影像的清晰程度推測，作者自承是薄弱的論證。",

    contribution: "以線性空間穩定性理論分析兩股平行可壓縮流形成的剪切層，基本流取自可壓縮邊界層方程的解或雙曲正切剖面，黏性與非黏性擾動並計。三項結論：其一，可壓縮層的最大成長率隨速度比呈非線性變化，與不可壓縮層近乎線性的關係不同；其二，把成長率比對對流馬赫數作圖時，曲線幾乎與 M1、速度比、溫度比的個別取值無關，為 Bogdanoff 與 Papamoschou–Roshko 的對流馬赫數提供了比先前更全面的理論佐證；其三，溫度比的作用會隨馬赫數反轉——M1 小於約 1.5 時加熱慢流側是穩定化的，大於 1.5 之後反而變成不穩定化。作者並明確指出，層流線性理論與亂流實驗的吻合只到對流馬赫數約 0.8 為止。",
    summary: "本摘要由本站自出版社排版版 PDF（AIP）整理，頁碼為期刊印刷頁。\n\n目的（第 957 頁）：一是詳查速度比與溫度比對超音速混合層穩定性的影響；二是為 Bogdanoff 與 Papamoschou–Roshko 提出的對流馬赫數提供更全面的理論佐證——作者指出前人用來支持該參數的穩定性結果都只是單流（U2 = 0）的有限案例。\n\n方法（第 957 至 958 頁）：基本流為等靜壓下解可壓縮邊界層方程所得的層流混合層（Blasius–Lock），另一組則直接指定雙曲正切剖面並以 Busemann–Crocco 關係給溫度剖面。擾動採空間理論，容許二維與斜向波；黏性版本由線性化完整 Navier–Stokes 與能量方程導出，Prandtl 數取 0.72、比熱比 1.4、黏性用 Sutherland 公式。\n\n黏性與雷諾數（第 958 頁）：剪切層在所有雷諾數下皆不穩定，且 R 大於 1000 後成長率即趨近非黏性解，相速度幾乎與雷諾數無關。作者選擇用完整黏性方程計算，以避開非黏性方程在奇點附近須變形積分路徑的數值困難。\n\n速度比與溫度比（第 959 至 961 頁）：最不穩定頻率落在 ω 約 0.05 至 0.15 之間。提高 U2 會略微擴大放大頻帶；馬赫數對成長率的抑制在 U2 = 0 時最顯著，隨 U2 增大而減弱。只有不可壓縮情形的最大成長率隨速度比近乎線性，馬赫數一高就明顯非線性。溫度比方面，M1 小於 1.5 時加熱慢流側為穩定化，M1 大於 1.5 後反轉為不穩定化。第二模態（Mack 所稱的渦度波）在 M1 = 2.0、T2 = 0.5 時最大成長率甚至超過第一模態，但 T2 = 1.0 與 2.0 時仍以第一模態為主。\n\n對流馬赫數的驗證（第 964 至 965 頁）：作者假設最大成長率（對全頻率取極大）與剪切層展開率相關，定義成長率比 Rσ，對六組（U2, T2）組合、M1 自 0 掃到 4 或 6 計算。結果顯示 Rσ 與對流馬赫數的關係幾乎不受 M1、U2、T2 個別取值影響，僅在對流馬赫數大於 1 時略有分散；雙曲正切剖面給出的值略高於 Blasius–Lock 剖面。\n\n適用界線與作者自陳的限制（第 965 至 966 頁）：把 Papamoschou–Roshko 與 Chinzei 等人的亂流實驗資料疊上層流穩定性曲線後，兩者的走勢驚人地相似，但作者明講這只在對流馬赫數小於 0.8 時成立——更高時實驗資料趨平於約 0.25，層流穩定性比值卻持續下降。作者並特別聲明，該圖不應被讀成層流線性穩定性分析與亂流實驗資料的比較，其用意僅在證明對流馬赫數是可行的壓縮性參數。改用斜向波可把理論趨勢往實驗拉近到對流馬赫數約 1.3，但比值仍持續下降，作者明言趨平現象仍待進一步理論工作解釋。這是本站追問要對照的段落。",

    authors: "Elliott, G.S.; Samimy, M.",

    doi: "10.1063/1.857816",
    question: "亂流強度隨 Mc 的下降，與成長率下降是同一件事，還是兩個獨立現象？",
    contribution: "以雙分量同步 LDV 量測高雷諾數可壓縮自由剪切層的亂流場，把作者先前僅有的兩個相近對流馬赫數（0.51 與 0.64）延伸到 0.86，使原本不夠確定的結論得到支持。亂流擾動的強度與側向分佈範圍都隨 Mc 上升而下降，雷諾應力與擾動強度的最大值幾乎隨 Mc 線性遞減；偏度與峰度同樣下降，代表大尺度結構伸入自由流所造成的間歇性被顯著抑制。本篇對本站追問最關鍵的兩項陳述互為表裡：其一，壓縮性對成長率的影響約自 Mc = 0.5 開始，但對亂流擾動（尤其側向）的影響在更低的 Mc 就已出現；其二，由平均速度剖面推算的剪應力基本上等於動量厚度成長率乘上一個對 Mc 收攏良好的速度積分量，故剪應力的下降主要來自 dθ/dx 的下降。",
    summary: "本摘要由本站自出版社排版版 PDF（AIP）整理，頁碼為期刊印刷頁。\n\n研究對象與動機（第 1231 頁）：因超音速燃燒衝壓引擎的需求而研究壓縮性對自由剪切層亂流場的影響。作者先前的報告只有 Mc = 0.51 與 0.64 兩個相近的對流馬赫數，結論因此不夠確定；本文加入 Mc = 0.86 的第三例，並順帶檢驗 LDV 亂流量測的準確性。\n\n設備與條件（第 1232 至 1233 頁）：俄亥俄州立大學 AARL 的高雷諾數超音速吹放式雙流風洞，測試段 152.4 mm 見方，分隔板厚 3.175 mm、尾緣厚約 0.5 mm。第三例用標稱馬赫數 3.0 的噴嘴，總壓 265 kPa、總溫 276 K、速度 597 m/s；入流的超音速全紊流邊界層厚 9.2 mm、動量厚度 0.46 mm，對應動量厚度雷諾數 24700。次音速側以 M2 = 0.45 匹配靜壓，速度比 0.25、密度比 0.37。量測用雙分量同步 LDV，10 度離軸前向散射，兩股皆以直徑小於 1 μm 的霧化矽油播種，每通道 2048 個樣本。作者自陳樣本數對平均速度足夠，但若要降低亂流量的散布仍嫌不足。\n\n相似性與收攏（第 1234 頁）：以渦度厚度為基礎的相似參數不僅能收攏不同流向位置的速度剖面，還吸收了壓縮性效應，使不同 Mc 的平均速度剖面落在同一條雙曲正切曲線上；改用動量厚度為基礎則需要一個隨 Mc 變化的係數才收得攏。\n\n亂流量的下降（第 1235 頁）：側向擾動強度在次音速情形明顯高於本文所有超音速情形。最大雷諾應力在 Mc = 0.51 已比次音速結果低約 40%，更高 Mc 者再往下降；最大值幾乎隨 Mc 線性遞減。作者在此明講：即使壓縮性對成長率的影響約自 Mc = 0.5 才開始，對亂流擾動（尤其側向）的影響在更低的 Mc 就已經出現。這是本站追問要對照的段落之一。\n\n速度剖面收攏而雷諾應力不收攏的表面矛盾（第 1236 至 1237 頁）：作者援引 Lumley 在熱混合層中的類似弔詭（溫度剖面與熱通量），並依 Fernandez & Zukoski 的作法自平均速度剖面推算剪應力。結論是剪應力基本上等於動量厚度成長率乘上一個對不同 Mc 收攏良好的速度積分量，因此觀察到的下降主要來自 dθ/dx 隨 Mc 的下降。把直接量到的雷諾應力乘上密度比後，與推算值不只趨勢相同、量級也吻合；作者據此認為 Morkovin 假設在此類流場仍然成立，也說明約 1 μm 的矽油粒子確實跟得上大尺度結構。這是本站追問要對照的另一段。\n\n高階動差（第 1238 至 1239 頁）：偏度反映大尺度結構伸入自由流造成的間歇性，在次音速側為正、超音速側為負；不可壓縮結果在低速側的量值約為本文的 2.5 倍，v 分量偏度峰值也高約 30%。峰度在剪切層兩緣出現峰值，中央與自由流約為 3；不可壓縮情形在高速側約 8、低速側約 22。本文超音速側的峰度峰值隨 Mc 下降，作者解讀為吞噬式捲吸被抑制，與較低的成長率及捲吸率一致。\n\n作者自陳的限制（第 1239 頁）：高階動差建立在較小的樣本數上。Mc = 0.51 與 0.64 兩例的高階量（乃至雷諾應力與側向擾動）非常接近，作者認為是這兩個 Mc 太相近、統計不確定性遮蔽了差異，真正顯著的變化出現在與 Mc = 0.86 的對比。作者也表示希望與更高 Mc 的資料比較，但現有的直接量測多半帶有再循環流污染。",

    summary: "本摘要由本站自出版社排版版 PDF（AIAA，arc.aiaa.org）整理，頁碼為期刊印刷頁。\n\n動機與參數選擇（第 538 至 539 頁）：作者刻意採用相對馬赫數 Mr = ΔU/a 而非對流馬赫數 Mc，理由是 Mc 的推導依賴有組織大尺度結構之間的滯止壓力平衡，但這類結構在高雷諾數的完全發展可壓縮亂流混合層中並未被觀察到主導流場，且等熵滯止假設在高 Mc 下未必成立；兩者在比熱比相同時相差兩倍。\n\n設備與量測（第 539 至 540 頁）：伊利諾大學風洞，兩股空氣可各自加熱至總溫約 700 K。主流噴嘴標稱馬赫數 2 與 2.4，次流 1.4（亦可次音速運轉以拉高相對馬赫數）；兩股以 2.5 度夾角越過底高約 0.5 mm 的分隔板匯合，各股出口高約 24 mm、寬 96 mm。雙色雙分量 LDV 的兩分量與流向成正負 45 度以降低條紋偏差，量測體直徑約 0.17 mm、長約 1.4 mm，以平均粒徑約 0.3 μm 的二氧化鈦粒子播種，每點至少取 2000 個樣本。另以 0.497 μm 聚苯乙烯乳膠球對照，確認粒子跟隨性不構成問題。\n\n案例與發展準則（第 540 至 542 頁）：七組案例涵蓋速度比 0.16 至 0.79、密度比 0.57 至 1.55、Mr 0.40 至 1.97。完全發展所需的流向距離依序遞增：平均速度、縱向擾動強度、橫向擾動強度、雷諾應力；作者由 Bradshaw (1966) 的準則改寫出以局部厚度為基礎的判據 Reb = ρΔUb/μ 約 1×10⁵。\n\n相似性剖面（第 543 至 544 頁）：即使壓縮性最強的 case 5，平均流向速度剖面仍與誤差函數吻合。縱向擾動強度的峰值在各案例間相近，橫向擾動強度的峰值則隨 Mr 明確下降；正規化雷諾應力與含橫向速度分量的三重積亦然。混合長度除以局部厚度同樣隨 Mr 下降。\n\n各向異性與相關係數（第 544 頁，表 1）：σu/σv 的峰值依 Mr 遞增為 1.53、1.41、1.71、2.33、1.84、2.74、3.53。作者據此指出，以等向性亂流模型為基礎的數值模擬在高相對馬赫數下可能表現不佳。另一方面，雷諾應力相關係數在層中央幾乎為定值，七組的平均值僅落在 0.48 至 0.54 之間，並不隨 Mr 系統性變化。\n\n收斂性的正反證據（第 544 至 545 頁）：以不可壓縮混合層的峰值 0.18、0.14、0.013 分別正規化 σu/ΔU、σv/ΔU 與 −(u'v')/(ΔU)² 後，橫向擾動與雷諾應力隨 Mr 下降的走勢與正規化成長率一致，縱向擾動則幾乎持平。作者以 case 3 與 3r（密度比與 Mr 幾乎相同、速度比不同）正規化值相符為據，主張壓縮性效應主要由相對馬赫數決定，而非速度參數的函數。但作者同時列出不合趨勢的案例：case 1 與 1d 為最低 Mr，可能尚未完全發展、ΔU 偏小使百分比誤差放大，且速度比近 0.8 已接近尾流；case 3r 則因分隔板尖端兩股靜壓無法精確匹配而產生較強壓縮波，自由流均勻性與流向壓力梯度較差。需注意作者的收斂圖（圖 5）正規化的是成長率與三個擾動量，各向異性比本身並未以正規化形式呈現——本站自表 1 讀出：case 3（Mr 1.37）為 2.33、case 3r（Mr 1.44）為 1.84，相對馬赫數相近而差距不小，作者把 3r 的偏離歸因於上述波系污染。這是本站追問要對照的段落。",

    contribution: "以混合譜方法與高階有限差分求解完整可壓縮 Navier–Stokes 方程，對時間發展型混合層做三維直接數值模擬。線性穩定性給出明確門檻：Mc 小於 0.6 時最不穩定的是二維波，大於 0.6 之後改為斜波，且最不穩定波的角度滿足 Mc cos θ 約等於 0.6，故 Mc 越高斜度越大。以隨機噪音為初始條件的模擬重現了這個門檻，且未發現線性理論以外的其他不穩定模態。非線性階段沿襲線性趨勢：Mc = 0.4 仍是二維渦捲加流向編織渦，Mc = 0.8 與 1.05 則轉為傾斜的斜向渦，Mc 大於 1 時二維不穩定性對流場發展幾乎沒有影響。由一對等量反向斜波發展出的結構，是一對沿流向交錯排列的傾斜 Λ 渦。另一項發現是三維模擬中完全沒有出現震波，即使在同條件二維模擬必定產生震波的馬赫數下亦然。",
    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n方法（第 135 至 137 頁）：時間發展型混合層，流向與展向為週期性，法向截斷後施加非反射邊界條件。x 與 z 方向以傅立葉法求導，y 方向用六階修正 Padé 格式，時間推進採顯式 Runge–Kutta。黏性依冪次律取氮的指數，Prandtl 數與 Schmidt 數均取 1。網格自 16×99×16 起算，隨非線性增強加密至約 96×99×96，上限受 Cray X-MP 的儲存量與每次模擬 10 至 15 小時的計算時間限制。作者原本準備了震波捕捉格式，但發現三維高馬赫數下並未出現震波後，改為犧牲震波捕捉能力、換取更高的空間精度。\n\n線性穩定性門檻（第 138 頁）：Mc 小於 0.6 時二維擾動最不穩定；Mc 大於 0.6 時斜波最不穩定，且在兩側自由流溫度相等的情形下，最不穩定波的角度滿足 Mc cos θ 約等於 0.6。二維波的放大率隨 Mc 迅速下降，到 Mc = 1.2 時僅剩不可壓縮值的 10%。Mc 大於 1 之後另出現兩支相對某一側自由流為超音速的新模態，但成長率極小，且前作已證實其在非線性階段仍然很小。\n\n三個區間的劃分（第 140 頁）：(a) Mc 在 0 到 0.6 之間，二維不穩定性放大最快，但接近 0.6 時各種取向的波放大率已相當接近，可預期趨向三維；(b) Mc 在 0.6 到 1.0 之間，斜波最不穩定，但二維波仍在放大、仍可能有影響；(c) Mc 大於 1.0，二維不穩定性的放大率約為最不穩定斜波的五分之一，影響極小，此區至少延伸到 Mc = 3.2，即作者穩定性計算的上限。\n\n隨機初始條件的線性驗證（第 141 至 142 頁）：取 Mc = 0.4、0.8、1.05，對應 Re 為 400、600、800（高 Mc 需要更高 Re 才能進入高雷諾數漸近區）。在 y = 0 平面上畫 v = 0 的等值線：Mc = 0.4 明顯偏好展向結構；Mc = 0.8 與 1.05 的等值線取向與線性理論預測的 45 度與 60 度一致。未發現線性分析以外的不穩定模態。\n\n非線性演化（第 145 至 148 頁）：初始條件取二維波加一對等量反向斜波，相位設為對應 Pierrehumbert–Widnall 之 translative 次級不穩定模態者。模態能量顯示：Mc = 0.4 時二維波始終能量最高；Mc = 0.8 時斜波雖起始能量較低卻很快超越二維波；Mc = 1.05 時斜波能量高出一個數量級以上。等壓面顯示大尺度結構自二維渦捲加編織渦，轉為 Mc = 1.05 時的四個傾斜斜向轉動區。三維模擬中未出現震波，而同等雷諾數的二維模擬在 Mc 約 0.7 以上必定產生震波；作者據此推測三維流場的拓撲可在不需要震波的情況下達到滯止點，並指出這是 Papamoschou–Roshko 二維模型的可能限制。\n\n初始擾動的角色（第 149 至 150 頁）：在 Mc = 0.8 改用另一相位（低馬赫數下對應僅弱放大的 bulging 模態），發展出的結構細節不同，但三維程度相當。作者並明白指出，Mc 大於 1 時二維波放大得太弱，其相位幾乎不起作用。也就是說，轉為三維的門檻由 Mc 決定，初始擾動只改變三維結構的樣式，且影響隨 Mc 上升而遞減。這是本站追問要對照的段落。\n\n一般性檢驗與作者自陳的限制（第 150、154 至 156 頁）：以純隨機噪音為初始條件、Mc = 0.8 的模擬，發展出的結構與由一對斜波發展出者極為相似；即使兩支斜波被隨機種子激發的程度並不相同，也沒有出現單一斜波主導的情形。作者藉此說明模擬結果之所以形貌乾淨，是因為主要不穩定性主導流場，而非只是施加了乾淨的初始條件。限制方面：受解析度所限，模擬只能走到轉捩初期，無法計算後續的次級不穩定性與混合轉捩；作者相信完全發展亂流狀態下的最大尺度結構仍會類似，但明言這是信念推論而非計算結果。作者也指出高馬赫數下應存在某種次諧合併過程，作為低馬赫數二維配對過程的類比，但本文未能模擬。",

    contribution: "在新建的 GALCIT 雙流吹放式風洞中，以氦、氮、氬的不同組合產生等熵推算對流馬赫數自近零到約 1 的二維可壓縮剪切層，共 11 個案例。側視紋影顯示高壓縮性流場的低速側出現行進的壓縮波與膨脹波，由相對低速流以超音速對流的剪切層結構造成；由波角推得相對低速流的對流馬赫數落在 2.1 至 2.6，遠高於等熵壓力匹配模型給出的約 1，佐證了 Papamoschou 指出的對流馬赫數不對稱。成長率方面，等熵對流馬赫數大於 0.3 時與他人結果吻合良好；小於 0.3 時卻完全不收攏——第 7 至 9 例在極低壓縮性下反而出現成長率下降，而等熵對流馬赫數相同、僅高速側改為次音速的第 10、11 例幾乎回到理論不可壓縮值。另一項與追問直接相關的結果是：分隔板尖端壓力不匹配產生的強平面波雖使剪切層明顯彎折，下游視覺厚度仍在標稱值的 5% 以內；但較弱的平面波卻能讓原本看不到的二維大尺度結構出現。",
    summary: "本摘要由本站自出版社排版版 PDF（AIAA，arc.aiaa.org）整理，頁碼為期刊印刷頁。\n\n動機（第 2248 頁）：等熵壓力匹配模型在兩側靜壓與比熱比相近時會給出 Mc1 約等於 Mc2，但 Papamoschou 量到的對流速度顯示兩側總壓損失極不對等。Papamoschou 與 Dimotakis 因此推測震波只在剪切層的一側由亂流結構產生；然而這些模型所假設的強震波，在本文之前從未在剪切層實驗中被偵測到。本研究即為處理此問題並補充可與他人比較的成長率資料而設計。\n\n設備與診斷（第 2248 至 2249 頁）：GALCIT 超音速剪切層燃燒設施，雙流吹放式，標稱運轉時間 3 s（原為 H2/F2/NO 化學反應流設計，本文全為非反應實驗）。高速側固定為 M1 約 1.5 的超音速流，低速側為 M2 小於 0.5 的次音速流，不同壓縮性主要靠更換兩側氣體組合達成。診斷包括 20 ns 火花側視紋影、每側 6 個導壁靜壓計（其中少數為可解析時間的 1 MHz 壓電式）、16 支橫流總壓管與 16 支熱電偶。剪切層厚度採自紋影判讀的視覺厚度，量測站距分隔板尖端 0.38 m。低速側流場均勻性經皮托管確認在自由流速度的正負 1% 內；高速側分隔板尖端的邊界層計算為紊流（Rex 約 10⁶），位移厚度約 0.5 mm，分隔板尖端為 5 度收斂、尾緣半徑約 0.25 mm。不可壓縮成長率的正規化採 Brown 的表達式，常數取 0.17。\n\n行進波與對流馬赫數不對稱（第 2250 至 2251 頁）：壓縮性最高的第 1 例在低速流中出現規則的行進波系，由剪切層發出並經下導壁反射，壓縮波與膨脹波交替出現以維持可忽略的流向壓力梯度。波的特徵間距與局部剪切層厚度同量級，暗示確有某種大尺度結構存在，但紋影本身看不到展向連貫的大尺度結構。波角緊密集中在 23 至 28 度之間，據此推得相對低速流的對流馬赫數為 2.1 至 2.6；兩個相距 5 cm 的壓電壓力計互相關的峰值落在 59 μs，佐證了同一結論。取 Mc2 約 2.54 則關係式要求 Mc1 約 0.31。作者同時指出困難處：觀察到的行進波太弱，不足以提供調和滯止點壓力匹配模型所需的總壓損失；若把再壓縮過程模型化為單一正震波，所需的震波馬赫數約為 7，而這種強震波在任何實驗中都未被偵測到。\n\n成長率的收攏與不收攏（第 2252 頁）：11 個案例的正規化成長率對等熵推算的對流馬赫數作圖，並與他人資料並列。等熵對流馬赫數大於 0.3 時收攏良好，且高壓縮性下成長率明確偏低，與線性穩定性理論一致。但小於 0.3 時資料完全不收攏：第 7 至 9 例在極低壓縮性下反而出現成長率下降，而第 10、11 例為全次音速流，等熵對流馬赫數與第 8、9 例相同，成長率卻幾乎回到理論不可壓縮值。作者明確點出，這兩組之間唯一的實質差別是高速側 M1 大於 1 或小於 1；雷諾數、速度比與密度比（第 10 例除外）大致相同。這是本站追問要對照的段落。\n\n低密度比的角色（第 2252 至 2253 頁）：第 7 至 9 例的密度比低於圖中所有其他可壓縮流場（第 8、9 例分別為 0.10 與 0.058），這是以增加低速側氦含量來製造低壓縮性流場的必然副產品。作者強調低密度比本身不會造成異常低的成長率——本研究第 11 例，以及 Brown & Roshko、Frieler & Dimotakis 的低密度不可壓縮結果都是反證——只有低密度比與超音速自由流馬赫數兩者耦合才出現。作者推測高速側的雙曲性會抑制由下游往上游的回饋機制，並明言這個新機制與 Koochesfahani & Frieler 所指的尾流效應無關。第 8、9 例的密度比落在不可壓縮實驗資料庫之外，故無法排除行為出現質變的可能。\n\n入射波的影響（第 2253 頁）：兩個偏離設計點的第 3 例最直接回答本站的追問。其一，分隔板尖端因兩側靜壓嚴重不匹配而產生強平面波，該波經上導壁與剪切層反射並使剪切層明顯彎折，但下游的視覺厚度仍在標稱值的 5% 以內——成長率對入射震波與膨脹波相對不敏感。其二，另一個尖端波較弱的案例，剪切層卻出現可觀的二維大尺度結構，而這在正常壓力匹配的流場中從未出現；作者推測是尖端平面波經由某種共振強迫促成了二維結構。作者同時指出，在可取得資料的偏離設計點流場中，只有少數表現出這種結構增強，顯示要達到所需的共振並不容易。\n\n作者自陳的限制（第 2251 至 2253 頁）：紋影是展向積分的可視化，無法斷定看不到大尺度結構是因為三維扭曲，還是被疊加的小尺度高梯度界面遮蔽；同樣的理由也可能掩蓋內嵌的震波。低壓縮性分支的成因作者自承所知甚少。",

    contribution: "以平面雷射米氏散射（PLMS，凝結酒精霧）與一氧化氮的平面雷射誘導螢光（PLIF），在側視、俯視與端視三個切面成像，量測對流馬赫數 0.28、0.42、0.50、0.62、0.79 的雙流平面混合層。結論是大尺度結構並未消失，而是改變了性質：Mc = 0.28 與 0.42 由展向渦捲主導，0.62 與 0.79 轉為明顯三維、外觀無序的結構，0.50 為過渡狀態、兩類結構並存。渦捲核心的形狀自橢圓轉為多邊形，編織區出現特徵性的扭折。捲吸方式隨之改變：低 Mc 的混合分率場沿流向傾斜而橫流方向均勻，高 Mc 則常沿橫流方向傾斜、甚至出現兩層分明的混合區。PLIF 統計顯示兩例的平均剖面相近，但 Mc = 0.62 的均方根擾動約小 15%，且在層的高速側特別受到抑制。",
    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n方法的用意（第 171、174 至 179 頁）：本研究刻意採用平面雷射切面成像，而非紋影這類沿展向積分的整合式技術。PLMS 用凝結的酒精霧滴，分產物生成模式與被動純量模式；PLIF 則以摻入的一氧化氮定量取得混合分率場。三個切面（側視、俯視、端視）並用，正是為了判別結構的三維性。\n\n紋影本身的技術侷限（第 183 頁）：在 Mc = 0.28 的側視紋影中，Brown–Roshko 大尺度結構可持續到數千倍的 x/θ 與很高的局部雷諾數（以視覺厚度計約 380000）。此結果與 Chinzei 等人 (1986) 的低對流馬赫數紋影一致，卻與 Goebel & Dutton (1991) 及 Hall 等人 (1991a) 不一致——後兩者看到的 Brown–Roshko 結構並不主導。作者直接指出：這種分歧可能來自紋影技術本身，因為刀口位置不同會強調不同類型的結構。這是本站追問要對照的段落之一。同頁的成長率彙整圖也引用 Papamoschou & Roshko (1988) 的提醒：壓縮性對不同的厚度定義可能作用不同。\n\n結構性質的轉變（第 199 至 201 頁）：PLMS 顯示混合層自低對流馬赫數的準二維，明確轉變為中等對流馬赫數的三維。與此同時，渦捲本身也在變：Mc = 0.28 時核心外觀相對圓潤或橢圓，Mc 升高後逐漸變成方形或多邊形；編織區則發展出一個扭折，在 Mc = 0.5 與 0.62 特別明顯，Mc = 0.28 完全看不到。作者明言這種渦捲變化的原因不明，且似乎未被線性穩定性理論或既有模擬預測到。\n\n究竟是物理還是可視化（第 202 頁）：這是本站追問最直接的對應段落。作者指出 Sandham & Reynolds (1991) 模擬出的髮夾型渦結構在本研究的可視化中並不明顯，並列出三種可能：其一，這些結構在真實流場中不存在；其二，我們沒有用對的技術去看它；其三，結構存在，但同時存在許多其他模態，使任何單一模態都難以分辨。作者明白寫下：不知道哪一種解釋才對。接著補充兩點佐證：Chen (1991) 的模擬顯示，即使渦結構是有組織的，被動純量場仍可能看起來無序，因為純量場同時受到當下與過去渦運動的影響；而第三種解釋也有道理，因為線性理論預測在本研究最高的對流馬赫數下，許多不同角度的斜波放大率相當接近，加上超音速風洞本身有顯著的聲學擾動，可能形成一組複雜的交互作用模態。作者並註明此議題仍有分歧，Samimy 等人 (1992) 與 Elliott 等人 (1993) 都回報了與 Sandham–Reynolds 相似的結構。\n\n排除雷諾數效應（第 202 頁）：作者強調觀察到的二維轉三維不是雷諾數效應。理由有二：其一，雷諾數自 x = 15 cm 到 45 cm 變化達三倍，若是雷諾數效應，結構應沿測試段由前到後改變，但所有可視化都顯示同一馬赫數下流場性質在各區域相同；其二，Mc = 0.28 在 x = 45 cm 與 Mc = 0.62 在 x = 15 cm 的雷諾數幾乎相同，兩處的亂流結構卻完全不同。\n\nPLIF 統計與混合（第 207 至 213 頁）：Mc = 0.28 與 0.62 兩例的混合分率平均剖面相近，但後者的均方根擾動約小 15%，且在高速側特別受抑；兩例的機率密度函數都有一個橫越層移動的峰，但 Mc = 0.28 的個別分佈通常較寬。這些統計與定性觀察一致：Mc = 0.62 時純流體侵入層內的情形較少，高速側的純量梯度也較弱。作者推論壓縮性增加了大尺度的攪拌，照理有助於混合，但隨即指出先前的混合量測並不支持此推論——壓縮性看來反而降低、或幾乎不影響分子尺度的混合效率。\n\n作者自陳的限制：髮夾渦是否存在的三種解釋，作者明言無法判定；紋影結果與他人不一致的成因也只能歸於技術差異的推測。",

    question: "若壓縮性不是透過膨脹耗散起作用，抑制機制究竟落在能量收支的哪一項？",
    contribution: "以四組對流馬赫數 0.2、0.6、0.8、1.2 的時間發展型混合層 DNS 資料庫（皆解析到小尺度、含完整能量串級）逐項檢視能量收支，回答成長率為何隨壓縮性下降。結論分兩步：其一，排除膨脹類機制——即使 M = 1.2 的流場中出現渦震波，膨脹耗散仍遠小於總耗散，壓力-膨脹項雖略大卻反覆變號、同樣不顯著；其二，指認真正的機制——藉由積分生成項與成長率的精確關係，配合雷諾應力張量的積分方程，顯示成長率的下降來自壓力-應變項的減弱，而壓力-應變的減弱又源於壓力擾動本身被壓抑。作者並給出物理解釋：自由流壓力相對於 ρ(ΔU/2)² 以 1/(γM²) 下降，若壓力擾動維持不可壓縮時的量級，高馬赫數下會出現負壓，故壓力凹陷必須變淺。作者據此建立以可壓縮渦模型與音速渦概念為基礎的確定性模型，再以簡單的各向異性考量封閉，所得預測與 DNS 統計吻合良好。",
    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n資料庫與設定（第 237 至 238 頁）：時間發展型混合層，兩側自由流速度等值反向，直接數值模擬完整可壓縮 Navier–Stokes 方程，涵蓋對流馬赫數 0.2、0.6、0.8、1.2 四例（結合不同研究群既有的資料庫，故數值方法不盡相同：0.2 與 0.6 用加權四階中央差分，0.8 用傅立葉配置加 Padé，1.2 在偵測到夠強的震波時切換為三階上風 MUSCL 格式）。流向與展向為週期性，法向在 M = 0.8 用特徵非反射條件、其餘用自由滑移壁。初始擾動取自線性穩定性理論：M 至 0.6 最不穩定模態為二維，更高則為三維，故 0.8 與 1.2 只用一對等量反向斜模態。四例的成長率分別為 0.072、0.058、0.038、0.030，M = 1.2 約為 M = 0.2 的 40%，與實驗觀察到的下降幅度大致相符。\n\n排除膨脹類機制（第 244 頁）：把總耗散拆為螺線部分與膨脹部分。即使在含渦震波的階段，膨脹耗散仍極小；壓力-膨脹項略大，但在模擬過程中多次變號，相對總耗散同樣不顯著。對流馬赫數較低、不含渦震波的案例，這兩項更小。作者的結論很明確：渦震波確實會提高膨脹類項，但其貢獻相對總耗散太小，不足以解釋成長率下降；受壓縮性影響遠大的是生成項與壓力-應變項，因此下降必須從這兩項來解釋。這是本站追問要對照的段落之一。\n\n定位到壓力-應變（第 245 至 246 頁）：作者先指出成長率的下降無法用生成項與壓力-應變項的比值來解釋——兩者都隨馬赫數大幅下降，比值只略降。改由對角雷諾應力方程著手：積分後的方程顯示，雷諾應力各向異性項與耗散各向異性項相對都小，於是成長率與對角壓力-應變分量之間存在近似的正比關係，並為資料所證實。若亂流為等向，這個關係會化為成長率與快速壓力-應變項的精確正比。\n\n壓力擾動被壓抑的物理理由（第 247 頁）：無因次化後自由流壓力等於 1/(γM²)，四例的參考壓力分別印為 16.85、1.98、1.12、0.50。由於近乎不可壓縮情形（M = 0.2）的壓力凹陷量值已明顯大於 M = 1.2 的自由流壓力，壓力凹陷必須隨馬赫數變淺，否則最小壓力會變成負值。壓力擾動的縮減使壓力-應變項（尤其快速部分）減弱，作者遂以一個描述壓力極值縮減的因子建模。這是本站追問要對照的另一段。\n\n模型與其修正（第 248 至 252 頁）：以可壓縮渦模型與音速渦概念把壓力極值表為對流馬赫數的函數，完成等向近似下的模型；該模型能定性重現成長率下降，但在高馬赫數下預測值偏低。再納入各向異性修正後，對成長率下降的定量預測明顯改善，並能同時預測積分雷諾應力、壓力-應變項與耗散隨馬赫數的變化。\n\n作者自陳的限制（第 238、242 至 243 頁）：DNS 難以達到嚴格自相似，因為齊次方向的計算域有限，會縮小統計樣本並在模擬後期限制大尺度結構成長；以三條不同關係式回推的成長率與直接量得者最大相差 9%、10%、16%，作者以此作為偏離自相似程度的量度，並認為誤差小到足以支持分析。此外所有模擬都在低雷諾數下進行，串級的尺度範圍可能不足以建立小尺度等向性，故耗散張量的對角分量呈現可觀的各向異性，與極高雷諾數下的等向耗散假設不同。",

    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n設備與條件（第 194 至 199 頁）：大型吹放式風洞，三個工況刻意逼近 Island (1997) 的 Mc = 0.25、0.63、0.76 以便對照，其中 Mc = 0.76 藉由低速側改用氬氣提高剪力達成。PIV 以 2000×2000 像素、9 μm 像元的慢掃描非增強型 CCD 於 90 度方向取雙曝光粒子影像，200 mm 微距鏡通常收至 f/16 以兼顧粒子像大小與景深；兩個可壓縮工況在成像光路中加入旋轉鏡以放大位移、容許更短的曝光間隔。位移場以 FFT 自相關求得，再由自製軟體控制驗證、內插與平均——作者指出自相關常被詬病的方向模糊在本流場中不成問題，因為速度向量所在的半平面可事先指定。紋影顯示低壓縮性下的展向連貫渦捲，在高壓縮性下讓位給較無組織、瀰散的外觀。作者同時誠實列出實驗流場與理想平面剪切層的差異：流場受側壁侷限且下游壁面已近到會影響成長、分隔板兩側與尖端有邊界層與有限厚度而在發展初期引入尾流成分、超音速側存在來自邊界層分離與壁面接合處的波系（壓力量測顯示這些波很弱）。\n\n瞬時結構（第 207 至 209 頁）：可壓縮情形下的高渦度區傾向組織成數層沿流向的薄片，出現在不同的橫向位置，平均為兩層（偶爾一層或三層）。這些薄片橫跨層厚的比例小於不可壓縮的渦捲，彼此之間橫向連通很少，作者據此推論跨層的流體輸送是斷續進行的：在大梯度區快速通過，在其間相對無旋的空間則受阻。移動座標下的瞬時流線顯示，結構自不可壓縮時的圓潤連貫，隨壓縮性增加而逐漸扁平、傾斜並瓦解。作者自陳這些觀察建立在代表性影像的取樣上，並註明不可壓縮的渦度場未必總是呈現清楚的渦捲與編織結構，可壓縮情形的薄片結構偶爾也會退化為較無組織的渦度分佈。\n\n與既有量測的自洽性（第 209 至 212 頁）：這是本站追問要對照的段落。平均流向速度剖面在三個壓縮性下收攏極佳，作者特別點出，速度量值場在瞬時場中的顯著差異在平均後被完全抹平，正說明瞬時診斷對辨識結構的價值。平均展向渦度剖面同樣收攏，且落在 −∂u/∂y 曲線上，反過來驗證了由速度場計算渦度的作法。統計量方面：流向擾動強度的峰值在整個壓縮性範圍只略降，與逐點量測（Goebel & Dutton 1991）及 DNS（Freund 1997）一致；橫向擾動強度則被大幅壓抑，自 Mc = 0.25 到 0.63 下降 28%，但效應隨即飽和，Mc = 0.76 的峰值僅再低 7%；雷諾應力的衰減達 29%。擾動不對稱度 σu/σv 與雷諾應力相關係數也與 Goebel & Dutton (1991) 吻合，其中相關係數的峰值約 0.6，對壓縮性相對不敏感。作者總結：本研究的雷諾應力與前人逐點量測在絕對量值與隨壓縮性的走勢上都吻合良好，等於驗證了粒子、成像系統與分析技術；以平面掃描得到的亂流統計量，已可與最嚴謹的逐點研究相比，空間解析度約 0.9 mm 與 LDV 相當。\n\n二維散度與音速線（第 210、219 頁）：平面技術只能算出散度的兩個分量，作者明講這只是壓縮性現象存在與否的粗略指標，其粗糙程度反映在橫向剖面的散布上。儘管如此，兩個可壓縮工況的峰值明顯高於不可壓縮情形，且峰值位置靠近橫向的音速線位置，與高梯度區位於實驗室座標音速線附近的觀察互相呼應，暗示流場對駐留擾動敏感。\n\n整體結論（第 218 至 219 頁）：本研究記錄到速度場的壓縮性結構變化，與先前在純量場觀察到的變化相對應；壓縮性藉由中斷橫向連通而妨礙混合的想法，得到速度梯度場與渦度場行為的支持，也與音速渦模型一致——該模型預測有效捲吸運動的長度尺度受限於能跨越約當地音速之速度差的尺度。",

    contribution: "Heller 與 Bliss 將開放式凹槽振盪描述為外部剪切層、凹槽內部雙向壓力波、前緣反射與尾緣週期性質量交換所構成的自持回授系統。作者提出 mass-addition／mass-removal 與 pseudopiston 概念，說明尾緣剪切層位移如何透過淨體積流率驅動凹槽內部壓力波。研究並建立上游衰減波與下游放大波的兩波模型，指出 Rossiter 型關係可預測候選共振頻率，但不能單獨預測模態起振、主導模態或飽和振幅。大型風洞實驗顯示第二模態經常占優勢，實際模態形狀因尾緣非理想反射而偏離封閉腔體。研究亦以物理機制為基礎驗證上游擾流片、傾斜尾緣及分離式尾緣整流罩等抑制方法，其中傾斜尾緣能穩定剪切層並削弱相干質量交換，是最具潛力的被動方案之一。",
    summary: "本摘要由使用者依 AFFDL-TR-74-133 原始報告整理後提供，本站未取得原文。原始掃描件的 OCR 對公式與部分圖說辨識不佳，若要逐字引用公式、數值或圖表，須回到對應頁面影像人工核對。\n\n工程問題：高速外流掠過開放式凹槽時，開口上方形成自由剪切層，與凹槽內可壓縮流體、前後壁面及尾緣流動耦合後，可能產生高強度窄頻的近週期壓力振盪。跨音速條件下共振頻率附近的壓力級可接近 180 dB，影響鄰近結構、儀器、通訊與乘員環境。因此不只要預測頻率，也要理解模態強度、起振條件與被動抑制。\n\n方法：理論上把問題視為剪切層、凹槽內上下游行進波、尾緣週期性質量進出三者的耦合系統，以剪切層上下兩側的可壓縮波動方程建立色散關係，取主要上游波與下游波構成兩波模型。實驗分三層：傾斜水桌的淺水類比用來直接觀察剪切層振動、內部波傳播、前緣反射與尾緣質量交換；BBN 小尺度壁面噴流設施做次音速探索與幾何快篩；大尺度實驗在 NASA Lewis 8 × 6 ft 跨音速風洞完成，馬赫數約 0.8 至 2.0，凹槽長 36 in、寬 9 in、深度可調，L/D 約 2.25 至 6.0。\n\n尾緣質量進出機制：剪切層向下偏轉時尾緣區有額外流體進入凹槽（mass addition），抬升內部壓力並產生朝前緣傳播的壓縮波；向上偏轉時原本維持穩態質量平衡的尾緣流入受到抑制，這種相對於穩態流入量的減少即為等效的 mass removal，不一定代表有等量流體直接射出。週期性的質量進出造成凹槽流體壓縮與膨脹，成為內部壓力波與自持振盪的驅動機制。\n\nPseudopiston：尾緣的三維非線性質量交換難以直接寫成邊界條件，作者將其淨體積流率等效為位於凹槽後壁的振動活塞。這不表示實體壁面會動，而是把複雜的尾緣流動轉成聲學與波動模型中可處理的邊界條件。\n\n兩波結構：向上游傳播的波由尾緣移向前緣，並向外部流場輻射能量，因此沿途衰減；向下游傳播的波由前緣反射後與剪切層耦合，可從平均流抽取能量而空間放大。兩者相速度與放大率不同，疊加後形成類駐波的壓力分布、節點腹點與多階縱向模態。\n\n凹槽不是理想剛壁聲腔：前壁可近似為反射邊界，但尾緣開口與動態剪切層不是理想硬壁。因此壓力節點偏離理想封閉腔體，尾緣附近的壓力最大值常落在實體尾壁上游，壓力振幅通常由前緣往尾緣增加，聲學有效長度短於幾何長度，模態形狀隨馬赫數與 L/D 改變。\n\n能量條件：振盪能否發展取決於回授相位，也取決於迴路增益。下游波從平均流取得能量，上游波因聲輻射而損失，黏性、湍流與內部再循環提供耗散。輸入大於損失才會成長為自持振盪。因此共振頻率條件只能指出可能發生振盪的頻率，不能保證該模態出現，也不能單獨預測振幅。\n\n與 Rossiter 模型的關係：本報告不應被描述為否定 Rossiter 模型。作者接受前緣至尾緣的下游傳播時間與尾緣回傳時間是頻率選擇的重要因素，Rossiter 的回授時間尺度能有效預測允許的離散頻率。他們質疑的是以離散渦旋脫落、撞擊尾緣、產生聲波這個圖像去解釋所有流況的基本物理並不充分——尤其超音速下剪切層可維持明顯波狀卻不必然形成清楚的離散渦旋。離散渦旋應視為某些條件下剪切層波動的非線性表現，而非唯一驅動源。作者採用先前修正過的 Rossiter 型關係，主要修正是以較接近凹槽總溫條件的內部聲速描述回傳波，並認為該式在約 0.5 < M∞ < 3.0 範圍內是當時最可靠的頻率預測方法之一。\n\n模態行為：可觀察到至少前五階離散模態，第二模態經常是壓力最強的主導模態。淺凹槽（L/D 大於 2）的無因次頻率對長深比依賴較弱，低速時長深比效應較明顯。壓力場同時含高強度離散音調與剪切層湍流造成的寬頻成分，尾緣區兩者都高於前緣區。模態強度隨馬赫數並非單調增加，部分模態在跨音速附近較強，更高超音速下因剪切層可壓縮性穩定效應而降低。\n\n抑制設計：有效者三種。上游擾流片在適當角度下可使主導模態降約 20 dB，其機制不宜簡化為讓剪切層更穩定，較準確的說法是向來流引入渦度、加厚或擾亂邊界層，降低剪切層形成高度相干週期振動的能力，從而削弱回授增益。傾斜尾緣最具潛力，斜面改變剪切層接近尾緣時的局部流動，使其不再於單一明確位置進行高度相干的週期撞擊與質量交換，可大幅降低甚至消除離散音調。分離式尾緣整流罩改變尾緣附近的流體通道，部分流況有效，但須同時考慮寬頻壓力、阻力代價與可用容積。無效者包括凹槽內部橫向擾流片、內部穿孔擋板、上游小型共振凹槽、部分斜置前後壁組合、前緣強制導入空氣、圓弧前緣配導流片；部分裝置雖降低離散音調卻抬高寬頻噪音，不算總體改善。\n\n理論限制（作者自陳）：兩波模型在高馬赫數下能合理說明波動結構，但低馬赫數下會高估下游波的空間放大率，使模型很快被下游放大波支配，無法形成實驗中的多個壓力節點與高階模態。作者歸因於把剪切層假設為無限薄渦片、未納入有限厚度與實際速度分布、未包含渦旋捲起提供的非線性振幅限制，以及尾緣質量交換相位與形狀的簡化。理論主體為二維線性無黏，也不能可靠預測各模態的飽和振幅。",
    pages: null,
    biblioCheck: "verified",
    note: "書目辨識：本筆應辨識為技術報告 AFFDL-TR-74-133，不可與 AIAA Paper 75-491 併為同一筆。執行機構為 Bolt Beranek and Newman Inc.（Cambridge, Massachusetts），合約編號 F33615-73-C-3075，正式報告日期 1975 年 2 月，前言記載手稿於 1974 年 11 月提交——報告編號中的 74 來自交稿年份，年份欄位採正式出版年 1975。核心貢獻與重點摘要均改寫自使用者依原報告整理的說明，本站未取得原文，故 pages 維持空白。"

function cardHTML(p){

  /* 每筆都給一個入口：有 DOI 的直達出版社，沒有的用標題丟去 Google Scholar 搜。
     這裡不寫入任何書目欄位，只是把既有的 title 組成查詢網址。 */
  const find=` · <a class="find" href="https://scholar.google.com/scholar?q=${encodeURIComponent(p.title)}" target="_blank" rel="noopener" title="用標題到 Google Scholar 搜尋全文">找全文 ↗</a>`;
  /* url 是選填欄位：確定可取得全文時才填，沒填就只顯示上面的搜尋連結。 */
  const url=p.url?` · <a href="${esc(p.url)}" target="_blank" rel="noopener">全文 ↗</a>`:"";
  return `<article class="card" id="c-${esc(p.id)}" data-done="${done[p.id]?1:0}">
    <div class="card-top">
      <span class="c-num">${seqOf(p)}</span>
      <span class="c-id">${esc(p.id)} · ${p.year}</span>
      <span class="tag">${esc(p.method)}</span><span class="tag">${esc(p.topic)}</span>
      <span class="tag${c.w?" warn":""}">${c.t}</span>
    </div>
    <h3>${esc(p.title)}</h3>
    <div class="meta">${esc(p.authors)}<br><span class="vn">${esc(p.venue)}</span>${doi}${url}${find}</div>
    <div class="q"><span class="l">追問</span>${esc(p.question)}</div>
    ${p.contribution
      ?`<div class="contrib"><span class="l">核心貢獻</span>${esc(p.contribution)}</div>`
      :`<div class="contrib todo"><span class="l">核心貢獻</span>待補 —— 尚未讀原文，不預先填寫。</div>`}
    ${p.summary?`<details class="sum"><summary>重點摘要</summary><div>${esc(p.summary)}</div></details>`:""}
    ${p.note?`<div class="nb">${esc(p.note)}</div>`:""}
    <div class="card-foot">
      <button class="done" data-id="${esc(p.id)}" aria-pressed="${done[p.id]?"true":"false"}">${done[p.id]?"✓ 已細讀":"標記為已細讀"}</button>
      <span class="pg">${p.pages?"頁碼："+esc(p.pages):"頁碼：待補"}</span>
    </div></article>`;
}

function paintCards(t){
  const items=ORDER[t].filter(p=>{
    if(state.methods.size&&!state.methods.has(p.method))return false;
    if(state.topics.size&&!state.topics.has(p.topic))return false;
    if(state.q){const h=[p.title,p.authors,p.venue,p.question,p.contribution,p.topic,p.id].join(" ").toLowerCase();
      if(!h.includes(state.q))return false;}
    return true;});
  const el=document.getElementById("cards");
  el.innerHTML=items.length?items.map(cardHTML).join(""):`<div class="empty">沒有符合的文獻。放寬篩選，或在 LIBRARY 陣列新增一筆。</div>`;
  el.querySelectorAll(".done").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id; done[id]?delete done[id]:(done[id]=1); save();
    paintCards(t); paintRail(t); paintRoute(); paintXP();});
}

function paintRail(t){
  const items=ORDER[t], Y0=1930,Y1=2030, pos=y=>((y-Y0)/(Y1-Y0))*100;
  let h='<div class="rail-ax"></div>';
  for(let y=Y0;y<=Y1;y+=10) h+=`<div class="rail-dec" style="left:${pos(y)}%"><span>${y}</span></div>`;
  const seen={};
  items.forEach(p=>{const n=(seen[p.year]=(seen[p.year]||0)+1)-1;
    h+=`<button class="rail-t" data-id="${esc(p.id)}" data-done="${done[p.id]?1:0}"
        style="left:${Math.min(99.6,pos(p.year)+n*0.55)}%" aria-label="${esc(p.year+" "+p.title)}">
        <span class="tip">${p.year} · ${esc(p.authors.split(";")[0])}</span></button>`;});
  const el=document.getElementById("rail"); el.innerHTML=h;
  el.querySelectorAll(".rail-t").forEach(b=>b.onclick=()=>
    document.getElementById("c-"+b.dataset.id)?.scrollIntoView({block:"start"}));
}

/* ---------- 側欄 ---------- */
function paintRoute(){
  const g=t=>{const T=TRACKS[t];return `
    <div class="r-group"><i style="background:${AC[t].ac}"></i>軌道 ${t} · ${esc(T.label)}</div>`+
    ORDER[t].map((p,i)=>`<button class="r-item${state.view===t.toLowerCase()?"":""}" data-id="${esc(p.id)}" data-t="${t}" data-done="${done[p.id]?1:0}">
      <span class="r-num">${done[p.id]?"✓":i+1}</span>
      <span class="r-txt"><span>${esc(p.method)} · ${p.year}</span><b>${esc(p.title)}</b></span>
    </button>`).join("");};
  const el=document.getElementById("rlist"); el.innerHTML=g("A")+g("B")+g("C");
  el.querySelectorAll(".r-item").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t.toLowerCase();
    if(state.view!==t){ location.hash="#/"+t; setTimeout(()=>document.getElementById("c-"+b.dataset.id)?.scrollIntoView({block:"start"}),90); }
    else document.getElementById("c-"+b.dataset.id)?.scrollIntoView({block:"start"});
    document.getElementById("route").classList.remove("open");});
  document.getElementById("rhome").setAttribute("aria-current",state.view==="home"?"page":"false");
}

function paintXP(){
  const n=Object.keys(done).filter(k=>LIBRARY.some(p=>p.id===k)).length, tot=LIBRARY.length;
  document.getElementById("xpv").textContent=(n*20)+" XP";
  document.getElementById("xpb").style.width=(tot?n/tot*100:0)+"%";
  document.getElementById("xpc").textContent=n+"/"+tot;
}

/* ---------- 路由 ---------- */
function route(){
  const h=location.hash.replace("#/","").toLowerCase();
  const v=(h==="a"||h==="b"||h==="c")?h:"home";
  state.view=v; document.documentElement.setAttribute("data-view",v);
  const main=document.getElementById("main");
  if(v==="home"){ main.innerHTML=viewHome();
    main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash="#/"+b.dataset.go.toLowerCase());
  }else{
    const t=v.toUpperCase();
    state.methods.clear(); state.topics.clear(); state.q="";
    main.innerHTML=viewTrack(t);
    main.querySelectorAll(".chip[data-b]").forEach(b=>b.onclick=()=>{
      const bucket=b.dataset.b==="m"?state.methods:state.topics, val=b.dataset.v;
      const on=b.getAttribute("aria-pressed")==="true";
      b.setAttribute("aria-pressed",String(!on)); on?bucket.delete(val):bucket.add(val);
      paintCards(t);});
    document.getElementById("srch").oninput=e=>{state.q=e.target.value.trim().toLowerCase();paintCards(t);};
    document.getElementById("rst").onclick=()=>{state.methods.clear();state.topics.clear();state.q="";
      main.querySelectorAll(".chip[data-b]").forEach(c=>c.setAttribute("aria-pressed","false"));
      document.getElementById("srch").value=""; paintCards(t);};
    paintRail(t); paintCards(t);
  }
  paintRoute(); paintXP(); window.scrollTo(0,0);
}
addEventListener("hashchange",route);
document.getElementById("routebtn").onclick=()=>document.getElementById("route").classList.toggle("open");
route();
</script>
</body>
</html>
