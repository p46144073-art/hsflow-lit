<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高速流場文獻導引｜三條可追證據的閱讀路線</title>
<meta name="description" content="超音速剪切層與凹槽流場、Taylor–Maccoll 三維錐流理論解、三維錐流風洞實驗與紋影實證：48 篇文獻與 3 本參考書，以追問句串起的三條閱讀路線。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   配色：風洞報告 / 藍圖。冷調紙面 + 深藍墨卡片 + 金色重點。
   ===================================================================== */
:root{
  --paper:#EBEEF2; --white:#FFFFFF; --paper-2:#F5F7F9;
  --ink:#141C28;   --ink-2:#1E2A3C;  --ink-3:#2A3A50;
  --line:#D5DBE3;  --line-2:#E4E9EF;
  --txt:#18202C;   --dim:#5D6B7E;    --dim-2:#8A97A8;
  --gold:#F0B429;  --blue:#2B57D6;
  --teal:#0E8A8A;  --teal-lite:#E3F2F2;  --teal-bright:#4FC6DE;
  --rust:#B4611A;  --rust-lite:#FBEFE0;  --rust-bright:#E8A03C;
  --iris:#5B57A6;  --iris-lite:#EDECF8;  --iris-bright:#8F8AD8;
  --hue:var(--blue); --hue-lite:#E7ECFB;
  --disp:"Archivo","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,Menlo,monospace;
  --side:296px; --top:62px;
}
[data-view="a"]{ --hue:var(--teal); --hue-lite:var(--teal-lite); }
[data-view="b"]{ --hue:var(--rust); --hue-lite:var(--rust-lite); }
[data-view="c"]{ --hue:var(--iris); --hue-lite:var(--iris-lite); }

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } }
body{
  margin:0; background:var(--paper); color:var(--txt);
  font-family:var(--body); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{ color:var(--hue); text-decoration:none; }
a:hover{ text-decoration:underline; text-underline-offset:3px; }
:focus-visible{ outline:2px solid var(--blue); outline-offset:3px; border-radius:4px; }
h1,h2,h3{ font-family:var(--disp); font-weight:700; line-height:1.2; margin:0; letter-spacing:-.01em; }

/* ---------- 頂列 ---------- */
.topbar{
  position:fixed; inset:0 0 auto 0; height:var(--top); z-index:60;
  background:rgba(235,238,242,.88); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; gap:20px;
}
.logo{ display:flex; align-items:center; gap:11px; min-width:0; }
.logo .mark{
  width:32px; height:32px; border-radius:9px; background:var(--ink);
  display:grid; place-items:center; color:var(--gold);
  font-family:var(--mono); font-size:13px; font-weight:600; flex-shrink:0;
}
.logo b{ font-family:var(--disp); font-size:15.5px; font-weight:700; white-space:nowrap; }
.xp{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
.xp .val{ font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--gold); }
.xp .bar{ width:132px; height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
.xp .bar i{ display:block; height:100%; width:0; background:var(--gold); border-radius:99px; transition:width .4s ease; }
.xp .cnt{ font-family:var(--mono); font-size:12.5px; color:var(--dim); }
@media (max-width:640px){ .xp .bar{ width:70px; } .logo b{ display:none; } }

/* ---------- 側欄學習路徑 ---------- */
.route{
  position:fixed; top:var(--top); left:0; bottom:0; width:var(--side); z-index:50;
  background:var(--paper-2); border-right:1px solid var(--line);
  overflow-y:auto; padding:22px 16px 60px;
}
.route::-webkit-scrollbar{ width:8px; }
.route::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }
.route .cap{
  font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--dim-2); padding:0 10px; margin-bottom:12px;
}
.r-home{
  display:block; padding:11px 14px; border-radius:11px; margin-bottom:18px;
  background:var(--white); border:1px solid var(--line); color:var(--txt);
  font-weight:500; font-size:14px;
}
.r-home[aria-current="page"]{ background:var(--ink); color:var(--white); border-color:var(--ink); }
.r-home:hover{ text-decoration:none; }
.r-group{
  display:flex; align-items:center; gap:9px; padding:14px 10px 9px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim);
}
.r-group i{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
.r-item{
  display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
  padding:8px 10px; border-radius:10px; border:0; background:transparent;
  cursor:pointer; font-family:var(--body); color:var(--txt);
  font-size:12.8px; line-height:1.5; transition:background .15s ease;
}
.r-item:hover{ background:var(--white); }
.r-item.on{ background:var(--white); box-shadow:inset 2px 0 0 var(--hue); }
.r-num{
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
  border:1px solid var(--line); display:grid; place-items:center;
  font-family:var(--mono); font-size:11px; color:var(--dim);
  font-variant-numeric:tabular-nums; margin-top:1px; transition:.15s ease;
}
.r-item[data-done="1"] .r-num{ background:var(--ink); border-color:var(--ink); color:var(--gold); }
.r-item[data-done="1"] .r-txt{ color:var(--dim); }
.r-txt{ min-width:0; }
.r-txt b{ display:block; font-weight:500; }
.r-txt span{ font-family:var(--mono); font-size:10px; color:var(--dim-2); letter-spacing:.05em; }

.routebtn{ display:none; }
@media (max-width:1040px){
  .route{ transform:translateX(-100%); transition:transform .25s ease; box-shadow:0 0 40px rgba(20,28,40,.18); }
  .route.open{ transform:none; }
  .routebtn{
    display:grid; place-items:center; width:36px; height:36px; flex-shrink:0;
    border:1px solid var(--line); border-radius:10px; background:var(--white); cursor:pointer;
  }
  .routebtn span{ display:block; width:15px; height:1.6px; background:var(--txt); box-shadow:0 5px 0 var(--txt),0 -5px 0 var(--txt); }
}

/* ---------- 主區 ---------- */
main{ margin-left:var(--side); padding:calc(var(--top) + 30px) 34px 96px; }
@media (max-width:1040px){ main{ margin-left:0; padding-left:20px; padding-right:20px; } }
.wrap{ max-width:1280px; margin:0 auto; }

/* ---------- 深色卡片（招牌元件） ---------- */
.slab{
  background:var(--ink); color:#EDF1F6; border-radius:24px;
  padding:52px 48px; position:relative; overflow:hidden;
}
@media (max-width:640px){ .slab{ padding:34px 24px; border-radius:18px; } }
.slab .eyebrow{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.24em;
  text-transform:uppercase; color:#7E90A8; margin-bottom:22px;
}
.slab h1{
  font-size:clamp(30px,4.4vw,54px); line-height:1.28; color:#fff;
  font-family:var(--disp); font-weight:700;
}
.slab h1 .g{ color:var(--gold); }
.slab .lede{ margin:26px 0 0; max-width:60ch; color:#AFBCCC; font-size:15px; }
.cta{ display:flex; flex-wrap:wrap; gap:11px; margin-top:30px; }
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:12px 22px; border-radius:99px; font-size:14px; font-weight:500;
  border:1px solid rgba(255,255,255,.24); color:#EDF1F6; background:transparent;
  cursor:pointer; font-family:var(--body); transition:.16s ease;
}
.btn:hover{ background:rgba(255,255,255,.09); text-decoration:none; }
.btn.solid{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:700; }
.btn.solid:hover{ filter:brightness(1.06); }

.plate{ margin-top:38px; border-top:1px solid rgba(255,255,255,.12); padding-top:26px; }
.plate svg{ display:block; width:100%; height:auto; }
.plate .cap{
  display:flex; gap:18px; justify-content:space-between; flex-wrap:wrap; margin-top:14px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:#6F819A; text-transform:uppercase;
}
.plate .cap-note{ margin-top:9px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:#6F819A; }

/* ---------- 統計五格 ---------- */
.stats{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin:22px 0; }
@media (max-width:1000px){ .stats{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:760px){ .stats{ grid-template-columns:repeat(2,1fr); } }
.stat{ background:var(--white); border:1px solid var(--line); border-radius:16px; padding:22px 20px; }
.stat b{ display:block; font-family:var(--disp); font-size:38px; font-weight:700; line-height:1; letter-spacing:-.02em; }
.stat span{ font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.05em; }
.stat.hi b{ color:var(--gold); }
.stat.era{ padding-left:15px; padding-right:15px; }
.stat.era b{ font-size:24px; letter-spacing:0; white-space:nowrap; }

/* ---------- 軌道卡 ---------- */
.tcards{ display:grid; gap:14px; margin:22px 0 34px; }
@media (min-width:860px){ .tcards{ grid-template-columns:1fr 1fr; } }
@media (min-width:1240px){ .tcards{ grid-template-columns:repeat(3,1fr); } }
.tcard{
  background:var(--white); border:1px solid var(--line); border-radius:20px;
  padding:28px 26px; display:flex; flex-direction:column; gap:12px;
  cursor:pointer; text-align:left; font-family:var(--body); color:var(--txt);
  transition:.18s ease;
}
.tcard:hover{ border-color:var(--ac); box-shadow:0 8px 26px rgba(20,28,40,.07); transform:translateY(-2px); }
.tcard .code{
  width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
  background:var(--acl); color:var(--ac); font-family:var(--disp); font-size:20px; font-weight:700;
}
.tcard h2{ font-size:21px; }
.tcard .lat{ font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim-2); }
.tcard p{ margin:0; color:var(--dim); font-size:14px; }
.tcard .foot{
  display:flex; gap:16px; flex-wrap:wrap; margin-top:auto; padding-top:16px;
  border-top:1px solid var(--line-2); font-family:var(--mono); font-size:11px; color:var(--dim-2);
}
.tcard .foot b{ color:var(--txt); font-weight:600; }
.tcard .go{ font-family:var(--mono); font-size:12px; color:var(--ac); letter-spacing:.06em; }

/* ---------- 內容區塊 ---------- */
.band{ background:var(--white); border:1px solid var(--line); border-radius:20px; padding:32px 30px; margin-bottom:14px; }
.band h2{ font-size:20px; margin-bottom:6px; }
.band .eyebrow{ font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim-2); margin-bottom:8px; }
.band ul{ list-style:none; padding:0; margin:20px 0 0; display:grid; gap:14px; }
.band li{ padding-left:18px; border-left:2px solid var(--line); color:var(--dim); font-size:14.5px; }
.band li b{ color:var(--txt); font-weight:700; }
.band code{ font-family:var(--mono); font-size:12.5px; background:var(--paper); padding:2px 6px; border-radius:5px; color:var(--txt); }

/* ---------- 軌道頁：年代導軌 ---------- */
.railbox{
  background:var(--white); border:1px solid var(--line); border-radius:16px;
  padding:14px 22px 8px; margin:16px 0;
}
.rail{ position:relative; height:66px; }
.rail-ax{ position:absolute; left:0; right:0; top:42px; height:1px; background:var(--line); }
.rail-dec{ position:absolute; top:42px; width:1px; height:5px; background:var(--line); }
.rail-dec span{ position:absolute; top:8px; left:50%; transform:translateX(-50%); font-family:var(--mono); font-size:9.5px; color:var(--dim-2); }
.rail-t{
  position:absolute; top:22px; width:2px; height:20px; border:0; padding:0;
  background:var(--hue); opacity:.4; cursor:pointer; transition:.15s ease;
}
.rail-t:hover,.rail-t:focus-visible{ opacity:1; height:28px; top:14px; }
.rail-t[data-done="1"]{ background:var(--ink); opacity:.85; }
.rail-t .tip{
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%); white-space:nowrap;
  background:var(--ink); color:#fff; padding:3px 9px; border-radius:6px;
  font-family:var(--mono); font-size:10px; opacity:0; pointer-events:none; transition:opacity .12s;
}
.rail-t:hover .tip,.rail-t:focus-visible .tip{ opacity:1; }

/* ---------- 篩選 ---------- */
.filters{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:16px 0 18px; }
.filters .lab{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim-2); margin-right:2px; }
.chip{
  font-family:var(--mono); font-size:11.5px; padding:6px 13px; border-radius:99px;
  border:1px solid var(--line); background:var(--white); color:var(--dim); cursor:pointer; transition:.15s;
}
.chip:hover{ border-color:var(--dim-2); color:var(--txt); }
.chip[aria-pressed="true"]{ background:var(--hue); border-color:var(--hue); color:#fff; font-weight:600; }
.srch{
  flex:1 1 190px; min-width:150px; padding:8px 14px; border-radius:99px;
  border:1px solid var(--line); background:var(--white); color:var(--txt);
  font-family:var(--mono); font-size:12px;
}

/* ---------- 文獻卡 ---------- */
.cards{ display:grid; gap:12px; }
.card{
  background:var(--white); border:1px solid var(--line); border-radius:18px;
  padding:26px 26px 22px; scroll-margin-top:88px; transition:.18s ease;
}
.card:hover{ box-shadow:0 6px 22px rgba(20,28,40,.06); }
.card[data-done="1"]{ background:var(--paper-2); }
.card-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.c-num{
  width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  background:var(--hue-lite); color:var(--hue); font-family:var(--mono); font-size:12px; font-weight:600;
}
.card[data-done="1"] .c-num{ background:var(--ink); color:var(--gold); }
.c-id{ font-family:var(--mono); font-size:11px; color:var(--dim-2); letter-spacing:.08em; }
.tag{ font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:99px; background:var(--paper); color:var(--dim); }
.tag.warn{ background:#FDECEA; color:#B3341F; }
.card h3{ font-size:17.5px; line-height:1.42; font-weight:600; margin-bottom:7px; }
.meta{ font-family:var(--mono); font-size:11.5px; color:var(--dim); line-height:1.75; }
.meta .vn{ color:var(--dim-2); }
.meta .find{ color:var(--dim); border-bottom:1px dotted currentColor; }
.meta .find:hover{ color:var(--hue); }
.q{
  margin-top:18px; padding:15px 18px; border-radius:12px;
  background:var(--hue-lite); border-left:3px solid var(--hue); font-size:15px; line-height:1.7;
}
.q .l{ display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-bottom:5px; }
.contrib{ margin-top:14px; font-size:14.5px; color:var(--dim); }
.contrib .l{ display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim-2); margin-bottom:3px; }
.contrib.todo{ font-style:italic; color:var(--dim-2); }
.sum{ margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; }
.sum>summary{
  cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
}
.sum>summary::-webkit-details-marker{ display:none; }
.sum>summary::before{ content:"▸"; font-size:11px; transition:transform .15s ease; }
.sum[open]>summary::before{ transform:rotate(90deg); }
.sum>summary:hover{ color:var(--hue); }
.sum>div{ margin-top:10px; font-size:14px; line-height:1.85; color:var(--dim); white-space:pre-line; }
.card .nb{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-family:var(--mono); font-size:11.5px; line-height:1.7; color:var(--dim-2); }
.card-foot{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:18px; }
.done{
  font-family:var(--mono); font-size:11.5px; padding:7px 15px; border-radius:99px;
  border:1px solid var(--line); background:var(--white); color:var(--dim); cursor:pointer; transition:.15s;
}
.done:hover{ border-color:var(--dim-2); color:var(--txt); }
.done[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--gold); }
.pg{ font-family:var(--mono); font-size:11px; color:var(--dim-2); }
.empty{ background:var(--white); border:1px solid var(--line); border-radius:18px; padding:46px; text-align:center; font-family:var(--mono); font-size:13px; color:var(--dim-2); }

footer{ margin-top:34px; font-family:var(--mono); font-size:11px; color:var(--dim-2); line-height:1.9; }

@media (prefers-reduced-motion:no-preference){
  .fade{ animation:rise .42s ease both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <button class="routebtn" id="routebtn" aria-label="開關學習路徑"><span></span></button>
    <span class="mark">HS</span>
    <b>高速流場文獻導引</b>
  </div>
  <div class="xp">
    <span class="val" id="xpv">0 XP</span>
    <div class="bar"><i id="xpb"></i></div>
    <span class="cnt" id="xpc">0/0</span>
  </div>
</div>

<aside class="route" id="route">
  <p class="cap">Learning route</p>
  <a class="r-home" href="#/" id="rhome">課程總覽</a>
  <div id="rlist"></div>
</aside>

<main><div class="wrap" id="main"></div></main>

<script>
/* ===================================================================
   ▼▼▼ 文獻資料庫：要新增文獻就改這裡（LIBRARY 陣列） ▼▼▼
   =================================================================== */

const LIBRARY = [

  /* ============ 軌道 A：超音速剪切層與凹槽流場 ============ */

  /* --- A1 可壓縮剪切層：壓縮性抑制混合 --- */
  {
    id: "A-01", track: "A", year: 1974, method: "實驗", topic: "自由剪切層",
    title: "On density effects and large structure in turbulent mixing layers",
    authors: "Brown, G.L.; Roshko, A.",
    venue: "J. Fluid Mech. 64(4), 775–816",
    doi: "10.1017/S002211207400190X",
    question: "混合層的成長，究竟被密度比控制，還是被大尺度結構的配對過程控制？",
    contribution: "以氮／氦兩股不同氣體改變密度比，火花陰影照顯示不論密度比為何，混合層都由大尺度擬序結構主導；高速攝影顯示這些結構以近乎定速對流，並藉與鄰近結構合併而不連續地增大其尺寸與間距。跨層密度比的大幅改變對展開角影響相對小，因此把一股為超音速時觀察到的強效應歸因於壓縮性，而非長期以來認定的密度效應。",
    summary: "本摘要由本站自出版社排版版 PDF 整理，頁碼為期刊頁。\n\n實驗配置（第 775 頁摘要）：在新設計的裝置中做兩股不同氣體的平面湍流混合，主要用氮與氦以改變密度比。火花陰影照與高速攝影為主要診斷手段。\n\n主要觀察（第 775 頁摘要）：不論兩側密度比為何，混合層都由大尺度擬序結構主導。高速攝影顯示這些結構以近乎定速對流，並藉與鄰近結構合併，不連續地增大其尺寸與間距。照片與密度擾動量測顯示，湍流混合與捲吸是一種發生在大結構尺度上的纏繞過程。\n\n關鍵結論（第 775 頁摘要）：跨層密度比的大幅改變，對展開角的影響相對小。因此一股為超音速時觀察到的強效應，應歸因於壓縮性，而非長期以來所認定的密度效應。\n\n壓縮性與密度效應的區分（第 802 至 803 頁）：原文明確論證，若只有密度差異在作用，則三種情況——兩側氣體分子量不同、兩側溫度不同、高速壓縮性造成的密度差——在相同速度比與密度比下應無區別。作者指出高速情形另有一項與馬赫數相關的效應，與任何密度差異造成的效應不同。這是本站追問要對照的段落。\n\n捲吸模型與其誤差（第 814 頁）：作者以大結構的統計性質推估捲吸率。在速度比為零的情形，模型給出的纏繞流量成長率約為自由流速度的 0.052 倍，而由 Liepmann 與 Laufer（1947）實驗推得的內流速度為 0.035 倍。作者自陳兩者吻合度不算突出，但考量模型中的多項假設，仍足以支持基本想法可能正確。密度比為 7 與 3 時該常數分別變為 0.070 與 0.038。\n\n作者自陳的限制（第 814 頁 Concluding remarks）：本研究原始目標是釐清不可壓縮流中密度比對湍流混合的影響，但資料量不如預期——關鍵圖僅三個資料點。這足以支持一般性結論與壓縮性效應的比較，卻不足以妥善決定密度依賴關係；連速度比的依賴關係也仍有不確定性。作者明言密度效應相對壓縮性效應為小，並表示將補充量測。",

    contribution: "以新建的雙流吹放式超音速風洞，讓兩股可為不同氣體、不同馬赫數的流交會，量測十種氣體與馬赫數組合（自由流馬赫數 0.2 至 4）的 Pitot 厚度成長率。援引 Bogdanoff (1983) 隨波移動座標的構想定義對流馬赫數 Mc，並先以自行計算的可壓縮渦片線性解檢驗：放大率對 Mc 作圖時，不同密度比的曲線幾乎收攏成一條，對 M1 作圖則否。把實測成長率除以同速度比、同密度比下的不可壓縮模型值後，十組資料大致落在單一曲線上——正規化成長率自次音速 Mc 就開始下降，至 Mc 約 0.8 後趨平，約為不可壓縮值的五分之一。",
    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n研究對象與動機（第 453 至 455 頁）：因超音速燃燒的需求而重新檢視可壓縮平面剪切層。過去單流實驗普遍觀察到成長率隨馬赫數下降，但當時多把成因歸給噴流與外界的密度比；Brown & Roshko (1974) 已指出密度效應遠小於超音速下所見，因此壓縮性本身才是關鍵。作者並指出，雙流剪切層若沿用實驗室座標衡量壓縮性並不合理——兩股皆為超音速但速度接近時，該層本質上並不算超音速。\n\n設備與量測（第 456 至 460 頁）：新建雙流吹放式風洞，兩側供氣獨立，更換中心體即可改變馬赫數與氣體組合；測試段高 23 mm、長 230 mm，每次運轉僅 1.5 至 2.0 s。以 20 ns 火花光源紋影做瞬時可視化。成長率由 Pitot 壓力剖面決定，Pitot 厚度定義為剖面自 5% 至 95% 的寬度。近拖曳邊處靜壓上升 20% 至 50%，故成長率只取下游等壓區（x 大於 75 mm）以最小平方直線擬合，整體誤差估計約 10%。\n\n對流馬赫數的導出（第 465 至 469 頁）：援引 Bogdanoff (1983) 隨不穩定波移動座標的想法定義 Mc。先以渦片線性解檢驗其收攏能力，再對亂流情形，以大結構之間鞍點兩側總壓相等（等靜壓、穩態）導出對流速度 Uc，得到聲速加權平均的形式。\n\n主要結果（第 470 至 471 頁）：直接把成長率對 Mc 作圖並不收斂，在高 Mc 反而上升，可見必須先除掉速度比與密度比的影響。作者以常數 0.17（取自 Brown & Roshko 1974）建立不可壓縮視覺成長率模型，再依 δpit,0 = 0.8 δvis,0 換算成係數 0.14 的 Pitot 版本。以此正規化後，資料大致收攏成單一曲線：正規化成長率隨 Mc 上升急遽下降，至 Mc 約 0.8 後趨平，約為不可壓縮值的五分之一。\n\n厚度定義的影響（第 465、473 頁）：δpit/δvis = 0.8 是取理論值 0.72 與自 Brown & Roshko (1974)、Konrad (1976) 反推的 0.90、0.83 的約略平均，作者自陳這個決定有些武斷，反映出不可壓縮異質剪切層的厚度資料稀少。把 Maydew & Reed 等人以渦度厚度量得的舊資料同樣正規化後（常數改為 0.085），曲線的定性行為相同，但趨平值落在約 0.4 而非 0.2，開始下降的位置在 Mc 約 0.4 而非 0.25。作者把此差異歸因於 δω/δpit 可能隨密度比與馬赫數變化。這是本站追問要對照的段落。\n\n機制詮釋與作者自陳的限制（第 473 至 476 頁）：成長率下降在 Mc 仍為次音速時就開始，且在 Mc 變成超音速之前大致完成，因此壓縮性是在任何震波或膨脹波出現之前就已起作用。作者提出的解釋是：Mc 越高，擾動越傾向把能量輻射到層外，而非擾動層本身。另指出有限厚度剪切層在對流座標中永遠存在一層次音速次層，故不論馬赫數多高都不會完全穩定。限制方面，全篇分析僅限二維擾動，實驗設置無法偵測斜向擾動，而斜波可使有效對流馬赫數下降、令流場重新變得本質次音速；結構是否展向連貫僅由紋影影像的清晰程度推測，作者自承是薄弱的論證。",

    contribution: "以線性空間穩定性理論分析兩股平行可壓縮流形成的剪切層，基本流取自可壓縮邊界層方程的解或雙曲正切剖面，黏性與非黏性擾動並計。三項結論：其一，可壓縮層的最大成長率隨速度比呈非線性變化，與不可壓縮層近乎線性的關係不同；其二，把成長率比對對流馬赫數作圖時，曲線幾乎與 M1、速度比、溫度比的個別取值無關，為 Bogdanoff 與 Papamoschou–Roshko 的對流馬赫數提供了比先前更全面的理論佐證；其三，溫度比的作用會隨馬赫數反轉——M1 小於約 1.5 時加熱慢流側是穩定化的，大於 1.5 之後反而變成不穩定化。作者並明確指出，層流線性理論與亂流實驗的吻合只到對流馬赫數約 0.8 為止。",
    summary: "本摘要由本站自出版社排版版 PDF（AIP）整理，頁碼為期刊印刷頁。\n\n目的（第 957 頁）：一是詳查速度比與溫度比對超音速混合層穩定性的影響；二是為 Bogdanoff 與 Papamoschou–Roshko 提出的對流馬赫數提供更全面的理論佐證——作者指出前人用來支持該參數的穩定性結果都只是單流（U2 = 0）的有限案例。\n\n方法（第 957 至 958 頁）：基本流為等靜壓下解可壓縮邊界層方程所得的層流混合層（Blasius–Lock），另一組則直接指定雙曲正切剖面並以 Busemann–Crocco 關係給溫度剖面。擾動採空間理論，容許二維與斜向波；黏性版本由線性化完整 Navier–Stokes 與能量方程導出，Prandtl 數取 0.72、比熱比 1.4、黏性用 Sutherland 公式。\n\n黏性與雷諾數（第 958 頁）：剪切層在所有雷諾數下皆不穩定，且 R 大於 1000 後成長率即趨近非黏性解，相速度幾乎與雷諾數無關。作者選擇用完整黏性方程計算，以避開非黏性方程在奇點附近須變形積分路徑的數值困難。\n\n速度比與溫度比（第 959 至 961 頁）：最不穩定頻率落在 ω 約 0.05 至 0.15 之間。提高 U2 會略微擴大放大頻帶；馬赫數對成長率的抑制在 U2 = 0 時最顯著，隨 U2 增大而減弱。只有不可壓縮情形的最大成長率隨速度比近乎線性，馬赫數一高就明顯非線性。溫度比方面，M1 小於 1.5 時加熱慢流側為穩定化，M1 大於 1.5 後反轉為不穩定化。第二模態（Mack 所稱的渦度波）在 M1 = 2.0、T2 = 0.5 時最大成長率甚至超過第一模態，但 T2 = 1.0 與 2.0 時仍以第一模態為主。\n\n對流馬赫數的驗證（第 964 至 965 頁）：作者假設最大成長率（對全頻率取極大）與剪切層展開率相關，定義成長率比 Rσ，對六組（U2, T2）組合、M1 自 0 掃到 4 或 6 計算。結果顯示 Rσ 與對流馬赫數的關係幾乎不受 M1、U2、T2 個別取值影響，僅在對流馬赫數大於 1 時略有分散；雙曲正切剖面給出的值略高於 Blasius–Lock 剖面。\n\n適用界線與作者自陳的限制（第 965 至 966 頁）：把 Papamoschou–Roshko 與 Chinzei 等人的亂流實驗資料疊上層流穩定性曲線後，兩者的走勢驚人地相似，但作者明講這只在對流馬赫數小於 0.8 時成立——更高時實驗資料趨平於約 0.25，層流穩定性比值卻持續下降。作者並特別聲明，該圖不應被讀成層流線性穩定性分析與亂流實驗資料的比較，其用意僅在證明對流馬赫數是可行的壓縮性參數。改用斜向波可把理論趨勢往實驗拉近到對流馬赫數約 1.3，但比值仍持續下降，作者明言趨平現象仍待進一步理論工作解釋。這是本站追問要對照的段落。",

    authors: "Elliott, G.S.; Samimy, M.",

    doi: "10.1063/1.857816",
    question: "亂流強度隨 Mc 的下降，與成長率下降是同一件事，還是兩個獨立現象？",
    contribution: "以雙分量同步 LDV 量測高雷諾數可壓縮自由剪切層的亂流場，把作者先前僅有的兩個相近對流馬赫數（0.51 與 0.64）延伸到 0.86，使原本不夠確定的結論得到支持。亂流擾動的強度與側向分佈範圍都隨 Mc 上升而下降，雷諾應力與擾動強度的最大值幾乎隨 Mc 線性遞減；偏度與峰度同樣下降，代表大尺度結構伸入自由流所造成的間歇性被顯著抑制。本篇對本站追問最關鍵的兩項陳述互為表裡：其一，壓縮性對成長率的影響約自 Mc = 0.5 開始，但對亂流擾動（尤其側向）的影響在更低的 Mc 就已出現；其二，由平均速度剖面推算的剪應力基本上等於動量厚度成長率乘上一個對 Mc 收攏良好的速度積分量，故剪應力的下降主要來自 dθ/dx 的下降。",
    summary: "本摘要由本站自出版社排版版 PDF（AIP）整理，頁碼為期刊印刷頁。\n\n研究對象與動機（第 1231 頁）：因超音速燃燒衝壓引擎的需求而研究壓縮性對自由剪切層亂流場的影響。作者先前的報告只有 Mc = 0.51 與 0.64 兩個相近的對流馬赫數，結論因此不夠確定；本文加入 Mc = 0.86 的第三例，並順帶檢驗 LDV 亂流量測的準確性。\n\n設備與條件（第 1232 至 1233 頁）：俄亥俄州立大學 AARL 的高雷諾數超音速吹放式雙流風洞，測試段 152.4 mm 見方，分隔板厚 3.175 mm、尾緣厚約 0.5 mm。第三例用標稱馬赫數 3.0 的噴嘴，總壓 265 kPa、總溫 276 K、速度 597 m/s；入流的超音速全紊流邊界層厚 9.2 mm、動量厚度 0.46 mm，對應動量厚度雷諾數 24700。次音速側以 M2 = 0.45 匹配靜壓，速度比 0.25、密度比 0.37。量測用雙分量同步 LDV，10 度離軸前向散射，兩股皆以直徑小於 1 μm 的霧化矽油播種，每通道 2048 個樣本。作者自陳樣本數對平均速度足夠，但若要降低亂流量的散布仍嫌不足。\n\n相似性與收攏（第 1234 頁）：以渦度厚度為基礎的相似參數不僅能收攏不同流向位置的速度剖面，還吸收了壓縮性效應，使不同 Mc 的平均速度剖面落在同一條雙曲正切曲線上；改用動量厚度為基礎則需要一個隨 Mc 變化的係數才收得攏。\n\n亂流量的下降（第 1235 頁）：側向擾動強度在次音速情形明顯高於本文所有超音速情形。最大雷諾應力在 Mc = 0.51 已比次音速結果低約 40%，更高 Mc 者再往下降；最大值幾乎隨 Mc 線性遞減。作者在此明講：即使壓縮性對成長率的影響約自 Mc = 0.5 才開始，對亂流擾動（尤其側向）的影響在更低的 Mc 就已經出現。這是本站追問要對照的段落之一。\n\n速度剖面收攏而雷諾應力不收攏的表面矛盾（第 1236 至 1237 頁）：作者援引 Lumley 在熱混合層中的類似弔詭（溫度剖面與熱通量），並依 Fernandez & Zukoski 的作法自平均速度剖面推算剪應力。結論是剪應力基本上等於動量厚度成長率乘上一個對不同 Mc 收攏良好的速度積分量，因此觀察到的下降主要來自 dθ/dx 隨 Mc 的下降。把直接量到的雷諾應力乘上密度比後，與推算值不只趨勢相同、量級也吻合；作者據此認為 Morkovin 假設在此類流場仍然成立，也說明約 1 μm 的矽油粒子確實跟得上大尺度結構。這是本站追問要對照的另一段。\n\n高階動差（第 1238 至 1239 頁）：偏度反映大尺度結構伸入自由流造成的間歇性，在次音速側為正、超音速側為負；不可壓縮結果在低速側的量值約為本文的 2.5 倍，v 分量偏度峰值也高約 30%。峰度在剪切層兩緣出現峰值，中央與自由流約為 3；不可壓縮情形在高速側約 8、低速側約 22。本文超音速側的峰度峰值隨 Mc 下降，作者解讀為吞噬式捲吸被抑制，與較低的成長率及捲吸率一致。\n\n作者自陳的限制（第 1239 頁）：高階動差建立在較小的樣本數上。Mc = 0.51 與 0.64 兩例的高階量（乃至雷諾應力與側向擾動）非常接近，作者認為是這兩個 Mc 太相近、統計不確定性遮蔽了差異，真正顯著的變化出現在與 Mc = 0.86 的對比。作者也表示希望與更高 Mc 的資料比較，但現有的直接量測多半帶有再循環流污染。",

    summary: "本摘要由本站自出版社排版版 PDF（AIAA，arc.aiaa.org）整理，頁碼為期刊印刷頁。\n\n動機與參數選擇（第 538 至 539 頁）：作者刻意採用相對馬赫數 Mr = ΔU/a 而非對流馬赫數 Mc，理由是 Mc 的推導依賴有組織大尺度結構之間的滯止壓力平衡，但這類結構在高雷諾數的完全發展可壓縮亂流混合層中並未被觀察到主導流場，且等熵滯止假設在高 Mc 下未必成立；兩者在比熱比相同時相差兩倍。\n\n設備與量測（第 539 至 540 頁）：伊利諾大學風洞，兩股空氣可各自加熱至總溫約 700 K。主流噴嘴標稱馬赫數 2 與 2.4，次流 1.4（亦可次音速運轉以拉高相對馬赫數）；兩股以 2.5 度夾角越過底高約 0.5 mm 的分隔板匯合，各股出口高約 24 mm、寬 96 mm。雙色雙分量 LDV 的兩分量與流向成正負 45 度以降低條紋偏差，量測體直徑約 0.17 mm、長約 1.4 mm，以平均粒徑約 0.3 μm 的二氧化鈦粒子播種，每點至少取 2000 個樣本。另以 0.497 μm 聚苯乙烯乳膠球對照，確認粒子跟隨性不構成問題。\n\n案例與發展準則（第 540 至 542 頁）：七組案例涵蓋速度比 0.16 至 0.79、密度比 0.57 至 1.55、Mr 0.40 至 1.97。完全發展所需的流向距離依序遞增：平均速度、縱向擾動強度、橫向擾動強度、雷諾應力；作者由 Bradshaw (1966) 的準則改寫出以局部厚度為基礎的判據 Reb = ρΔUb/μ 約 1×10⁵。\n\n相似性剖面（第 543 至 544 頁）：即使壓縮性最強的 case 5，平均流向速度剖面仍與誤差函數吻合。縱向擾動強度的峰值在各案例間相近，橫向擾動強度的峰值則隨 Mr 明確下降；正規化雷諾應力與含橫向速度分量的三重積亦然。混合長度除以局部厚度同樣隨 Mr 下降。\n\n各向異性與相關係數（第 544 頁，表 1）：σu/σv 的峰值依 Mr 遞增為 1.53、1.41、1.71、2.33、1.84、2.74、3.53。作者據此指出，以等向性亂流模型為基礎的數值模擬在高相對馬赫數下可能表現不佳。另一方面，雷諾應力相關係數在層中央幾乎為定值，七組的平均值僅落在 0.48 至 0.54 之間，並不隨 Mr 系統性變化。\n\n收斂性的正反證據（第 544 至 545 頁）：以不可壓縮混合層的峰值 0.18、0.14、0.013 分別正規化 σu/ΔU、σv/ΔU 與 −(u'v')/(ΔU)² 後，橫向擾動與雷諾應力隨 Mr 下降的走勢與正規化成長率一致，縱向擾動則幾乎持平。作者以 case 3 與 3r（密度比與 Mr 幾乎相同、速度比不同）正規化值相符為據，主張壓縮性效應主要由相對馬赫數決定，而非速度參數的函數。但作者同時列出不合趨勢的案例：case 1 與 1d 為最低 Mr，可能尚未完全發展、ΔU 偏小使百分比誤差放大，且速度比近 0.8 已接近尾流；case 3r 則因分隔板尖端兩股靜壓無法精確匹配而產生較強壓縮波，自由流均勻性與流向壓力梯度較差。需注意作者的收斂圖（圖 5）正規化的是成長率與三個擾動量，各向異性比本身並未以正規化形式呈現——本站自表 1 讀出：case 3（Mr 1.37）為 2.33、case 3r（Mr 1.44）為 1.84，相對馬赫數相近而差距不小，作者把 3r 的偏離歸因於上述波系污染。這是本站追問要對照的段落。",

    contribution: "以混合譜方法與高階有限差分求解完整可壓縮 Navier–Stokes 方程，對時間發展型混合層做三維直接數值模擬。線性穩定性給出明確門檻：Mc 小於 0.6 時最不穩定的是二維波，大於 0.6 之後改為斜波，且最不穩定波的角度滿足 Mc cos θ 約等於 0.6，故 Mc 越高斜度越大。以隨機噪音為初始條件的模擬重現了這個門檻，且未發現線性理論以外的其他不穩定模態。非線性階段沿襲線性趨勢：Mc = 0.4 仍是二維渦捲加流向編織渦，Mc = 0.8 與 1.05 則轉為傾斜的斜向渦，Mc 大於 1 時二維不穩定性對流場發展幾乎沒有影響。由一對等量反向斜波發展出的結構，是一對沿流向交錯排列的傾斜 Λ 渦。另一項發現是三維模擬中完全沒有出現震波，即使在同條件二維模擬必定產生震波的馬赫數下亦然。",
    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n方法（第 135 至 137 頁）：時間發展型混合層，流向與展向為週期性，法向截斷後施加非反射邊界條件。x 與 z 方向以傅立葉法求導，y 方向用六階修正 Padé 格式，時間推進採顯式 Runge–Kutta。黏性依冪次律取氮的指數，Prandtl 數與 Schmidt 數均取 1。網格自 16×99×16 起算，隨非線性增強加密至約 96×99×96，上限受 Cray X-MP 的儲存量與每次模擬 10 至 15 小時的計算時間限制。作者原本準備了震波捕捉格式，但發現三維高馬赫數下並未出現震波後，改為犧牲震波捕捉能力、換取更高的空間精度。\n\n線性穩定性門檻（第 138 頁）：Mc 小於 0.6 時二維擾動最不穩定；Mc 大於 0.6 時斜波最不穩定，且在兩側自由流溫度相等的情形下，最不穩定波的角度滿足 Mc cos θ 約等於 0.6。二維波的放大率隨 Mc 迅速下降，到 Mc = 1.2 時僅剩不可壓縮值的 10%。Mc 大於 1 之後另出現兩支相對某一側自由流為超音速的新模態，但成長率極小，且前作已證實其在非線性階段仍然很小。\n\n三個區間的劃分（第 140 頁）：(a) Mc 在 0 到 0.6 之間，二維不穩定性放大最快，但接近 0.6 時各種取向的波放大率已相當接近，可預期趨向三維；(b) Mc 在 0.6 到 1.0 之間，斜波最不穩定，但二維波仍在放大、仍可能有影響；(c) Mc 大於 1.0，二維不穩定性的放大率約為最不穩定斜波的五分之一，影響極小，此區至少延伸到 Mc = 3.2，即作者穩定性計算的上限。\n\n隨機初始條件的線性驗證（第 141 至 142 頁）：取 Mc = 0.4、0.8、1.05，對應 Re 為 400、600、800（高 Mc 需要更高 Re 才能進入高雷諾數漸近區）。在 y = 0 平面上畫 v = 0 的等值線：Mc = 0.4 明顯偏好展向結構；Mc = 0.8 與 1.05 的等值線取向與線性理論預測的 45 度與 60 度一致。未發現線性分析以外的不穩定模態。\n\n非線性演化（第 145 至 148 頁）：初始條件取二維波加一對等量反向斜波，相位設為對應 Pierrehumbert–Widnall 之 translative 次級不穩定模態者。模態能量顯示：Mc = 0.4 時二維波始終能量最高；Mc = 0.8 時斜波雖起始能量較低卻很快超越二維波；Mc = 1.05 時斜波能量高出一個數量級以上。等壓面顯示大尺度結構自二維渦捲加編織渦，轉為 Mc = 1.05 時的四個傾斜斜向轉動區。三維模擬中未出現震波，而同等雷諾數的二維模擬在 Mc 約 0.7 以上必定產生震波；作者據此推測三維流場的拓撲可在不需要震波的情況下達到滯止點，並指出這是 Papamoschou–Roshko 二維模型的可能限制。\n\n初始擾動的角色（第 149 至 150 頁）：在 Mc = 0.8 改用另一相位（低馬赫數下對應僅弱放大的 bulging 模態），發展出的結構細節不同，但三維程度相當。作者並明白指出，Mc 大於 1 時二維波放大得太弱，其相位幾乎不起作用。也就是說，轉為三維的門檻由 Mc 決定，初始擾動只改變三維結構的樣式，且影響隨 Mc 上升而遞減。這是本站追問要對照的段落。\n\n一般性檢驗與作者自陳的限制（第 150、154 至 156 頁）：以純隨機噪音為初始條件、Mc = 0.8 的模擬，發展出的結構與由一對斜波發展出者極為相似；即使兩支斜波被隨機種子激發的程度並不相同，也沒有出現單一斜波主導的情形。作者藉此說明模擬結果之所以形貌乾淨，是因為主要不穩定性主導流場，而非只是施加了乾淨的初始條件。限制方面：受解析度所限，模擬只能走到轉捩初期，無法計算後續的次級不穩定性與混合轉捩；作者相信完全發展亂流狀態下的最大尺度結構仍會類似，但明言這是信念推論而非計算結果。作者也指出高馬赫數下應存在某種次諧合併過程，作為低馬赫數二維配對過程的類比，但本文未能模擬。",

    contribution: "在新建的 GALCIT 雙流吹放式風洞中，以氦、氮、氬的不同組合產生等熵推算對流馬赫數自近零到約 1 的二維可壓縮剪切層，共 11 個案例。側視紋影顯示高壓縮性流場的低速側出現行進的壓縮波與膨脹波，由相對低速流以超音速對流的剪切層結構造成；由波角推得相對低速流的對流馬赫數落在 2.1 至 2.6，遠高於等熵壓力匹配模型給出的約 1，佐證了 Papamoschou 指出的對流馬赫數不對稱。成長率方面，等熵對流馬赫數大於 0.3 時與他人結果吻合良好；小於 0.3 時卻完全不收攏——第 7 至 9 例在極低壓縮性下反而出現成長率下降，而等熵對流馬赫數相同、僅高速側改為次音速的第 10、11 例幾乎回到理論不可壓縮值。另一項與追問直接相關的結果是：分隔板尖端壓力不匹配產生的強平面波雖使剪切層明顯彎折，下游視覺厚度仍在標稱值的 5% 以內；但較弱的平面波卻能讓原本看不到的二維大尺度結構出現。",
    summary: "本摘要由本站自出版社排版版 PDF（AIAA，arc.aiaa.org）整理，頁碼為期刊印刷頁。\n\n動機（第 2248 頁）：等熵壓力匹配模型在兩側靜壓與比熱比相近時會給出 Mc1 約等於 Mc2，但 Papamoschou 量到的對流速度顯示兩側總壓損失極不對等。Papamoschou 與 Dimotakis 因此推測震波只在剪切層的一側由亂流結構產生；然而這些模型所假設的強震波，在本文之前從未在剪切層實驗中被偵測到。本研究即為處理此問題並補充可與他人比較的成長率資料而設計。\n\n設備與診斷（第 2248 至 2249 頁）：GALCIT 超音速剪切層燃燒設施，雙流吹放式，標稱運轉時間 3 s（原為 H2/F2/NO 化學反應流設計，本文全為非反應實驗）。高速側固定為 M1 約 1.5 的超音速流，低速側為 M2 小於 0.5 的次音速流，不同壓縮性主要靠更換兩側氣體組合達成。診斷包括 20 ns 火花側視紋影、每側 6 個導壁靜壓計（其中少數為可解析時間的 1 MHz 壓電式）、16 支橫流總壓管與 16 支熱電偶。剪切層厚度採自紋影判讀的視覺厚度，量測站距分隔板尖端 0.38 m。低速側流場均勻性經皮托管確認在自由流速度的正負 1% 內；高速側分隔板尖端的邊界層計算為紊流（Rex 約 10⁶），位移厚度約 0.5 mm，分隔板尖端為 5 度收斂、尾緣半徑約 0.25 mm。不可壓縮成長率的正規化採 Brown 的表達式，常數取 0.17。\n\n行進波與對流馬赫數不對稱（第 2250 至 2251 頁）：壓縮性最高的第 1 例在低速流中出現規則的行進波系，由剪切層發出並經下導壁反射，壓縮波與膨脹波交替出現以維持可忽略的流向壓力梯度。波的特徵間距與局部剪切層厚度同量級，暗示確有某種大尺度結構存在，但紋影本身看不到展向連貫的大尺度結構。波角緊密集中在 23 至 28 度之間，據此推得相對低速流的對流馬赫數為 2.1 至 2.6；兩個相距 5 cm 的壓電壓力計互相關的峰值落在 59 μs，佐證了同一結論。取 Mc2 約 2.54 則關係式要求 Mc1 約 0.31。作者同時指出困難處：觀察到的行進波太弱，不足以提供調和滯止點壓力匹配模型所需的總壓損失；若把再壓縮過程模型化為單一正震波，所需的震波馬赫數約為 7，而這種強震波在任何實驗中都未被偵測到。\n\n成長率的收攏與不收攏（第 2252 頁）：11 個案例的正規化成長率對等熵推算的對流馬赫數作圖，並與他人資料並列。等熵對流馬赫數大於 0.3 時收攏良好，且高壓縮性下成長率明確偏低，與線性穩定性理論一致。但小於 0.3 時資料完全不收攏：第 7 至 9 例在極低壓縮性下反而出現成長率下降，而第 10、11 例為全次音速流，等熵對流馬赫數與第 8、9 例相同，成長率卻幾乎回到理論不可壓縮值。作者明確點出，這兩組之間唯一的實質差別是高速側 M1 大於 1 或小於 1；雷諾數、速度比與密度比（第 10 例除外）大致相同。這是本站追問要對照的段落。\n\n低密度比的角色（第 2252 至 2253 頁）：第 7 至 9 例的密度比低於圖中所有其他可壓縮流場（第 8、9 例分別為 0.10 與 0.058），這是以增加低速側氦含量來製造低壓縮性流場的必然副產品。作者強調低密度比本身不會造成異常低的成長率——本研究第 11 例，以及 Brown & Roshko、Frieler & Dimotakis 的低密度不可壓縮結果都是反證——只有低密度比與超音速自由流馬赫數兩者耦合才出現。作者推測高速側的雙曲性會抑制由下游往上游的回饋機制，並明言這個新機制與 Koochesfahani & Frieler 所指的尾流效應無關。第 8、9 例的密度比落在不可壓縮實驗資料庫之外，故無法排除行為出現質變的可能。\n\n入射波的影響（第 2253 頁）：兩個偏離設計點的第 3 例最直接回答本站的追問。其一，分隔板尖端因兩側靜壓嚴重不匹配而產生強平面波，該波經上導壁與剪切層反射並使剪切層明顯彎折，但下游的視覺厚度仍在標稱值的 5% 以內——成長率對入射震波與膨脹波相對不敏感。其二，另一個尖端波較弱的案例，剪切層卻出現可觀的二維大尺度結構，而這在正常壓力匹配的流場中從未出現；作者推測是尖端平面波經由某種共振強迫促成了二維結構。作者同時指出，在可取得資料的偏離設計點流場中，只有少數表現出這種結構增強，顯示要達到所需的共振並不容易。\n\n作者自陳的限制（第 2251 至 2253 頁）：紋影是展向積分的可視化，無法斷定看不到大尺度結構是因為三維扭曲，還是被疊加的小尺度高梯度界面遮蔽；同樣的理由也可能掩蓋內嵌的震波。低壓縮性分支的成因作者自承所知甚少。",

    contribution: "以平面雷射米氏散射（PLMS，凝結酒精霧）與一氧化氮的平面雷射誘導螢光（PLIF），在側視、俯視與端視三個切面成像，量測對流馬赫數 0.28、0.42、0.50、0.62、0.79 的雙流平面混合層。結論是大尺度結構並未消失，而是改變了性質：Mc = 0.28 與 0.42 由展向渦捲主導，0.62 與 0.79 轉為明顯三維、外觀無序的結構，0.50 為過渡狀態、兩類結構並存。渦捲核心的形狀自橢圓轉為多邊形，編織區出現特徵性的扭折。捲吸方式隨之改變：低 Mc 的混合分率場沿流向傾斜而橫流方向均勻，高 Mc 則常沿橫流方向傾斜、甚至出現兩層分明的混合區。PLIF 統計顯示兩例的平均剖面相近，但 Mc = 0.62 的均方根擾動約小 15%，且在層的高速側特別受到抑制。",
    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n方法的用意（第 171、174 至 179 頁）：本研究刻意採用平面雷射切面成像，而非紋影這類沿展向積分的整合式技術。PLMS 用凝結的酒精霧滴，分產物生成模式與被動純量模式；PLIF 則以摻入的一氧化氮定量取得混合分率場。三個切面（側視、俯視、端視）並用，正是為了判別結構的三維性。\n\n紋影本身的技術侷限（第 183 頁）：在 Mc = 0.28 的側視紋影中，Brown–Roshko 大尺度結構可持續到數千倍的 x/θ 與很高的局部雷諾數（以視覺厚度計約 380000）。此結果與 Chinzei 等人 (1986) 的低對流馬赫數紋影一致，卻與 Goebel & Dutton (1991) 及 Hall 等人 (1991a) 不一致——後兩者看到的 Brown–Roshko 結構並不主導。作者直接指出：這種分歧可能來自紋影技術本身，因為刀口位置不同會強調不同類型的結構。這是本站追問要對照的段落之一。同頁的成長率彙整圖也引用 Papamoschou & Roshko (1988) 的提醒：壓縮性對不同的厚度定義可能作用不同。\n\n結構性質的轉變（第 199 至 201 頁）：PLMS 顯示混合層自低對流馬赫數的準二維，明確轉變為中等對流馬赫數的三維。與此同時，渦捲本身也在變：Mc = 0.28 時核心外觀相對圓潤或橢圓，Mc 升高後逐漸變成方形或多邊形；編織區則發展出一個扭折，在 Mc = 0.5 與 0.62 特別明顯，Mc = 0.28 完全看不到。作者明言這種渦捲變化的原因不明，且似乎未被線性穩定性理論或既有模擬預測到。\n\n究竟是物理還是可視化（第 202 頁）：這是本站追問最直接的對應段落。作者指出 Sandham & Reynolds (1991) 模擬出的髮夾型渦結構在本研究的可視化中並不明顯，並列出三種可能：其一，這些結構在真實流場中不存在；其二，我們沒有用對的技術去看它；其三，結構存在，但同時存在許多其他模態，使任何單一模態都難以分辨。作者明白寫下：不知道哪一種解釋才對。接著補充兩點佐證：Chen (1991) 的模擬顯示，即使渦結構是有組織的，被動純量場仍可能看起來無序，因為純量場同時受到當下與過去渦運動的影響；而第三種解釋也有道理，因為線性理論預測在本研究最高的對流馬赫數下，許多不同角度的斜波放大率相當接近，加上超音速風洞本身有顯著的聲學擾動，可能形成一組複雜的交互作用模態。作者並註明此議題仍有分歧，Samimy 等人 (1992) 與 Elliott 等人 (1993) 都回報了與 Sandham–Reynolds 相似的結構。\n\n排除雷諾數效應（第 202 頁）：作者強調觀察到的二維轉三維不是雷諾數效應。理由有二：其一，雷諾數自 x = 15 cm 到 45 cm 變化達三倍，若是雷諾數效應，結構應沿測試段由前到後改變，但所有可視化都顯示同一馬赫數下流場性質在各區域相同；其二，Mc = 0.28 在 x = 45 cm 與 Mc = 0.62 在 x = 15 cm 的雷諾數幾乎相同，兩處的亂流結構卻完全不同。\n\nPLIF 統計與混合（第 207 至 213 頁）：Mc = 0.28 與 0.62 兩例的混合分率平均剖面相近，但後者的均方根擾動約小 15%，且在高速側特別受抑；兩例的機率密度函數都有一個橫越層移動的峰，但 Mc = 0.28 的個別分佈通常較寬。這些統計與定性觀察一致：Mc = 0.62 時純流體侵入層內的情形較少，高速側的純量梯度也較弱。作者推論壓縮性增加了大尺度的攪拌，照理有助於混合，但隨即指出先前的混合量測並不支持此推論——壓縮性看來反而降低、或幾乎不影響分子尺度的混合效率。\n\n作者自陳的限制：髮夾渦是否存在的三種解釋，作者明言無法判定；紋影結果與他人不一致的成因也只能歸於技術差異的推測。",

    question: "若壓縮性不是透過膨脹耗散起作用，抑制機制究竟落在能量收支的哪一項？",
    contribution: "以四組對流馬赫數 0.2、0.6、0.8、1.2 的時間發展型混合層 DNS 資料庫（皆解析到小尺度、含完整能量串級）逐項檢視能量收支，回答成長率為何隨壓縮性下降。結論分兩步：其一，排除膨脹類機制——即使 M = 1.2 的流場中出現渦震波，膨脹耗散仍遠小於總耗散，壓力-膨脹項雖略大卻反覆變號、同樣不顯著；其二，指認真正的機制——藉由積分生成項與成長率的精確關係，配合雷諾應力張量的積分方程，顯示成長率的下降來自壓力-應變項的減弱，而壓力-應變的減弱又源於壓力擾動本身被壓抑。作者並給出物理解釋：自由流壓力相對於 ρ(ΔU/2)² 以 1/(γM²) 下降，若壓力擾動維持不可壓縮時的量級，高馬赫數下會出現負壓，故壓力凹陷必須變淺。作者據此建立以可壓縮渦模型與音速渦概念為基礎的確定性模型，再以簡單的各向異性考量封閉，所得預測與 DNS 統計吻合良好。",
    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n資料庫與設定（第 237 至 238 頁）：時間發展型混合層，兩側自由流速度等值反向，直接數值模擬完整可壓縮 Navier–Stokes 方程，涵蓋對流馬赫數 0.2、0.6、0.8、1.2 四例（結合不同研究群既有的資料庫，故數值方法不盡相同：0.2 與 0.6 用加權四階中央差分，0.8 用傅立葉配置加 Padé，1.2 在偵測到夠強的震波時切換為三階上風 MUSCL 格式）。流向與展向為週期性，法向在 M = 0.8 用特徵非反射條件、其餘用自由滑移壁。初始擾動取自線性穩定性理論：M 至 0.6 最不穩定模態為二維，更高則為三維，故 0.8 與 1.2 只用一對等量反向斜模態。四例的成長率分別為 0.072、0.058、0.038、0.030，M = 1.2 約為 M = 0.2 的 40%，與實驗觀察到的下降幅度大致相符。\n\n排除膨脹類機制（第 244 頁）：把總耗散拆為螺線部分與膨脹部分。即使在含渦震波的階段，膨脹耗散仍極小；壓力-膨脹項略大，但在模擬過程中多次變號，相對總耗散同樣不顯著。對流馬赫數較低、不含渦震波的案例，這兩項更小。作者的結論很明確：渦震波確實會提高膨脹類項，但其貢獻相對總耗散太小，不足以解釋成長率下降；受壓縮性影響遠大的是生成項與壓力-應變項，因此下降必須從這兩項來解釋。這是本站追問要對照的段落之一。\n\n定位到壓力-應變（第 245 至 246 頁）：作者先指出成長率的下降無法用生成項與壓力-應變項的比值來解釋——兩者都隨馬赫數大幅下降，比值只略降。改由對角雷諾應力方程著手：積分後的方程顯示，雷諾應力各向異性項與耗散各向異性項相對都小，於是成長率與對角壓力-應變分量之間存在近似的正比關係，並為資料所證實。若亂流為等向，這個關係會化為成長率與快速壓力-應變項的精確正比。\n\n壓力擾動被壓抑的物理理由（第 247 頁）：無因次化後自由流壓力等於 1/(γM²)，四例的參考壓力分別印為 16.85、1.98、1.12、0.50。由於近乎不可壓縮情形（M = 0.2）的壓力凹陷量值已明顯大於 M = 1.2 的自由流壓力，壓力凹陷必須隨馬赫數變淺，否則最小壓力會變成負值。壓力擾動的縮減使壓力-應變項（尤其快速部分）減弱，作者遂以一個描述壓力極值縮減的因子建模。這是本站追問要對照的另一段。\n\n模型與其修正（第 248 至 252 頁）：以可壓縮渦模型與音速渦概念把壓力極值表為對流馬赫數的函數，完成等向近似下的模型；該模型能定性重現成長率下降，但在高馬赫數下預測值偏低。再納入各向異性修正後，對成長率下降的定量預測明顯改善，並能同時預測積分雷諾應力、壓力-應變項與耗散隨馬赫數的變化。\n\n作者自陳的限制（第 238、242 至 243 頁）：DNS 難以達到嚴格自相似，因為齊次方向的計算域有限，會縮小統計樣本並在模擬後期限制大尺度結構成長；以三條不同關係式回推的成長率與直接量得者最大相差 9%、10%、16%，作者以此作為偏離自相似程度的量度，並認為誤差小到足以支持分析。此外所有模擬都在低雷諾數下進行，串級的尺度範圍可能不足以建立小尺度等向性，故耗散張量的對角分量呈現可觀的各向異性，與極高雷諾數下的等向耗散假設不同。",

    note: "書目已依出版社排版版 PDF 的頁眉（J. Fluid Mech. (1996), vol. 320, pp. 235-258）與頁尾 DOI 戳記核對。附帶一提：第 247 頁印出的參考壓力在 M = 0.2 為 16.85，但本站依原文自己給的 1/(γM²) 代入得 17.86；其餘三例（1.98、1.12、0.50）與公式吻合。引用該數值前建議自行再核。"

    question: "平面 PIV 給出的速度場，與 1980–90 年代的 Pitot／LDV 成長率是否自洽？",
    contribution: "以粒子影像測速（PIV）取得對流馬赫數 0.25、0.63、0.76 之二維亂流混合層的平面雙分量速度場，高速側自由流馬赫數最高 2.25、剪切層雷諾數達 10⁶。自洽性方面結論明確：平均流向速度剖面在整個壓縮性範圍收攏極佳，平均渦度剖面亦收攏並落在 −∂u/∂y 曲線上；雷諾應力與擾動強度在絕對量值與隨壓縮性的走勢上都與既有的逐點量測（尤以 Goebel & Dutton 1991）吻合良好，作者據此判定粒子、成像系統與分析流程通過驗證，並指出本研究的空間解析度約 0.9 mm 與 LDV 相當。結構方面則帶出新資訊：瞬時場顯示高橫向渦度被侷限在數層（平均為兩層）沿流向的薄片中，彼此橫向少有連通，且這些薄片的位置靠近實驗室座標的音速線，暗示剪切層對駐留擾動敏感；作者認為這種橫向連通受阻正是橫向擾動與雷諾應力受抑、進而導致成長率下降的結構成因。",
    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n設備與條件（第 194 至 199 頁）：大型吹放式風洞，三個工況刻意逼近 Island (1997) 的 Mc = 0.25、0.63、0.76 以便對照，其中 Mc = 0.76 藉由低速側改用氬氣提高剪力達成。PIV 以 2000×2000 像素、9 μm 像元的慢掃描非增強型 CCD 於 90 度方向取雙曝光粒子影像，200 mm 微距鏡通常收至 f/16 以兼顧粒子像大小與景深；兩個可壓縮工況在成像光路中加入旋轉鏡以放大位移、容許更短的曝光間隔。位移場以 FFT 自相關求得，再由自製軟體控制驗證、內插與平均——作者指出自相關常被詬病的方向模糊在本流場中不成問題，因為速度向量所在的半平面可事先指定。紋影顯示低壓縮性下的展向連貫渦捲，在高壓縮性下讓位給較無組織、瀰散的外觀。作者同時誠實列出實驗流場與理想平面剪切層的差異：流場受側壁侷限且下游壁面已近到會影響成長、分隔板兩側與尖端有邊界層與有限厚度而在發展初期引入尾流成分、超音速側存在來自邊界層分離與壁面接合處的波系（壓力量測顯示這些波很弱）。\n\n瞬時結構（第 207 至 209 頁）：可壓縮情形下的高渦度區傾向組織成數層沿流向的薄片，出現在不同的橫向位置，平均為兩層（偶爾一層或三層）。這些薄片橫跨層厚的比例小於不可壓縮的渦捲，彼此之間橫向連通很少，作者據此推論跨層的流體輸送是斷續進行的：在大梯度區快速通過，在其間相對無旋的空間則受阻。移動座標下的瞬時流線顯示，結構自不可壓縮時的圓潤連貫，隨壓縮性增加而逐漸扁平、傾斜並瓦解。作者自陳這些觀察建立在代表性影像的取樣上，並註明不可壓縮的渦度場未必總是呈現清楚的渦捲與編織結構，可壓縮情形的薄片結構偶爾也會退化為較無組織的渦度分佈。\n\n與既有量測的自洽性（第 209 至 212 頁）：這是本站追問要對照的段落。平均流向速度剖面在三個壓縮性下收攏極佳，作者特別點出，速度量值場在瞬時場中的顯著差異在平均後被完全抹平，正說明瞬時診斷對辨識結構的價值。平均展向渦度剖面同樣收攏，且落在 −∂u/∂y 曲線上，反過來驗證了由速度場計算渦度的作法。統計量方面：流向擾動強度的峰值在整個壓縮性範圍只略降，與逐點量測（Goebel & Dutton 1991）及 DNS（Freund 1997）一致；橫向擾動強度則被大幅壓抑，自 Mc = 0.25 到 0.63 下降 28%，但效應隨即飽和，Mc = 0.76 的峰值僅再低 7%；雷諾應力的衰減達 29%。擾動不對稱度 σu/σv 與雷諾應力相關係數也與 Goebel & Dutton (1991) 吻合，其中相關係數的峰值約 0.6，對壓縮性相對不敏感。作者總結：本研究的雷諾應力與前人逐點量測在絕對量值與隨壓縮性的走勢上都吻合良好，等於驗證了粒子、成像系統與分析技術；以平面掃描得到的亂流統計量，已可與最嚴謹的逐點研究相比，空間解析度約 0.9 mm 與 LDV 相當。\n\n二維散度與音速線（第 210、219 頁）：平面技術只能算出散度的兩個分量，作者明講這只是壓縮性現象存在與否的粗略指標，其粗糙程度反映在橫向剖面的散布上。儘管如此，兩個可壓縮工況的峰值明顯高於不可壓縮情形，且峰值位置靠近橫向的音速線位置，與高梯度區位於實驗室座標音速線附近的觀察互相呼應，暗示流場對駐留擾動敏感。\n\n整體結論（第 218 至 219 頁）：本研究記錄到速度場的壓縮性結構變化，與先前在純量場觀察到的變化相對應；壓縮性藉由中斷橫向連通而妨礙混合的想法，得到速度梯度場與渦度場行為的支持，也與音速渦模型一致——該模型預測有效捲吸運動的長度尺度受限於能跨越約當地音速之速度差的尺度。",

    contribution: "以 DNS 模擬自次音速到超音速的亂流剪切層（對流馬赫數 0.3、0.7、1.1，以渦度厚度計的雷諾數最高 13600），並與低、高馬赫數實驗剖面及 Rogers & Moser (1994) 的不可壓縮 DNS 能量收支交叉驗證。就本站追問而言答案明確：膨脹類項小到在收支圖上略去不畫；表 3 顯示 ε̄11 幾乎不隨 Mc 變（3.8 降到 3.03 乘以 10⁻³），但 ε̄11 − Π̄11 減半以上，故只有壓力-應變項 Π̄11 受 Mc 強烈影響，成長率下降應歸因於此，而 Π̄11 的減弱又以壓力均方根的下降為主因。本文更給出 Vreman 等人所無的機制解釋：可壓縮流中壓力擾動以有限聲速傳播，跨越特徵渦尺度 l 需時 l/c，此聲學延遲相對於流動時間尺度隨馬赫數上升，造成渦內相鄰點去相關，因而抑制了維持亂流所需的分量間能量傳遞。分析中自然浮現梯度馬赫數 Mg = Sl/c 與亂流馬赫數 Mt = u/c 作為主要的壓縮性參數。",
    summary: "本摘要由本站自出版社排版版 PDF（Cambridge University Press）整理，頁碼為期刊印刷頁。\n\n設定與驗證（第 332 至 341、361 頁）：大計算域、大網格與寬頻初始條件配合高階數值格式，確保模擬達到完全發展的亂流，以渦度厚度計的雷諾數最高達 13600。驗證分兩層：亂流強度剖面與低、高馬赫數的實驗資料都吻合良好；更嚴格的一項是把準不可壓縮的 Mc = 0.3 案例的湍動能收支，與 Rogers & Moser (1994) 獨立進行的不可壓縮剪切層 DNS 比對，同樣吻合。附錄另以改變域長、加密解析度與調整濾波特性的額外模擬檢查，作者自陳其中 A7 案例的計算域較小、兩點相關未完全衰減到零，但由成長曲線幾乎不受域長影響，判定品質仍可接受。\n\n把兩種解釋分離開（第 344、346 頁）：這是本站追問要對照的段落。湍動能收支圖的圖說直接寫明，壓力-膨脹與可壓縮耗散都很小，因此不予繪出。更關鍵的是表 3 的數字：對流馬赫數自 0.3 增至 1.1 時，ε̄11 僅由 3.8 微降至 3.03（乘以 10⁻³），而 ε̄11 − Π̄11 卻自 1.568 乘以 10⁻² 降到 7.125 乘以 10⁻³。由於 Π̄11 為負，這代表變化幾乎全部來自 Π̄11。作者據此判定：只有壓力-應變項受對流馬赫數強烈影響，動量厚度成長率的下降是它的後果。再往下追一層，壓力-應變只能透過壓力擾動或速度梯度擾動的強度下降而減弱，而 DNS 顯示主導者是壓力均方根。\n\n為何壓力-應變會下降（第 347 至 352 頁）：這是本文相對於前人的新分析。嚴格不可壓縮流中壓力的信號速度為無限大、滿足以速度梯度為源項的 Poisson 方程；可壓縮流中壓力擾動則以聲速傳播，改由波方程支配。作者在剪切層中心假設局部齊次亂流，於傅立葉空間求解，得到壓力-應變相關隨壓縮性單調下降，並取得低馬赫數與高馬赫數兩端的漸近行為；過程中梯度馬赫數 Mg = Sl/c 與亂流馬赫數 Mt = u/c 自然浮現為主要參數，在自相似剪切層中兩者都可與對流馬赫數相關聯。作者同時檢驗推導所用的等熵假設：壓力與密度擾動的互相關在本研究最高的對流馬赫數下仍然良好，於剪切層中心偏離 1 最大約 3%，故以密度擾動線性依賴壓力擾動的假設站得住腳。\n\n物理圖像（第 360 頁）：作者把上述分析翻成一句話——有限聲速使壓力訊號跨越特徵渦尺度 l 需時 l/c，此聲學延遲相對於流動特徵時間（1/S 或 l/ΔU）的比值隨馬赫數上升，造成渦內相鄰點去相關，而去相關正抑制了維持剪切流亂流所需的分量間能量傳遞。作者明言，這可視為對長久以來所謂高速流場中擾動間通訊受阻之說法的數學佐證。\n\n各向異性（第 353 至 354、361 頁）：在自相似狀態下，各亂流分量都隨馬赫數下降，但對各向異性只有弱影響，與 Samimy & Elliott (1990) 及 Chambres 等人 (1998) 的實驗一致。作者特別註明一項與他人結果的差異：部分實驗與 DNS 回報橫流分量 v² 的下降遠大於流向分量 u²，本研究在剪切層發展初期也看到類似情形，但當流場接近最終自相似狀態後就不再如此。\n\n密度比效應（第 355 至 359 頁）：另一組模擬固定 Mc = 0.7、改變密度比 s。動量厚度成長率隨 s 大幅下降，渦度厚度成長率的變化則較小。主要機制並非最大剪應力本身下降（其降幅有限），而是最大剪應力的位置、等價地說分界流線，往低密度側偏移，使動量輸送 ρuv 大幅減少；此偏移是平均動量守恆的結果。作者導出關聯偏移量與成長率的解析式，並得到兩項推論：不等的自由流密度必定使動量厚度成長率下降；且該式在 s 換成 1/s 時不變，故上下兩股密度互換不改變動量厚度的漸近值。",

    contribution: "在 2 ft × 1.5 ft 跨音速風洞量測一系列矩形凹槽頂面與後方的時均與非穩態壓力。指出非穩態壓力同時含隨機與週期成分：淺凹槽（L/D > 4）以隨機成分為主，最強處在後壁附近；深凹槽（L/D < 4）以週期成分為主，並可能形成駐波。把週期成分歸因於凹槽內的聲學共振，由類似邊音的機制激發，據此推得回饋式共振頻率公式。式中常數 K 被指認為渦對流速度佔自由流速度的比例，由陰影照量得約為三分之二。週期壓力的均方根值可達自由流動壓的 0.35 倍，並可用凹槽前緣的小擾流板抑制。",
    summary: "本摘要由本站自出版社掃描原文整理，頁碼為印刷頁。\n\n量測配置（第 1 頁摘要）：在 2 ft × 1.5 ft 跨音速風洞頂面開一系列矩形凹槽，量測頂面與後方的時均與非穩態壓力。\n\n兩種成分（第 12 頁結論 i、ii）：非穩態壓力同時含隨機與週期成分。淺凹槽（L/D 大於 4）以隨機成分為主，最強處在後壁附近；很淺的凹槽則在氣流重新貼附凹槽頂面處出現局部強擾動區。深凹槽（L/D 小於 4）以週期成分為主。\n\n機制與公式（第 11 頁）：週期成分歸因於凹槽內的聲學共振，由類似邊音的機制激發。由渦與聲波的相位關係推得回饋式共振頻率公式，式中常數 K 被指認為渦對流速度佔自由流速度的比例，由 L/D 等於 2 的陰影照量得約為三分之二。\n\n關鍵前提（第 11 頁）：公式把凹槽內聲速直接取為自由流聲速。原文的辯護是該速度範圍內兩者溫度僅差約 20%，聲速誤差小於 10%，並由此推論凹槽內空氣相對靜止、捕獲渦很弱。這個前提正是外推到超音速時最先失效的地方。\n\n量級與抑制（第 12 頁結論 iii、iv）：週期壓力的均方根值可達自由流動壓的 0.35 倍；在凹槽前緣加裝小擾流板可抑制。\n\n符號對照（第 13 頁）：原文用 k 表示渦對流速度比、用 φ 與 γ 表示相位項。後續文獻改寫為 κ 與 α，查原文時容易對不上。",

    summary: "本摘要由本站自出版社排版版 PDF（Journal of Sound and Vibration）整理，頁碼為期刊印刷頁。注意 PDF 中夾有兩頁未編號的圖版（Plate 1、Plate 2），故 PDF 頁次與印刷頁碼不一致。\n\n設備與量測（第 545 至 546 頁）：MIT 海軍超音速風洞，測試段寬 18 in、高 24 in；凹槽長 20 in、深度連續可變、寬度僅為長度的三分之一（作者說明這比橫跨風洞的短凹槽更接近實機構型）。馬赫數 0.8、1.5、2、3，單位雷諾數 0.5 至 5 百萬每呎，停滯壓力 2 至 15 lb/in²。脈動壓力以九支 0.25 in 壓電式麥克風量測，分佈於來流邊界層下方、凹槽底部中線、底部對角、後隔板與兩側玻璃壁；第十支裝在可遙控縱向遍歷的桿內，用以細查不穩定壓力的縱向分佈。另有靜壓孔、皮托管與熱電偶。三分之一倍頻程頻譜位準的預期精度不低於正負 3 dB。\n\n凹槽內部流場與溫度（第 547 頁）：毛線束顯示凹槽內的平均流主要是單一由外流驅動的渦，回流速度隨深度增加。來流為層流時回流速度低到無法量測，因為驅動回流的剪應力遠低於紊流情形。熱電偶量得的凹槽靜溫用以推算內部聲速；量到的回復因子接近 1，因此把凹槽溫度視為自由流停滯溫度所造成的誤差在低馬赫數可忽略，到馬赫數 3 才升到百分之幾。\n\n邊界層狀態的決定性（第 548 頁）：脈動壓力以自由流動壓正規化後可以收攏——動壓變化達 14 dB，正規化頻譜在含大部分脈動能量的頻帶內仍在量測精度內一致。例外出現在馬赫數 3 且來流為層流時。在馬赫數 3，來流為紊流時完全看不到共振響應，層流時卻出現強烈的共振峰；紋影亦印證此點：層流時震波與邊界層都明顯彎曲、流場很不穩定，紊流時則看不到大幅擾動。原文註腳指出，在這種條件下脈動壓力可高達凹槽內平均壓力的 50%。\n\n修正 Rossiter 公式（第 550 頁）：Rossiter 原式取 α = 0.25、kv = 0.57，在馬赫數 0.8 與 1.5 吻合良好，在 2 較差、在 3 更差。作者指出癥結在於 Rossiter 假設凹槽內聲速等於自由流靜聲速，即回復因子為零，而本研究實測的回復因子接近 1；改以自由流停滯聲速代入後，馬赫數 2 與 3 的相關性大幅改善，作者稱此為當時可用來整理凹槽離散頻率響應的最佳方法。\n\n淺凹槽不是古典共振腔（第 551 頁）：遍歷麥克風量到的縱向 rms 壓力分佈形似縱向簡正模（n = 1、2、3），但這些所謂模態出現的頻率低於理想縱向簡正模的頻率——不論假設表面為封閉（無位移）或開放（無壓力擾動）皆然。振幅自前緣往後緣增加，前後差可達 10 dB。作者以能量論證解釋：凹槽儲存的聲能正比於振幅平方乘體積，每週期與外流交換的能量正比於振幅平方乘表面積，兩者比值正比於深度；因此深凹槽 Q 值高、能以簡正模共振，淺凹槽 Q 值低、共振不良，但仍可被外流以相對確定的頻率驅動。驅動機制看來像一個位於尾緣附近的聲源，壓力位準往前緣以 1/r 衰減，而這正是基本理論算出的衰減率。\n\n殘餘誤差歸屬（第 552 頁）：這是本站追問要對照的段落，作者把剩下的問題分成三塊。其一是凹槽聲學阻抗：以停滯聲速正規化的頻率隨馬赫數上升會趨近封閉腔的簡正模頻率，作者引 Garrick 的高馬赫數近似說明，馬赫數越大則壓力擾動相對於界面位移越大、界面呈現的阻抗按比例增大，於是趨近封閉腔頻率；作者明言修正式可以再改以呈現此極限，但那會使公式更加經驗性——換言之這一段殘差不在修正式的機制之內。其二是哪些頻率真的會出現：修正式只能預測可用的振盪頻率，要決定實際觀察到哪些，必須放棄這類簡單公式，改用 Covert (1970) 那類理論，且需針對淺凹槽再作修改。作者強調完整的振幅理論必須納入邊界層參數，並列出兩項已確立的事實：層流轉紊流會大幅改變凹槽響應；一旦來流為紊流，凹槽內的脈動壓力特性在本實驗的雷諾數範圍內對雷諾數不敏感。其三是振幅預測，作者稱這是更困難的問題，並指出馬赫數 3 的資料顯示非線性效應重要。作者並據紋影反駁 Plumblee 等人主張凹槽振盪是對紊流邊界層壓力擾動之線性響應的說法：層流邊界層本身噪音較低，卻產生更強的脈動，Krishnamurty 的資料亦支持此結論。",

    contribution: "Heller 與 Bliss 將開放式凹槽振盪描述為外部剪切層、凹槽內部雙向壓力波、前緣反射與尾緣週期性質量交換所構成的自持回授系統。作者提出 mass-addition／mass-removal 與 pseudopiston 概念，說明尾緣剪切層位移如何透過淨體積流率驅動凹槽內部壓力波。研究並建立上游衰減波與下游放大波的兩波模型，指出 Rossiter 型關係可預測候選共振頻率，但不能單獨預測模態起振、主導模態或飽和振幅。大型風洞實驗顯示第二模態經常占優勢，實際模態形狀因尾緣非理想反射而偏離封閉腔體。研究亦以物理機制為基礎驗證上游擾流片、傾斜尾緣及分離式尾緣整流罩等抑制方法，其中傾斜尾緣能穩定剪切層並削弱相干質量交換，是最具潛力的被動方案之一。",
    summary: "本摘要由使用者依 AFFDL-TR-74-133 原始報告整理後提供，本站未取得原文。原始掃描件的 OCR 對公式與部分圖說辨識不佳，若要逐字引用公式、數值或圖表，須回到對應頁面影像人工核對。\n\n工程問題：高速外流掠過開放式凹槽時，開口上方形成自由剪切層，與凹槽內可壓縮流體、前後壁面及尾緣流動耦合後，可能產生高強度窄頻的近週期壓力振盪。跨音速條件下共振頻率附近的壓力級可接近 180 dB，影響鄰近結構、儀器、通訊與乘員環境。因此不只要預測頻率，也要理解模態強度、起振條件與被動抑制。\n\n方法：理論上把問題視為剪切層、凹槽內上下游行進波、尾緣週期性質量進出三者的耦合系統，以剪切層上下兩側的可壓縮波動方程建立色散關係，取主要上游波與下游波構成兩波模型。實驗分三層：傾斜水桌的淺水類比用來直接觀察剪切層振動、內部波傳播、前緣反射與尾緣質量交換；BBN 小尺度壁面噴流設施做次音速探索與幾何快篩；大尺度實驗在 NASA Lewis 8 × 6 ft 跨音速風洞完成，馬赫數約 0.8 至 2.0，凹槽長 36 in、寬 9 in、深度可調，L/D 約 2.25 至 6.0。\n\n尾緣質量進出機制：剪切層向下偏轉時尾緣區有額外流體進入凹槽（mass addition），抬升內部壓力並產生朝前緣傳播的壓縮波；向上偏轉時原本維持穩態質量平衡的尾緣流入受到抑制，這種相對於穩態流入量的減少即為等效的 mass removal，不一定代表有等量流體直接射出。週期性的質量進出造成凹槽流體壓縮與膨脹，成為內部壓力波與自持振盪的驅動機制。\n\nPseudopiston：尾緣的三維非線性質量交換難以直接寫成邊界條件，作者將其淨體積流率等效為位於凹槽後壁的振動活塞。這不表示實體壁面會動，而是把複雜的尾緣流動轉成聲學與波動模型中可處理的邊界條件。\n\n兩波結構：向上游傳播的波由尾緣移向前緣，並向外部流場輻射能量，因此沿途衰減；向下游傳播的波由前緣反射後與剪切層耦合，可從平均流抽取能量而空間放大。兩者相速度與放大率不同，疊加後形成類駐波的壓力分布、節點腹點與多階縱向模態。\n\n凹槽不是理想剛壁聲腔：前壁可近似為反射邊界，但尾緣開口與動態剪切層不是理想硬壁。因此壓力節點偏離理想封閉腔體，尾緣附近的壓力最大值常落在實體尾壁上游，壓力振幅通常由前緣往尾緣增加，聲學有效長度短於幾何長度，模態形狀隨馬赫數與 L/D 改變。\n\n能量條件：振盪能否發展取決於回授相位，也取決於迴路增益。下游波從平均流取得能量，上游波因聲輻射而損失，黏性、湍流與內部再循環提供耗散。輸入大於損失才會成長為自持振盪。因此共振頻率條件只能指出可能發生振盪的頻率，不能保證該模態出現，也不能單獨預測振幅。\n\n與 Rossiter 模型的關係：本報告不應被描述為否定 Rossiter 模型。作者接受前緣至尾緣的下游傳播時間與尾緣回傳時間是頻率選擇的重要因素，Rossiter 的回授時間尺度能有效預測允許的離散頻率。他們質疑的是以離散渦旋脫落、撞擊尾緣、產生聲波這個圖像去解釋所有流況的基本物理並不充分——尤其超音速下剪切層可維持明顯波狀卻不必然形成清楚的離散渦旋。離散渦旋應視為某些條件下剪切層波動的非線性表現，而非唯一驅動源。作者採用先前修正過的 Rossiter 型關係，主要修正是以較接近凹槽總溫條件的內部聲速描述回傳波，並認為該式在約 0.5 < M∞ < 3.0 範圍內是當時最可靠的頻率預測方法之一。\n\n模態行為：可觀察到至少前五階離散模態，第二模態經常是壓力最強的主導模態。淺凹槽（L/D 大於 2）的無因次頻率對長深比依賴較弱，低速時長深比效應較明顯。壓力場同時含高強度離散音調與剪切層湍流造成的寬頻成分，尾緣區兩者都高於前緣區。模態強度隨馬赫數並非單調增加，部分模態在跨音速附近較強，更高超音速下因剪切層可壓縮性穩定效應而降低。\n\n抑制設計：有效者三種。上游擾流片在適當角度下可使主導模態降約 20 dB，其機制不宜簡化為讓剪切層更穩定，較準確的說法是向來流引入渦度、加厚或擾亂邊界層，降低剪切層形成高度相干週期振動的能力，從而削弱回授增益。傾斜尾緣最具潛力，斜面改變剪切層接近尾緣時的局部流動，使其不再於單一明確位置進行高度相干的週期撞擊與質量交換，可大幅降低甚至消除離散音調。分離式尾緣整流罩改變尾緣附近的流體通道，部分流況有效，但須同時考慮寬頻壓力、阻力代價與可用容積。無效者包括凹槽內部橫向擾流片、內部穿孔擋板、上游小型共振凹槽、部分斜置前後壁組合、前緣強制導入空氣、圓弧前緣配導流片；部分裝置雖降低離散音調卻抬高寬頻噪音，不算總體改善。\n\n理論限制（作者自陳）：兩波模型在高馬赫數下能合理說明波動結構，但低馬赫數下會高估下游波的空間放大率，使模型很快被下游放大波支配，無法形成實驗中的多個壓力節點與高階模態。作者歸因於把剪切層假設為無限薄渦片、未納入有限厚度與實際速度分布、未包含渦旋捲起提供的非線性振幅限制，以及尾緣質量交換相位與形狀的簡化。理論主體為二維線性無黏，也不能可靠預測各模態的飽和振幅。",
    pages: null,
    biblioCheck: "verified",
    note: "書目辨識：本筆應辨識為技術報告 AFFDL-TR-74-133，不可與 AIAA Paper 75-491 併為同一筆。執行機構為 Bolt Beranek and Newman Inc.（Cambridge, Massachusetts），合約編號 F33615-73-C-3075，正式報告日期 1975 年 2 月，前言記載手稿於 1974 年 11 月提交——報告編號中的 74 來自交稿年份，年份欄位採正式出版年 1975。核心貢獻與重點摘要均改寫自使用者依原報告整理的說明，本站未取得原文，故 pages 維持空白。"

    question: "fluid-dynamic / fluid-resonant / fluid-elastic 三分類，會不會在同一個流場中同時存在？",
    contribution: "把凹槽自持振盪整理成一個矩陣式的通用框架，分為三類：流體動力型（源自剪切層固有不穩定，並經回饋機制強化）、流體共振型（受腔內壓縮性波或自由表面波的共振駐波條件支配）、流固彈性型（主要由固體邊界的彈性位移控制）。就本站追問而言，作者的立場明確且在兩處寫死：第 152 頁指出實務上振盪可以同時由三種機制控制，第 161 頁更設有「混合激發」專節，並以簧管風琴（同時具備共振管與可撓簧片）為例說明——Vogel 的研究顯示，簧片振盪與共振器流體的耦合會產生與任一純粹子系統都完全不同的控制條件，耦合系統的自然頻率甚至落在兩個元件自然頻率所夾區間之外。作者的結論是：耦合雖能實質改變振盪的整體性質，但把系統拆解到三個基本類別仍是理解混合激發的有效途徑。綜述另涵蓋凹槽成組排列與各種形狀（矩形、圓形、三角形、哨音型、Helmholtz 型）的效應，以及以幾何修改與加質量來抑制振盪的手段。",
    summary: "本摘要由本站自出版社排版版 PDF（ASME Journal of Fluids Engineering）整理，頁碼為期刊印刷頁。\n\n三分類的定義（第 152 至 153 頁）：作者主張儘管凹槽振盪型態繁多，仍有共通特徵，足以建立通用框架。流體動力型源自流動本身的不穩定：凹槽剪切層對渦度擾動的選擇性放大，加上凹槽尾緣促成擾動往上游傳播所形成的回饋條件。流體共振型受共振波效應（駐波）影響，可能來自壓縮性波或自由表面波。流固彈性型則取決於結構系統的彈性、慣性與阻尼性質。三類以矩陣的三列呈現，第一欄為基本凹槽幾何，第二欄為實務上遇到的各種變形（閘門、伸縮管、振動襟翼等）。作者指出，唯有當凹槽長度與聲波波長之比極小時，才會出現純粹的流體動力型振盪。\n\n流體動力型的兩項要件（第 153 至 155 頁）：作者強調剪切流的放大特性只是必要條件而非充分條件；產生大振幅振盪還需要回饋——自尾緣附近發出的壓力擾動回傳至剪切層起點，提供可被進一步放大的擾動。此類振盪與射流撞擊尖劈的邊音現象有許多共通點，差別在凹槽受相鄰封閉容積的質量守恆約束。作者亦坦言當時的不足：初始為紊流的自由剪切層中擾動如何傳播仍缺乏資料，展向三維效應與平均流三維性之間的可能耦合也待研究，本綜述因此以準二維行為為主。\n\n頻率共存（第 154、156 頁）：Ethembabaoglu 在無空蝕水洞中的資料顯示，即使分離處邊界層為紊流，下游凹槽壁的壓力頻譜仍具組織性，兩個峰對應第二與第三模態；多數頻譜以單一模態為主，但兩個模態可同時存在，且隨長深比增加，主導模態會跳階。相對地，淺凹槽的流體共振型振盪以多頻共存為核心特徵——依 Heller 與 Bliss 整理的圖，在給定馬赫數下最多可有五個頻率共存，明顯多於流體動力型的兩個。\n\n混合激發（第 161 頁）：這是本站追問要對照的段落，原文標題即為 Mixed Excitation of Cavity Oscillations。作者開宗明義說三種基本激發機制可以多種方式組合，並舉流體動力型與流體共振型組合的既有討論為例。最詳盡的例子是簧管風琴：系統中同時有共振管與可撓簧片，故流體共振與流固彈性機制都可能參與。Vogel 的研究發現，簧片振盪與共振器內流體的耦合，產生的控制條件與任一純粹子系統（純流體共振或純流固彈性）都完全不同；最值得注意的是耦合系統的自然頻率會超出兩個元件自然頻率所界定的範圍。作者給出忽略阻尼時的二次式解，其中耦合係數 κ 不大於 1；隨管長變化，頻率在共振點附近出現跳階，且管長增減方向相反時跳階位置有遲滯。作者的結語很關鍵：耦合雖可實質改變振盪的整體性質，但把系統依三個基本激發類別加以綜合，仍能獲得可觀的理解。\n\n抑制手段（第 162 頁）：以幾何修改抑制振幅，形式包括斜面、上游擾流片或導流片與罩。作者引述在馬赫數 0.8 至 2.0 之間，只要長深比大於 4 即可最小化壓力脈動振幅；長深比小於 4 時則必須把前緣擾流片與尾緣斜面併用才能有效抑制。Heller 與 Bliss 對尾緣斜面何以有效提出的假說是：滯止流線的撞擊更接近垂直，同時維持撞擊流場的動量平衡。\n\n作者自陳的未竟之處（第 163 頁）：判定各振盪機制之間的耦合程度及其來源，應是主要目標。整體而言，凹槽振盪的頻率在部分情況可純理論預測、其餘可半經驗預測，但振幅尚未能妥善預測。壓力與速度擾動之間的相位關係少有人研究，而這正是理解耦合效應所必需。",

    contribution: "綜整高速凹槽流場二十年來的實驗與計算進展。核心判斷是 RANS 與 URANS 無法重現含 Rossiter 音調的跨音速凹槽流場，DES 與 LES 才能收斂並與實驗吻合，即使如此乾淨凹槽在高雷諾數下仍具挑戰。被動控制方面，前緣擾流板、懸吊桿、斜置後壁都只有有限成效且高度依賴流況，難以斷言何者較優；且多數被動控制研究屬實驗性質，仍需數值方法補足。文中並指出投放物本身會改變凹槽動力學，真實機體幾何與理想矩形凹槽的差異亦待釐清。",
    summary: "本摘要由本站自出版社排版版 PDF 整理，頁碼為期刊頁。\n\n文章性質：綜述，涵蓋過去約二十年高速凹槽流場的實驗與計算進展，並附作者自身的 M219 凹槽與 1303 UCAV 武器艙實驗資料作為驗證案例。全文結構為文獻回顧（第 187 至 205 頁）、實驗研究（第 205 頁起）、結語（第 210 頁）。\n\n為什麼重要（第 186 頁摘要）：高速凹槽出現在戰機武器艙與起落架艙，流場伴隨強聲學效應、非穩態與湍流。匿蹤無人作戰載具與機場噪音管制的需求，使凹槽流場同時成為空氣動力學與氣動聲學的問題。\n\n對紊流模式的核心判斷（第 205 頁 Outcomes、第 210 頁結語）：RANS 與 URANS 無法重現含 Rossiter 音調的跨音速凹槽流場；DES 能確保結果收斂並與實驗良好吻合。作者的說法是模式本身的能力問題，不是把網格加密就能解決——這正是本站追問要對的那一點。即使如此，乾淨凹槽在高雷諾數下仍具挑戰。\n\n被動控制的評價（第 205 頁）：前緣擾流板、懸吊桿、斜置後壁都只有有限成效，且高度依賴流況，難以斷言何者較優。作者並指出多數被動控制研究是實驗性質，仍需以 LES 或 DES 補足對流場的理解。\n\n尚未解決的問題（第 205 頁）：置入投放物本身會改變凹槽動力學，相關研究才剛出現；真實機體幾何與理想矩形凹槽之間的差異也仍待釐清。",

    question: "全域穩定性分析找到的模態，能不能一對一對應到實驗量到的 Rossiter 峰？",
    contribution: "對 L/D = 2 與 6 的矩形凹槽做 DNS 與雙全域穩定性分析。提高馬赫數在次音速域使流場不穩定、在跨音速域反而穩定，且會壓抑主導的三維本徵模態。短凹槽（L/D = 2）的三維模態主要源自離心不穩定；長凹槽（L/D = 6）另出現由後緣延伸至中段的模態。主導 Rossiter 模態會隨馬赫數由模態 I 移轉到模態 II。",
    summary: "本摘要由本站自出版社排版版 PDF 整理，頁碼為期刊頁。\n\n研究對象（第 270 頁摘要）：以直接數值模擬與雙全域穩定性分析，研究展向週期的可壓縮開放式凹槽流場，長深比 L/D 為 2 與 6，涵蓋次音速到跨音速、層流區間。\n\n馬赫數效應（第 270、298 頁）：次音速區提高馬赫數使流場不穩定，跨音速區反而穩定；此結論與 Yamouni 等人（2013）在 L/D 為 1 與 2 的短凹槽結果一致。主導的 Rossiter 模態會隨自由流馬赫數改變而移轉。\n\n三維模態（第 270 頁摘要）：提高馬赫數會穩定主導的三維本徵模態。短凹槽（L/D 為 2）的三維模態主要源自離心不穩定；長凹槽（L/D 為 6）除了位於後段的離心不穩定模態外，另出現由後段延伸至中段的其他型態。\n\n與 Rossiter 模態的對應（第 287、289 頁）：作者明言並非所有剪切層模態都能稱為 Rossiter 模態，因此進一步核對這些模態的頻率是否符合半經驗公式的預測，確認本文的領先本徵模態都對應到剪切層驅動的 Rossiter 模態。第 289 頁指出，主導模態在幾乎所有情況中與非線性模擬吻合良好，但 L/D 為 6、馬赫數較高時，穩定性分析給出的主導模態與 DNS 分歧——後者由 wake mode 主導。\n\n口徑提醒：文中的比對對象是 Rossiter 半經驗公式與 Brès（2007）的計算結果，不是直接對到實驗量測的峰值。本站追問問的是與實驗峰的對應，引用時需注意這個差別。\n\n長凹槽的三維性（第 270 頁摘要）：在 L/D 為 6 的三維直接數值模擬中，三維本徵模態無法清楚辨識，因為沿凹槽長度發展出的非線性效應過強。作者並指出流場的三維性有助於緩和長凹槽的劇烈振盪。",
    pages: "287, 289",
    biblioCheck: "verified",
    note: "注意口徑：文中是把本徵模態頻率對到 Rossiter 半經驗公式與 Brès (2007) 的計算，不是直接對到實驗量測峰值。p.287 確認領先本徵模態皆屬剪切層型 Rossiter 模態，p.289 指出主導模態大致吻合，但 L/D = 6、M∞ 較高時 DNS 由 wake mode 主導而與穩定性分析分歧。"

  /* --- A3 凹槽作為超燃衝壓穩焰器 --- */
  {
    id: "A-18", track: "A", year: 2001, method: "綜述", topic: "超燃衝壓穩焰",
    title: "Cavity flame-holders for ignition and flame stabilization in scramjets: an overview",
    authors: "Ben-Yakar, A.; Hanson, R.K.",
    venue: "J. Propuls. Power 17(4), 869–877",
    doi: "10.2514/2.5818",
    question: "凹槽穩焰的駐留時間優勢，與它造成的總壓損失如何權衡？",
    contribution: "綜整超燃衝壓社群當時的凹槽穩焰研究，指出凹槽因飛行試驗與實驗室尺度燃燒室的成果而受到重視，但仍缺乏系統性研究來決定損失最小而穩焰最有效的構型。就本站追問而言，本文把權衡講得很清楚，且指出它是結構性的而非可迴避的：陷渦式的小長深比凹槽正好對應最小阻力構型，但渦一旦被鎖住，捲吸進凹槽的流體極少、主流與凹槽的質量與熱交換幾近停滯，而穩焰恰恰需要持續交換；同理，抑制凹槽自持振盪雖可降低阻力，卻同時削弱質量傳輸與駐留時間，反而降低凹槽作為穩焰器的效力。作者引 Gruber 等人的計算指出一個違反直覺的結果：凹槽加長時體積雖增（應增加駐留時間），但質量交換率增加更多，淨效果是駐留時間反而下降；斜後壁亦然。實務出路是把燃料與空氣直接噴入凹槽以強化渦並提高質量傳輸。作者並自陳文獻存在尚未解決的矛盾，明列三項：斜後壁凹槽的阻力代價、壓力脈動的振幅、以及凹槽內的駐留時間。",
    summary: "本摘要由本站自出版社排版版 PDF（AIAA，arc.aiaa.org）整理，頁碼為期刊印刷頁。\n\n問題設定（第 869 頁）：要在流動的可燃混合物中完成點火與燃燒，靜溫、靜壓、燃料與空氣的混合比、以及在該條件下的駐留時間四者都必須落在合適範圍。作者比較既有的穩焰手段並點出各自的代價：橫向噴流的穿透會形成強三維弓形震波，帶來滯止壓力損失，在高飛行速度下尤甚；後向階梯則因基部低壓而同時有滯止壓力損失與阻力增加。改用傾斜噴射（例如 60 度或 30 度而非 90 度）可使弓形震波減弱，降低噴注過程的壓力損失。\n\n流態與阻力來源（第 870、872 頁）：長深比小於約 7 至 10 為開放型凹槽，大於約 10 至 13 則剪切層再接觸底壁而成為封閉型，後者因後壁附近增壓、前壁降壓而造成大幅阻力損失；轉換的臨界長深比還取決於前緣邊界層厚度。凹槽的壓力阻力有兩個來源：其一，後向階梯的基部壓力若低於自由流壓力，會在基部面積上產生順流向的淨力（基部壓力高於自由流時反而是推力）；其二，剪切層在後壁再接觸產生高壓區，作用在前向面上。作者引 Zhang 與 Edwards 的資料指出，當凹槽內振盪模態自橫向轉為縱向時，振盪位準與阻力都急遽上升；此後隨長深比增加，脈動幅度逐漸下降，平均阻力係數卻顯著上升——因為剪切層在再接觸點變厚，振盪被阻尼的同時壓力也升高。\n\n後壁角度（第 873 頁）：斜後壁可避免剪切層偏折入凹槽。作者比較 Gruber 等人的 16 度與 Samimy 等人的 20 度案例，推測在約 45 度與 16 度之間存在一個使阻力代價最小的臨界後壁角。矩形凹槽在再接觸點下方因尾緣渦加速流動而在後壁中段出現壓力下降；斜壁凹槽則角落高壓消失，再接觸點之後壓力單調上升。阻力係數強烈取決於後壁壓力分佈，作者明言此處需要更完整的研究，特別是後壁角度對阻力代價的影響。\n\n駐留時間與質量交換的耦合（第 873 頁）：這是本站追問要對照的核心段落。駐留時間直接由凹槽進出的質量交換率決定。Gruber 等人的計算顯示凹槽內有一個位於尾緣附近的大渦與一個靠上游壁的次渦；質量交換由與不穩定剪切層互動的尾緣大渦控制，兩渦之間的交換相對小。因此尾緣渦佔據的體積越大，質量交換越多、駐留時間越短。由此得到一個違反直覺的結果：凹槽加長時體積增加本應延長駐留時間，但質量交換率增加得更多，淨效果是駐留時間下降。作者引用的穩態計算估出馬赫 3 冷流中、深度 9 mm、長深比約 5 的凹槽，駐留時間量級約為 1 ms，斜壁凹槽因質量交換增加而更短；並指出非穩態效應如何影響駐留時間仍不清楚。同段還有一句直指權衡本質：凹槽振盪雖可藉穩定剪切層來抑制，但穩定化會減少質量傳輸與駐留時間，反而降低凹槽的效力。\n\n陷渦概念的兩難（第 874 頁）：低速燃燒領域的陷渦概念以最佳長深比在凹槽內建立駐定渦。作者指出，當滯止點落在凹槽下游端時渦會被鎖住，而這同時就是最小阻力構型。但緊接著的但書才是關鍵：渦被鎖住後幾乎沒有流體被捲吸進凹槽，主流與凹槽流體的交換極少，而穩焰需要的正是持續的質量與熱交換。解方是把燃料與空氣直接噴入凹槽，以強化該渦並提高質量傳輸。低速研究的結論亦呼應此點：非反應流中最穩定的凹槽流出現在產生最小阻力（即最小壓降）的最佳長深比，該長度同時給出最穩定的火焰；但有噴注時的最佳長深比應比無噴注時更大。\n\n高速凹槽的幾何準則（第 875 頁）：作者整理出的判準是，開放型凹槽因阻力係數低於封閉型而是穩焰的候選；凹槽深度依點火所需的駐留時間決定，長度則須提供足夠的自由基體積以維持燃燒。作者同時提醒陷渦概念移植到超音速的風險：高速流場的駐留時間比低速短，可能不足以維持穩焰，唯有 Damköhler 數大於 1、亦即駐留時間足以啟動點火時才可行。另指出不穩定凹槽雖可藉振盪發出的震波強化混合與點火，卻不易提供連續的穩焰區。作者也提到一個可能兩全的方向：以多孔面滲流加質除了冷卻凹槽壁面，還能降低凹槽底面的摩擦損失與震波結構相關的阻力，燃料自凹槽內滲出並提高凹槽壓力分佈，可減弱甚至消除強烈的尾緣再接觸震波，因此經最佳化的滲流冷卻凹槽有機會同時改善壓力損失與阻力代價。\n\n作者自陳的矛盾與未竟之處（第 875 至 876 頁）：作者明白寫出，不同研究者之間存在尚待實驗與數值研究解決的矛盾結果，並具體點名三項——斜後壁凹槽的阻力代價、壓力脈動的振幅、以及凹槽內的駐留時間。這一點值得注意：本文第 873 頁推測存在一個使阻力最小的臨界後壁角，第 875 頁轉述的另一組結論卻說後壁角小於 90 度會帶來額外的阻力代價，兩者的張力正是作者所指的矛盾之一。整體結論是設計最佳超音速穩焰凹槽仍需系統性地在非反應流與反應流中同時研究。",
    pages: "873–874",
    biblioCheck: "verified",
    note: "書目已依出版社排版版 PDF 的頁眉（JOURNAL OF PROPULSION AND POWER, Vol. 17, No. 4, July–August 2001）與頁尾 DOI 戳記核對。注意本文第 873 頁與第 875 頁對後壁角度的阻力效應說法不一致，作者自己在結論中把「斜後壁凹槽的阻力代價」列為文獻中尚未解決的矛盾之一，引用時不要只取單一頁。"
  },
  {
    id: "A-19", track: "A", year: 2001, method: "實驗", topic: "超燃衝壓穩焰",

    question: "非反應流下建立的 open/closed 凹槽分類，能直接套用到有燃燒的情況嗎？",
    contribution: "在馬赫 3 非反應流中，以實驗（紋影、陰影、沿展向對稱面及其偏移處的壁面靜壓分佈）與 CFD 並行研究數種凹槽式穩焰器，所有案例皆為開放型（長深比小於 10），並掃描兩個長深比、數個偏置比與後斜板角度。核心結論是後斜板角度主導跨越凹槽之剪切層的性質：角度自 90 度往下降，流場變得更穩定、更二維，分離波由壓縮性轉為膨脹性，前壁壓力持續下降；但代價是阻力係數上升、駐留時間縮短。作者指出這是幾何參數之間的強耦合——減小後壁角雖促成聲學上更穩定的凹槽流（有利穩定燃燒）並改善捲吸，卻同時降低凹槽壓力、提高阻力，並因剪切層再接觸而預期使後壁熱負荷升高。就本站追問而言最關鍵的是第 152 頁的但書：作者引 Winterfeld 對等溫流與燃燒流的比較指出，燃燒時駐留時間會變長而交換率會下降，因此本文冷流推得的駐留時間應低於燃燒實況、質量交換率則被高估；不過冷流值仍可作為完全攪拌反應器類簡化模型的輸入。",
    summary: "本摘要由本站自出版社排版版 PDF（AIAA，arc.aiaa.org）整理，頁碼為期刊印刷頁。\n\n設計目標與既有取捨（第 146 頁）：碳氫燃料超燃衝壓引擎的燃料噴注、點火與穩焰仍未妥善解決；噴注既要快速混合，又必須讓空氣流的總壓損失落在可接受範圍，而許多既有的穩焰方案是以顯著壓力損失換取穩焰。作者列出雙模態超燃衝壓穩焰器的關鍵參數：穩焰器內靜壓、捲吸率、駐留時間與阻力。作者引 Winterfeld 的結果說明取捨本質：流動偏折越大的穩焰器交換率越快；而在形狀固定時，增加阻塞（即阻力）會使駐留時間下降、交換率上升——兩者無法同時最佳化。\n\n開放與封閉的分界（第 147 頁）：開放型凹槽中，分離角落形成的剪切層跨越整個凹槽長度並在後壁某處再接觸，阻力低但自主流捲吸的量也相對少；封閉型則剪切層無法跨越全長而再接觸於凹槽底面，阻力係數明顯較大。因此就超燃衝壓燃燒室而言，開放型因阻力代價較低而較受青睞。作者所採的分界為長深比約 10 至 12。除此之外還有一個聲學上的轉換：長深比小時以橫向模態為主，增大後轉為縱向模態，轉換當下形狀阻力係數會突然上升；縱向模態建立後，形狀阻力係數隨長深比略降，之後又因後壁再壓縮增強而急遽上升。\n\n設備與案例（第 147 頁）：美國空軍研究實驗室推進部門的超音速流設施，潔淨壓縮空氣可提供最高 922 K、5.27 MPa 的滯止條件，總流量約 15.4 kg/s；本實驗以一對馬赫 3 半噴嘴構成平面二維收縮擴張段，等截面測試段 131 乘 152 mm，側壁與頂壁裝熔融石英窗以供光學觀測。所有凹槽模型深度相同，為 8.9 mm。\n\n後斜板角度的作用（第 152 頁）：計算所得的駐留時間隨後斜板角度減小而一致下降。作者給出的機制是凹槽內回流結構：捲吸進入凹槽的質量大致正比於主流速度，因此只有單一大回流區的幾何（即後斜板角小者）比帶有大型內嵌次渦的幾何更容易交換質量——兩渦交界面兩側的速度都遠小於主流速度，故渦與渦之間的交換率低於凹槽與主流之間的交換率。換言之，次渦反而限制了淨質量交換率，可用來在維持小凹槽的同時延長駐留時間，但這種設計必須另外解決如何把合適的可燃混合物送進這些結構的問題。至於長度，加長凹槽並未顯著改變駐留時間，因為駐留時間主要取決於深度：加長雖使體積增加（延長駐留時間），質量交換率也同時增加（縮短駐留時間），兩者大致相抵。\n\n阻力的組成（第 152 頁）：以自由流動壓與凹槽前壁面積正規化的阻力係數顯示，波阻是主要成分，而摩擦力因凹槽內回流實際上產生推力。後壁角減小時阻力上升，原因是較高的壓力作用在後壁更大比例的面積上，這源自流動膨脹進入凹槽；在深度固定下增加長深比會使阻力略增，因為剪切層更深入凹槽而使更多後壁暴露於高壓；若長深比大到成為封閉型凹槽，阻力將大幅上升。\n\n非反應流結果能否外推到燃燒（第 152 頁）：這是本站追問要對照的段落。作者把駐留時間定義為凹槽流體因與主流質量交換而衰減的時間尺度，並以 CFD 標記凹槽內初始流體、在時間精確模式下追蹤其質量隨時間的衰減、再以指數式最小平方擬合求得。關鍵的但書是：Winterfeld 曾同時研究等溫流與燃燒流中的穩焰器，結果顯示燃燒時駐留時間增加、而穩焰器回流區與氧化劑流之間的交換率下降；若此趨勢在超燃衝壓穩焰器上同樣成立，則本文冷流推得的駐留時間會低於燃燒實況，質量交換率則被高估。作者並未因此否定冷流研究，而是主張冷流 CFD 的駐留時間仍可作為分析凹槽內化學動力學的簡化模型輸入——凹槽內高度黏滯的流動接近完全攪拌反應器的適用條件，該模型可快速評估凹槽尺寸是否足以在給定燃料、壓力與當量比範圍內維持燃燒。\n\n參數間的強耦合與作者自陳的限制（第 152 至 153 頁）：作者總結後壁角的兩面性——減小後壁角應可同時促成聲學上更穩定的凹槽流（進而穩定燃燒）與更好的捲吸，但也會降低凹槽壓力、增加阻力，並因剪切層再接觸而預期提高後壁熱傳率；因此凹槽穩焰器的性能參數與後壁角之間存在強烈的相互牽制。偏置比的改變帶來更劇烈的影響：分離波變得較強且屬膨脹性，前壁壓力遠低於偏置比為 1 的各構型，剪切層更深入凹槽；在這些情況下後斜板角的影響反而變小，角度自 90 度減到 16 度時上游面壓力並無明顯變化。作者自陳涉及駐留時間、以及程度較輕的阻力等議題，難以僅由稀疏的表面量測與流場可視化推斷；並列出後續工作：量測捲吸率、駐留時間、混合行為與速度場，量化聲壓位準以佐證後斜板角的穩定化效果，並把計算延伸到非穩態流場。",
    pages: "147, 152",

    note: "書目已依出版社排版版 PDF 的頁眉（JOURNAL OF PROPULSION AND POWER, Vol. 17, No. 1, January–February 2001）與頁尾 DOI 戳記核對。本筆可用來裁定 A-18 指出的矛盾：A-18 第 873 頁推測在約 45 度與 16 度之間存在使阻力最小的臨界後壁角，第 875 頁轉述本文卻說後壁角小於 90 度會增加阻力。本文摘要與結論兩處都明確寫著後斜板角減小會提高阻力係數並縮短駐留時間，故 A-18 第 875 頁的轉述與原文相符，第 873 頁則是 Ben-Yakar 與 Hanson 自己的推測。另注意兩篇對開放與封閉分界的取值不同：本文取長深比約 10 至 12，A-18 取小於 7 至 10 為開放、大於 10 至 13 為封閉。"

    question: "直連式（direct-connect）試驗量到的性能，有多少可以外推到真實飛行條件？",
    contribution: "在美國空軍研究實驗室的直連式超音速燃燒室中，驗證了一種把燃料噴注與穩焰整合在一起的構型：低角度貼壁噴注氣態乙烯，噴孔位於壁面凹槽上游，全流道不放置任何伸入主流的結構。以馬赫 1.8 與 2.2 兩具設施噴嘴，配合改變滯止溫度的離設計點操作，涵蓋動壓 47.9 kPa 下飛行馬赫 4 至 6 的燃燒室入口條件。當量比 0.25 至 0.75 之間，僅用一般火星塞、不靠任何外加點火助劑即完成點火並維持主流燃燒；量得推力增量 667 至 1779 N、燃燒室峰值壓比 3.1 至 4.0，且推力增量隨當量比近乎線性上升。燃燒引發的預燃震波列使燃燒室進入雙模態運轉，當量比越高震波列越強、起始位置越往上游移。以 RJPA 一維性能碼反推單一測試案例，得燃燒效率約 80%、平均摩擦係數 0.0028。就本站追問而言，作者自己把外推的限制講得很清楚：設施噴嘴數量有限，只能靠調整滯止溫度來涵蓋馬赫 4 至 6，代價是燃燒室入口馬赫數與速度（或靜溫）無法同時對上真實飛行值，必須取捨；而 80% 這個效率數字本身還帶著熱沉式燃燒室瞬態熱損與燃燒室基部壓力量測的未定誤差，作者列為待改進項目並打算另以蒸汽熱量計獨立驗證。",
    summary: "本摘要由本站自出版社排版版 PDF（AIAA，arc.aiaa.org）整理，頁碼為期刊印刷頁。\n\n設計動機（第 1305 頁）：碳氫燃料超燃衝壓引擎要解決的是燃料與空氣混合、穩焰、壓力損失與熱負荷四件事，而成功的噴注方案必須同時做到快速混合、總壓損失最小、又不損及穩焰能力與結構完整性——作者明言這些要求彼此有衝突。本文採用的凹槽式噴注器／穩焰器不放置任何伸入主流的裝置，因而同時避開了阻力與冷卻的代價。作者引低速研究指出，軸對稱凹槽的最佳穩焰性能出現在長深比取最小氣動阻力的那個值：更長會產生渦脫落而使火焰不穩，更短則捲吸的空氣不足以維持火焰。\n\n設施與模擬條件的取捨（第 1306 頁）：這是本站追問要對照的關鍵段落。試驗艙可連續供應 13.6 kg/s、5.17 MPa、最高 922 K 的空氣，空氣先經 JP-4 燃燒的加熱器（可達 2500 K）並補充氧氣，整條流道固定在推力台上以直接量測推力。馬赫 1.8 與 2.2 兩具設施噴嘴的設計點分別對應飛行馬赫約 3.5 與 4.5；但作者寫明，由於設施噴嘴數量有限，涵蓋飛行馬赫 4 至 6 是靠改變滯止溫度做離設計點試驗達成的，而這樣擴大飛行馬赫範圍，伴隨的是燃燒室入口馬赫數與速度（或靜溫）上的相應妥協。表 1 逐條列出各飛行馬赫數對應的燃燒室入口馬赫數、靜溫、靜壓與速度，可據以判斷哪些條件真正對上、哪些只是近似。\n\n流道與量測（第 1306 至 1307 頁）：加熱後的空氣自軸對稱 254 mm 內徑過渡為 57.2 乘 177.8 mm 的二維截面進入水冷噴嘴，其後接兩段可拆的水冷隔離段以容納預燃壓力上升，再接上壁可調的熱沉式燃燒室（本次出口對入口面積比約 2.5）。燃燒室三面牆共佈設超過 1000 個靜壓孔，本次啟用近 200 個。燃燒前的空載壓力分佈與等熵分析吻合良好，只在燃燒室與隔離段接縫、以及凹槽後斜板的再壓縮震波處有微弱擾動；各次試驗的空載量測幾乎完全一致，顯示硬體沒有明顯衰化。\n\n燃燒與震波列行為（第 1308 頁）：當量比約 0.28 時峰值壓比約 3.1，震波列起點恰在燃燒室入口上游，作者稱此為不需額外隔離段長度的操作極限。燃料流量增加後，隔離段與燃燒室壓力全面上升、震波系統逐步前移；當量比約 0.75 時峰值壓比略高於 3.6，相當於該入口條件下的正震波壓升，再加燃料就會把震波列推進設施噴嘴。\n\n火焰影像與擴展率（第 1309 頁）：側視影像顯示火焰前緣錨定在凹槽前緣，凹槽確實發揮穩焰作用；部分影像可見前緣不穩、偶有燃燒跑到凹槽上游，但細看錄影後確認那是側壁區的局部現象，不在核心流。量得的平均火焰擴展角為 24 至 30 度，遠大於低角度噴注的射流穿透所能解釋的範圍（預估僅約半個流道高度含有燃料），作者推論是燃燒區的阻塞把氣流往上壁面偏折所致。作者同時自陳，後續 OH-PLIF 量測顯示的擴展率比錄影影像慢，且雖然 PLIF 指出燃燒最可能沿側壁發生，凹槽底面靜壓卻沒有明顯的展向梯度；對燃燒過程與其機制的理解仍不完整，需要進一步研究。\n\n性能分析與其不確定性（第 1311 頁）：燃燒效率不是直接量到的，而是把燃燒室幾何、流量、溫度、壓力與熱通量輸入 RJPA 一維積分碼，以量測推力與出口靜壓在效率與摩擦係數的參數圖上反推，得 80% 與 0.0028。作者列出仍待處理的不確定性：熱沉式燃燒室的瞬態能量損失估計、以及燃燒室基部壓力量測；靈敏度分析顯示熱損估計變動 50% 只造成燃燒效率約 5% 的變化、對摩擦係數則無影響。作者並指出以蒸汽熱量計作第二個獨立的效率評估，兩者收斂才能對設施儀器與性能估計建立信心。使用蜂巢式 aerogrid 的測試另有基部壓力偏高而影響負載元讀值的疑慮，作者表明正在評估中。",

    question: "混合增強與火焰穩定，是否要求互相衝突的凹槽幾何？",
    contribution: "以平面雷射誘導螢光（噴注氣體摻一氧化氮做 NO-PLIF 看混合、以羥基自由基做 OH-PLIF 看反應區）研究馬赫 2 流場中凹槽穩焰器內外的混合與燃燒。凹槽幾何全程固定（深 16.5 mm、長 66 mm、後斜板 22.5 度），改變的是五個燃料噴注位置 F1 至 F5（自凹槽上游 25.4 mm、凹槽前後緣附近、到凹槽後斜板），並以設施背壓閥製造有無震波列兩種主流條件。核心結論是取捨落在供油位置而不是凹槽幾何：上游被動供油時，只有一小部分噴注物被捲吸進凹槽，而且捲吸量與射流穿透高度成反比——要混合就要穿透、要穩焰就要留在凹槽，同一個噴注參數無法兩者兼得。點火暫態的測試把這件事推到極端：以 F3、F4 供油時，凹槽一點燃、震波系統就前移到凹槽上游並立即熄火；唯一能在震波系統掃過時維持燃燒的是自後斜板噴注的 F5，它使凹槽內燃料分佈最均勻、可持續燃燒的流量範圍最寬。另一個違反直覺的結果是震波列本身有利：它使剪切層抬升分離，等效增大凹槽容積與空氣捲吸，並增強凹槽內混合，反而讓燃燒區更飽滿均勻。作者也指出凹槽內流場是三維的：前緣與側壁的轉角次流造成局部不均勻，且供油率過高時凹槽上游會形成富油瓣狀結構而抑制剪切層火焰。",
    summary: "本摘要由本站自出版社排版版 PDF（AIAA，arc.aiaa.org）整理，頁碼為期刊印刷頁。\n\n問題設定（第 769 頁）：碳氫燃料超燃衝壓引擎的化學反應速率慢、燃燒室駐留時間又極短，因此需要穩健的穩焰方案。凹槽的吸引力在於它捲吸主流的氧化劑、若夠深則提供相對長的駐留時間，且因回復因子高，凹槽內混合物的總溫接近自由流總溫。作者強調另一個常被忽略的設計要求：雙模態燃燒室在點火前後與加速過程中，流場性質會整個改變——點火前主要是超音速流，點火後出現強預燃震波列而形成超音速與次音速並存的扭曲流場，加速到更高馬赫數後震波列又減弱。穩焰器必須在這些變化中都不失效。\n\n既有的被動供油量測（第 769 至 770 頁）：先前以自發拉曼散射量得的當量比分佈顯示，噴注壓力越高燃料羽流穿透越高；低背壓（純超音速）時近噴孔處可見反向旋轉的流向渦對，背壓升高後震波列造成邊界層分離、羽流形態劇變並被抬離壁面，因而可能改變燃料與空氣進入凹槽的捲吸、影響穩焰器的穩定性。這個結果正是本文轉向直接對凹槽供油的動機。\n\n設備（第 771 頁）：連續潔淨壓縮空氣可達 922 K、2.8 MPa，總流量最高 13.6 kg/s，排氣段的背壓控制閥可遙控調整測試段背壓。二維收縮擴張馬赫 2 噴嘴出口 50.8 乘 152.4 mm，接等截面隔離段（177.8 mm）後為 2.5 度、740 mm 長的擴張斜板，凹槽即齊平安裝於該擴張段。\n\n被動供油：穿透與捲吸的反比關係（第 773 頁）：這是本站追問要對照的核心句。F1、F2 的瞬時 NO 影像顯示射流結構逐張劇烈變動；羽流穿透高度隨噴注壓力增加，但只在最初 76.2 mm 內增加。凹槽區（x = 76.2）射流之間出現低 NO 濃度區，是被剪切層捲入後再循環的流體。作者在此明言：只有一小部分噴注物被捲吸進凹槽，而且這個捲吸量與射流穿透成反比。背壓升高後，震波與邊界層、震波與射流的交互作用大幅強化混合，射流合併所需的軸向長度也顯著縮短。\n\n直接供油三種方案的比較（第 773 至 774 頁）：F3（凹槽上游）的射流維持在剪切層之上，只有少量 NO 被稀釋後帶進凹槽，背壓升高使射流穿透更高、供入凹槽的量反而更少；即使降低噴注壓力，燃料進入凹槽仍主要依賴穿過剪切層的擴散與剪切層跟後斜板的互動。F4 改善了凹槽供油，但仍受剪切層與後斜板互動支配，且凹槽前緣與側壁轉角的次流造成分佈不均。F5（自 22.5 度後斜板、凹槽底面上方 5.1 mm 平行底面噴出）使凹槽內混合物幾乎均勻，剪切層區的擾動也降低，只在前緣轉角仍有輕微不均。作者自陳一項量測限制：NO 不被消耗，凹槽內未及時排出的 NO 會被下一個雷射脈衝重複成像，可能使混合均勻度被高估。\n\n燃燒操作範圍與點火暫態（第 775 至 776 頁）：馬赫 2、總溫 589 K、總壓 206.8 至 551.6 kPa。F3 在所有測試條件下都無法維持凹槽燃燒；F4 只在高總壓下可維持，質譜取樣顯示燃料經剪切層溢出，反映固定容積凹槽在空氣捲吸大致固定下的燃料消耗上限；F5 的可持續燃燒範圍最寬（上限受流量計而非物理限制）。點火暫態測試把震波系統預先擺在凹槽下游，一旦放熱就會把震波列推到凹槽前方：F3 與 F4 都是點燃即熄，只有 F5 能在震波位置振盪中維持燃燒——與混合研究的結論一致，因為 F5 把凹槽供油對震波系統與剪切層的依賴降到最低。\n\n供油率與震波列對燃燒區的影響（第 776 至 777 頁）：OH-PLIF 顯示以 F5 供油時，靠近後斜板處燃燒最強烈，與硬體上的燒蝕痕跡一致。供油率自 40 增至 60、90 SLPM 時，凹槽上游端出現富油瓣狀結構（作者推測展向中心線兩側各一），這個低溫富油區會抑制剪切層火焰被點燃，使燃燒區越來越不均勻。有震波列時情況相反：燃燒區反而更飽滿、更均勻，因為剪切層被抬升等效增大凹槽容積、捲入更多空氣，降低了凹槽內的整體油氣比，同時震波列本身也增強凹槽內混合。\n\n作者自陳的結論（第 777 至 778 頁）：被動捲吸不如直接對凹槽噴注，無論就燃料分佈均勻度或點火暫態的火焰維持而言；後斜板噴注在均勻度、可操作流量範圍與對流場變化的不敏感三方面都佔優；供油率調到適當值時凹槽容積利用率最高、火焰振盪最小，偏離該值則振盪增大且出現大空間梯度。",

    note: "書目依出版社排版版 PDF 核對：頁首印 JOURNAL OF PROPULSION AND POWER, Vol. 20, No. 5, September–October 2004，印刷頁 769–778，AIAA 下載戳記 DOI: 10.2514/1.5360，與本欄原值一致；四位作者姓名與所屬機構亦相符。追問句待裁定：本筆原問的是凹槽幾何，但本文的凹槽幾何自始至終固定（深 16.5 mm、長 66 mm、後斜板 22.5 度），真正被掃描的是燃料噴注位置。原文確實給出了追問想問的那個衝突，只是它落在供油策略上（第 773 頁：捲吸量與射流穿透成反比），不是幾何上。建議兩條路擇一：把追問改成混合增強與火焰穩定是否要求互相衝突的供油策略，或維持幾何版追問而改由 A-19（後壁角與長深比的參數掃描）與 A-23（第 2730 頁明言最佳幾何與尺度尚無共識）承接。本站未自行更動，等使用者裁定。"

    id: "A-22", track: "A", year: 2009, method: "實驗", topic: "超燃衝壓穩焰",
    title: "Combustion characteristics of a dual-mode scramjet combustor with cavity flameholder",

    question: "雙模態燃燒室的兩個穩焰位置之間，由哪一個參數決定切換？",
    contribution: "在密西根大學的實驗室級雙模態衝壓／超燃衝壓燃燒室（隔離段入口馬赫 2.2）中，以 4000 Hz 高速火焰自發光影像配合隔離段與燃燒室壁面靜壓，量測氫氣與氫／乙烯五五混合燃料的燃燒穩定位置。核心結果是：主燃料噴孔離凹槽夠遠時，衝壓模態下存在兩個截然不同的穩焰位置——低滯止溫度時火焰錨定在凹槽前緣、由凹槽剪切層的放熱固定住（凹槽模態），高滯止溫度時則錨定在燃料射流尾流中、位於噴孔下游約 20 至 30 mm（射流尾流模態）；中間溫度區反應區在兩者之間來回跳動。直接回答本站追問：決定切換的主導參數是空氣滯止溫度 T0，不是當量比、也不是凹槽供油率。作者以五次試車、共 22500 張影像做統計，得 T0 高於約 1350 K 幾乎全在射流尾流模態、低於約 1150 K 幾乎全在凹槽模態，並給出以 1250 K 為中心、75 K 為特徵寬度的誤差函數擬合式；換成氫／乙烯混合燃料時同一條曲線整體右移約 120 K。作者主張兩種模態都是火焰而非自燃：跳動只發生在兩個離散的穩定位置之間，若是自燃，反應區被擾動往下游推時應更容易點燃而不會侷限在小範圍。壓力穩定度依序為凹槽模態最穩、射流尾流次之、來回跳動最不穩；把主噴孔移近凹槽使兩個穩焰位置重疊可得混合模態，能壓下振盪但需要凹槽供油配合。超燃模態下只觀察到凹槽穩焰一種。",
    summary: "本摘要由本站自出版社排版版 PDF（Elsevier，ScienceDirect）整理，頁碼為期刊印刷頁。\n\n工程動機（第 2397 至 2398 頁）：雙模態超燃衝壓引擎靜止時不產生推力，必須先加速到飛行馬赫 3 至 4 才點火，此時以熱壅塞的衝壓模態運轉，隔離段內的預燃震波列把流速降到次音速再燃燒，燃燒室擴張段的熱喉道再把排氣加速回超音速；加速到馬赫 6 至 7 後震波列減弱、隔離段出口轉為超音速而進入超燃模態。作者指出穩焰機制會隨飛行馬赫數而改變：中等馬赫數時來流溫度不足以穩定自燃，必須以火焰形式穩定；極高馬赫數時自燃延遲可忽略，穩焰問題退化為混合問題；中間則兩者都重要。本文刻意選在自燃不佔主導的條件下研究。\n\n設備與條件（第 2398 頁）：二維馬赫 2.2 噴嘴接 25.4 乘 38.1 mm 的等截面隔離段，延伸 402 mm 至矩形凹槽前緣；凹槽長 50.8 mm、深 12.7 mm、橫跨全寬，其後為 349 mm、4 度的擴張段。主燃料以音速自單一噴孔噴入，位置在凹槽前緣上游 44.5 mm 或 14.0 mm 兩者擇一。引燃燃料另由凹槽底面或後壁的三個展向噴孔直接噴入。以電加熱器加上氫燃燒的加熱器達成 1040 至 1490 K 的空氣滯止溫度（對應飛行馬赫 4.3 至 5.4），並補氧維持氧莫耳分率 0.21。燃燒室未冷卻，單次運轉控制在 10 秒內。\n\n兩個穩焰位置（第 2399 至 2400 頁）：凹槽模態的反應區錨定在凹槽前緣，並以大致固定的角度（26 至 30 度，溫度越高角度越大）擴入主流；作者認為固定的擴展角意味著反應以預混火焰進行——火焰錨定在凹槽剪切層的低速區，擴展角讓局部火焰速度與垂直流速相匹配，且該區為無震波的次音速流，若自燃佔主導不會出現固定擴展角。射流尾流模態的反應區前緣呈曲線，位於噴孔下游 20 至 30 mm（溫度越高距離越短）；自測試段上方拍攝的影像確認燃燒確實發生在射流尾流中，而非如先前研究所見沿側壁分離邊界層發生。\n\n切換由 T0 主導（第 2400 頁）：這是本站追問的直接答案所在。作者定義反應區前緣的等發光度輪廓，以 x/H = 0.6 為兩模態的分界，統計每次試車中反應區停留在各模態的時間比例，結果三組不同當量比與凹槽供油率的資料落在同一條曲線上——T0 是決定穩焰模態的主導變數。高於約 1350 K 幾乎恆在射流尾流模態，低於約 1150 K 幾乎恆在凹槽模態，中間為振盪區。\n\n跳動的機制與時間尺度（第 2401 至 2402 頁）：1150 至 1350 K 之間反應區在兩位置間跳動，頻率 5 至 20 Hz 且無固定主頻，快速傅立葉轉換在熱聲或週期性渦脫落預期的數百至數千赫範圍內找不到主頻，因此作者判定這是與熱聲、流體力學不穩定性都不同的一類不穩定。同步的高頻壁壓訊號顯示反應區移動領先壓力變化約 8 ms，故是反應區移動造成壓力波動而非反過來。作者的解釋是：凹槽供油不影響穩焰位置（各條件下都有足夠主燃料被捲入凹槽），火焰通常無法穿越兩位置之間那段平均速度較高、局部當量比較不利的中間區；T0 升高使火焰速度上升，把火焰推前所需的擾動變小、把它推回所需的擾動變大，於是停留在射流尾流的時間比例逐漸增加。\n\n壓力穩定度的排序（第 2402 頁）：以壁面壓力的標準差衡量，凹槽模態最穩，因為火焰基部位於凹槽剪切層上游的低速區，而該處被凹槽幾何固定住；射流尾流模態的火焰基部必須落在射流尾流中速度與當量比合適之處，尾流本身遠不如固定幾何的凹槽回流穩定；兩模態來回跳動時放熱位置大幅移動，壓力最不穩。\n\n混合穩焰模態與超燃模態（第 2402 至 2404 頁）：把主噴孔移到凹槽前緣上游 14.0 mm，使兩個穩焰位置在空間上重疊，可消除大幅度的放熱區移動。此時若不對凹槽供油，燃燒呈射流尾流模態、壓力波動與純射流尾流模態相當；補上凹槽供油後反應區延伸進凹槽上游的低速穩定區，形成比純射流尾流穩、但不如純凹槽穩的混合模態，其中凹槽底面供油的剪切層反應明顯較強、流場也稍穩。作者指出此時找不到純凹槽模態，因為噴孔距凹槽前緣太近、來不及預混。超燃模態靠降低當量比達成，但只觀察到凹槽穩焰一種，作者推測是超音速隔離段出口對應的較高速度與較低靜溫使射流尾流位置不適合穩焰；且在衝壓與超燃轉換時，隔離段出口馬赫數必須階躍變化，因而伴隨大幅壓力波動的強不穩定。作者並提醒：本實驗改變 T0 等同於實機加速通過一段馬赫數範圍，因此幾何相近的引擎很可能遇上同一種不穩定，而能否靠重疊兩個穩焰位置來壓抑，取決於當量比、燃料種類與詳細幾何。",

    contribution: "綜整 Ben-Yakar 與 Hanson 之後約十年間凹槽穩焰的進展，涵蓋穩焰模態與機制、火焰穩定極限的關聯式、燃燒振盪，以及凹槽與噴注耦合、最佳幾何與尺度、自燃與火焰傳播的交互作用、非穩態效應等未解問題。就本站追問而言，本文最有價值之處正是它把哪些結論站得住、哪些還在互相打架分得很清楚。作者整理出的分歧包括：Ben-Yakar 與 Yu 等人主張斜壁、穩定的凹槽較適合穩焰，Rasmussen 等人卻因放熱可抑制壓力振盪而改採矩形凹槽，Wang 等人更認為適度振盪有利於強化混合與燃燒，只要不劇烈到吹熄；Yang 等人發現凹槽本身會妨礙進氣道啟動、短凹槽較易啟動，Wang 等人卻指出短凹槽在某些條件下根本穩不住火焰——作者因此明言最佳幾何與尺度至今尚無共識。至於哪些較穩固：Rasmussen 等人的貧油吹熄極限同時依賴空氣質流率、凹槽幾何、供油方案、馬赫數與燃料種類，且貧富油極限都強烈受噴孔位置左右，據此作者判定把直接供油的凹槽當成完全攪拌反應器來模擬並不恰當；Donohue 的量測則顯示吹熄溫度對噴孔位置與燃料流量最敏感、對入口馬赫數與操作壓力反而出乎意料地不敏感。作者另引 Tatman 等人的結果指出水蒸氣汙染對穩定極限影響可忽略，因此在燃燒室壓力固定的前提下，評估直接供油凹槽的穩焰極限時可不必補償加熱器汙染效應——這是少數直接支持地面數據可外推的證據。",
    summary: "本摘要由本站自出版社排版版 PDF（SAGE，pig.sagepub.com）整理，頁碼為期刊印刷頁。\n\n定位（第 2718 頁）：作者指出飛行馬赫數高的一端因點火延遲可忽略，混合良好的燃料其穩焰不是嚴重問題；真正棘手的是馬赫 4 至 8 這一段，滯止溫度相對低而點火延遲長，必須有穩健的穩焰方案。凹槽的基本構想是在超音速流中製造低速回流區，靠回流內的部分次音速燃燒穩住火焰，再以此為點火源引燃核心流。\n\n穩焰模態（第 2719 至 2721 頁）：作者把燃燒模態分成兩類，一是依反應強度或流態分的整體模態（非點火、弱燃燒、超音速燃燒、雙模態），二是依火焰錨定位置分的局部穩焰模態。凹槽相關的局部模態包括剪切層穩定與回流區穩定兩種，以及本站 A-22 所報告的凹槽穩定與射流尾流穩定。作者特別點出一個尺度上的難題：超燃衝壓條件下火焰速度約 10 m/s，燃燒室速度卻約 1000 m/s，傳統意義上靠擴散預熱與產物播種的穩焰在此幾乎不可能，實驗與計算指出燃燒區自凹槽向主流的擴展不只靠擴散，還受射流與凹槽剪切層的渦交互作用支配。\n\n穩定極限：哪些是設施相依的（第 2723 至 2724 頁）：這是本站追問的核心段落之一。Rasmussen 等人的貧油吹熄極限同時依賴空氣質流率、凹槽幾何、供油方案、馬赫數與燃料種類；凹槽後斜板噴注在貧油端表現較佳，凹槽底面噴注則在富油端較穩，因為過量燃料容易被剪切層帶走而未反應即逸入自由流。貧富油極限都強烈取決於噴孔位置，這直接推翻把直接供油凹槽視為完全攪拌反應器的模型假設。Donohue 的量測方向相反地令人安心：吹熄溫度對噴孔位置與燃料流量最敏感，對入口馬赫數與操作壓力則出乎意料地不敏感。Retaureau 與 Menon 發現穩定域隨超音速來流的溫度或壓力上升而擴大，顯示吹熄條件部分受主流狀態支配，但短凹槽幾乎看不到預熱效果。Tatman 等人的汙染效應研究則發現水蒸氣汙染對穩定極限影響可忽略，作者據此推論在燃燒室壓力固定下，評估直接供油凹槽的穩焰極限時不必補償汙染效應。\n\n關聯式的普適性（第 2725 至 2726 頁）：火焰穩定理論中最重要的無因次參數是 Damköhler 數，即特徵流動時間與特徵化學時間之比。Zukoski 與 Marble 對預混火焰提出吹熄發生在剪切層駐留時間等於點火延遲之時，Ozawa 據煤油吹熄資料給出預混關聯式。但 Thakur 與 Segal 指出超音速穩焰取決於回流區的局部條件與其進出的質量傳輸，而回流區內成分與溫度梯度都很大，預混關聯式難以直接用於非預混情形；Driscoll 與 Rasmussen 因而自非預混觀點另建修正 Damköhler 數關聯式，避開完全攪拌反應器假設。作者提醒該關聯式只給出一般性估計，仍需納入非穩態、剪切層捲吸與噴注過程的細節；更關鍵的是，這些分析幾乎全針對燃料直接噴入凹槽的情形，被動供油因射流與凹槽的強交互作用而複雜得多，其穩定極限同樣重要卻少有人做。\n\n燃燒振盪的五類機制（第 2726 至 2727 頁）：作者先破除一個常見誤解——超音速流中聲波無法上溯所以不會形成回饋迴路——指出邊界層與回流區等次音速區域仍可讓聲波上溯。其後分為五類：低頻熱聲不穩定（液態 JP-7 約 100 至 160 Hz、氣態乙烯約 300 至 350 Hz，機制為震波與火焰區或噴注與火焰區的回饋，作者判斷基本上只發生在衝壓模態）；燃燒模態間的低頻振盪（即 A-22 的凹槽與射流尾流跳動，頻譜中無尖峰）；與凹槽自持振盪相關的高頻振盪（機制之一為火焰自剪切層向主流的非穩態擴展，需要聲學與渦的共振）；自燃過程引起的高頻振盪（可燃流體團的初始條件與路徑各異，使燃燒區不連續且在主流中擺動）；以及來自其他流動或火焰非穩態的振盪。作者結論是這些機制多半源自流動的本質不穩定性，既不可免、又可能是快速混合與穩焰所必需，因此振盪幾乎無法完全消除，只能設法適當控制。\n\n最佳幾何尚無共識（第 2730 頁）：這是本站追問的另一個核心段落，作者在此逐條列出彼此衝突的主張（斜壁穩定凹槽 vs 矩形凹槽、適度振盪有害 vs 有益、短凹槽利於進氣道啟動 vs 短凹槽穩不住火焰），並直接寫下最佳幾何與尺度至今未有共識。作者另指出凹槽深度相對於流道高度的最佳比例應該重要卻少人研究，而深度常受燃燒室尺寸限制，淺凹槽駐留時間不足，折衷之道可能是採用多個淺凹槽。\n\n自燃與非穩態（第 2730 頁）：凹槽雖被稱為穩焰器（暗示以火焰模式燃燒），但高總焓來流可能引發顯著自燃，且近期研究顯示即使在飛行馬赫 4 至 6 這種相對低的條件下自燃也有明顯影響；作者主張理論分析與數值模擬都必須同時納入自燃與火焰傳播，並看好機率密度函數模型與火焰面方法的結合。     contribution: "建立高速圓錐繞流的完整解法並實際算出數值解。作法是先假設壓力、密度、速度都只是極角 θ 的函數（等價於各物理量在同軸圓錐面上為常數），這個假設同時迫使激波後的流場必須無旋，於是三維錐流被化約成單一常微分方程；再以步長 0.5 至 3 度的逐步數值積分求解，並與 Meyer 的斜激波關係式聯立，定出能同時滿足流場解與激波條件的激波角。作者對半頂角 10、20、30 度三種圓錐完成計算，錐面壓力與高速風洞量測吻合良好，而 60 度錐（半頂角 30 度）的激波角也與彈丸飛行照片一致。就本站追問而言，代價寫在第 297 頁的第 6 節：此錐形解只在 U/a 高於臨界值時存在（60 度錐為 1.46、40 度錐為 1.18、20 度錐為 1.035），低於臨界速度錐形流態根本不成立，激波脫體的情形整個落在解的適用範圍之外——而彈丸照片正好顯示速度低於 1.46a 時激波確實脫離錐尖。臨界速度以上數學上另有兩支解，作者判斷高壓那一支在簡單錐頭圓柱體前方的實驗條件下不太可能實現。作者亦與 von Kármán 與 Moore 的細長體近似解比對：20 度錐吻合良好，40 度錐已有可觀偏離，60 度錐偏離更大。",
    summary: "本摘要由本站自出版社排版版 PDF（Royal Society，royalsocietypublishing.org）整理，頁碼為期刊印刷頁。\n\n問題設定與既有解為何不能沿用（第 278 至 279 頁）：物體以超過音速的均勻速度前進時會產生相對物體靜止的激波，激波前後的關係式最早由 Rankine 得到，後由 Hugoniot 重新發現，Meyer 據以求出楔形體附近的流場——把兩道相交的斜激波組合起來，兩側偏折的氣流可用一個實心楔形包住，激波後壓力是均勻的。但作者指出換成圓錐就不行：氣流斜穿過錐形激波後無法維持最初被偏折的方向，因此激波後的壓力不可能像楔形那樣均勻。取而代之的是另一類解——壓力、速度與密度在通過同一頂點的同軸圓錐面上為常數的無旋解。若某道錐形激波能把平行於錐軸的均勻來流轉換成滿足該無旋解的狀態，兩者接起來就構成完整解。作者指出 Busemann 曾提出取得這類解的圖解法，但那則短文沒有給出細節或結果，無從比對。\n\n化約的假設與其代價（第 281 至 283 頁）：這是本站追問要對照的第一處。作者明白寫出所求的解是各變數僅為 θ 的函數，並緊接著寫下這種情形下流場必須是無旋的——換言之，無旋不是額外加上的簡化，而是 θ 單變數假設的必然結果。把無旋條件、連續方程與絕熱的 Bernoulli 方程合併，得到只含 u 與 θ 的常微分方程（式 8），給定任一組初始值即可決定整個流場；壓力則由 Bernoulli 關係（式 9）回推。作者坦言不指望式 8 有有限形式的解，但它的形式適合數值計算。\n\n數值積分（第 283 至 286 頁）：自錐面 θ = θs 出發，該處切向速度為零而 du/dθ 的初值可求得，再逐步推進。精度取決於步長：多數情況 3 度已足夠，有些情況必須小到 0.5 度；驗證方式是把步長減半重算，若結果在所需精度內不變即可接受。作者以 60 度錐、us/c = 0.35 的案例完整列出計算表（表 I），自 θ = 30 度推進到 69 度。\n\n併入激波條件（第 288 至 291 頁）：Meyer 的斜激波方程給出激波前後的角度與壓力密度比關係，但要判定激波能否把均勻來流轉成所求的錐流，還需要壓力條件相符。作者的作法是對逐步計算中的每個 θ 值求出對應的激波參數，把逐步計算得到的壓力比與激波關係給出的壓力比同時畫在同一張圖上，兩條曲線相交處即為可存在的激波角。作者並指出 Meyer 原本的圖表在內插上相當困難，因而另繪兩套以激波前後角度為直角坐標的曲線。\n\n速度場的次音速與超音速分區（第 295 頁）：作者注意到有些解在激波後全域低於局部音速，有些全域高於，還有些是激波後超音速、往錐面遞減而在中途跨過音速線。由於最小速度出現在錐面，只要 us/c 大於 0.41 全域即為超音速；對 60 度錐這對應 U/a = 1.66，也就是說只有 U/a 超過 1.66 時，錐面上的粗糙才可能激起駐定的小波。\n\n適用界限（第 297 頁）：這是本站追問要對照的第二處，也是全篇 Part I 的收尾。作者指出錐面壓力係數隨 U/a 下降而上升，到某個臨界值達到可能的最小值，低於該臨界速度錐形流態就不存在；三種錐的臨界值分別是 1.46、1.18 與 1.035。臨界速度以上，數學上有上下兩支解，作者認為高壓的那一支在簡單錐頭圓柱體前方不太可能於實驗中實現。至於低於臨界速度時錐尖附近會是什麼流態，作者說留待稍後配合彈丸照片討論——該討論位於 Part II，不在本篇之內。",

    contribution: "1933 年那篇的第二部分，專責把 Part I 算出的錐流解拿去對實驗。開篇即點明計算對象只是無限長錐附近的流場，但推測有限長錐或錐頭彈丸鼻部附近的流場可與之比擬。兩組實驗分別在國家物理實驗室的 3 吋高速風洞量測 20、40、60 度錐的表面壓力（每錐三個測壓孔），以及由伍利奇研究部門拍攝 60 度錐頭彈丸的飛行陰影照。陰影照的比對極為成功：把彈丸的真實幾何輪廓疊回照片後，U/a = 2.11 時量得的激波半頂角 47.25 度對上計算的 46.6 度（差 0.65 度），1.52a 時 62.0 對 61.2，1.46a 時 64.7 對 66.0；而激波脫體發生在 1.44a 與 1.42a 之間，與理論臨界值 1.46a 相符。壓力量測則沒那麼乾淨，本篇最誠實的一句話正是本站追問的答案：在唯一落入 1.46 至 1.66 這個關鍵區間的 60 度錐測點上，兩次本應相同的量測（U/a = 1.56 得 0.394、1.55 得 0.456）彼此的差距，比計算值 0.378 與兩者中較低者的差距還要大兩倍以上，作者因此直言此事無法用這些量測來檢驗。換言之，該處的殘差被量測散布淹沒，而不是理論失準。另有一處系統性偏離（U = 1.74a 時 B 孔壓力顯著低於計算值），作者歸因於此速度接近 1.66a——錐面速度等於當地音速之處，該狀態下邊界層的微小擾動會放大成大幅壓力變化，屬於理論本來就不含的物理。本篇還把完整解與 von Kármán 和 Moore 的細長體近似逐項比對，指出後者只在 20 度錐、U/a 約 1.05 至 2.5 的範圍內堪用，40 度錐最小誤差已約 25%，60 度錐更差。",
    summary: "本摘要由本站自出版社排版版 PDF（Royal Society，royalsocietypublishing.org）整理，頁碼為期刊印刷頁。\n\n為什麼要做這兩組實驗（第 298 頁）：作者開宗明義寫下這篇的前提——計算只涉及無限長錐附近的流場，但可以期待有限長錐或錐頭彈丸鼻部附近的流場與之比擬。於是安排了兩種量測：國家物理實驗室量錐體表面壓力，伍利奇研究部門拍彈丸飛行照片。\n\n壓力量測的作法與其固有困難（第 298 至 299 頁）：風洞是史丹頓爵士設計的 3 吋高速風洞。錐模型很小，為了讓測壓孔盡量小，九個黃銅錐每個都做成兩截，在需要測壓的截面上先刻出細劃痕再組合，劃痕即成三角形的測壓孔，最大尺寸僅 0.0047 吋；組裝後表面磨平，在 50 倍投影下看不出不連續。20 與 40 度錐的頂角無誤，三個 60 度錐則都大了三分之一度。第一輪測試結果顯得雜亂，因此另做一個單件式、鑽有 0.012 至 0.014 吋圓孔的 60 度錐重測。壓力以水銀柱對大氣壓平衡量測，並假設放入錐體後風洞靜壓與淨空時相同。\n\n壓力分佈與異常（第 300 至 302 頁）：錐流理論預測錐面壓力均勻，實測則接近均勻但不完全均勻。60 度錐在低於 1.8a 時，本應幾乎相同的讀值之間出現可見的變動，但作者認為尚不足以掩蓋整體趨勢。在低於臨界速度的 1.22a 與 1.35a 兩例中，壓力隨離頂點距離明顯下降——正是錐形流態不成立的表徵。唯一的系統性異常在 U = 1.74a：B 孔壓力顯著低於計算值，A 與 C 孔卻很接近。作者指出 1.74a 很靠近 1.66a，即錐面速度等於當地音速的速度；以音速流動的氣流中，微小擾動（例如邊界層產生的）能造成很大的壓力變化，因此這個異常應歸於理論未涵蓋的物理，而非計算失準。\n\n彈道陰影照的比對方法（第 302 至 303 頁）：理論預測 60 度錐頭在低於 1.46a 時激波必然脫體。難處在於鼻部附近壓縮空氣的折射會使照片中彈頭位置失真，而失真最嚴重處恰好就在鼻端。作者的解法是：發射前以行動顯微鏡量測彈丸並繪出等比例外形，再利用折射較弱處的特徵（錐頭與平行段之間的淺溝，以及彈身上的壓痕環）把外形套準到陰影照上，從而定出鼻尖的真實幾何位置。激波位置則本來就清晰——恰好擦過激波的光線會大幅偏折，故陰影前緣即激波真位置。\n\n七張陰影照的結果（第 303 至 305 頁）：U/a 自 2.11 降到 1.26 共七張。2.11a 時激波自軸線起約 1.5 倍彈徑內為直線、與鼻尖接觸，量得半頂角 47.25 度，而 Part I 圖 13 內插得 46.6 度，差 0.65 度；作者並指出若當初以實際彈丸的 30.3 度半頂角計算（而非 30 度），吻合會更好。1.52a 量得 62.0 度對計算 61.2 度，1.46a 量得 64.7 度對 66.0 度。1.44a 時激波仍通過鼻尖但已不再尖銳，1.42a 時明確脫體，1.35a 與 1.26a 則越離越遠。作者的歸納是：U/a 大於 1.46 時激波尖銳並附著，小於 1.42 時無尖點且行於彈前，與理論一致。至於為何只有 2.11a 那張的激波在相當距離內真正呈錐形，作者解釋得很漂亮：只有 U/a 大於 1.66 時激波與錐面之間全域超音速，肩部由錐頭轉為平行段的擾動才無法上溯進入該區；1.46 至 1.66 之間該區有一部分是次音速，肩部的有限尺寸擾動便能滲入，使激波截面呈現彎曲。\n\n殘差歸屬（第 306 頁）：這是本站追問的直接答案。承上一段的推論，若 U/a 大於 1.66，三個測壓孔都應與計算相符；落在 1.46 至 1.66 之間時，壓力則應沿錐面變化而只在近鼻端達到計算值。60 度錐落在此區間的量測只有 U = 1.55a 一個：計算的壓力係數為 0.378，而 A 孔實測在 U/a = 1.56 得 0.394、在 1.55 得 0.456。作者明白寫下——兩個本應幾乎相同的量測之間的差距，比計算值與兩者中較低者的差距還大兩倍以上，因此這件事無法用這些量測來檢驗。這是一個把量測不確定度誠實擺在理論驗證之前的判斷。\n\n錐與楔的臨界速度（第 306 至 307 頁）：作者利用 Part I 圖 7 定出楔形體激波脫離前緣的臨界速度，列成表 IV 並與錐的三個臨界點（10 度對 1.035、20 度對 1.18、30 度對 1.46）畫在同一張圖上。結論是速度自高處下降時，激波離開楔緣的時機遠早於離開同頂角錐體的頂點。\n\n與 von Kármán 和 Moore 近似解的比對（第 307 至 310 頁）：作者先點出兩者的本質差異——近似理論預設無激波的無旋運動，但由完整解可知只要錐形流態存在就必然有激波。作者定義 F 為激波處的壓力變化佔自由流到錐面總壓力變化的比例，作為近似是否適用的判準。對 10 度半頂角，F 在 U/a 由 1.07 到 1.39 之間小於六分之一，之後迅速上升，到 1.81a 已有四分之一的壓力變化發生在激波上；就壓力分佈而言近似解僅在 1.07 至 1.39 這段可稱良好。若改以錐面壓力為比較基準，20 度錐在 1.05a 至 2.5a 之間吻合很好，40 度錐最小誤差已約 25%，60 度錐更差。文末另有 1932 年 12 月 18 日補記：作者把圖 4 寄給 von Kármán 後，後者重新檢視自己的理論，發現二階項的處理並不一致（部分保留、部分略去）；只保留一階項時吻合大幅改善。作者由此判斷，一階近似在一階與二階近似不相接近的範圍外並不具數學上的正當性，但既然一階近似與完整解在頗大範圍內吻合良好，用於非錐形物體或許仍有實務價值。\n\n作者自陳的摘要（第 310 至 311 頁）：發展出計算錐頭彈丸附近氣流與壓力的方法，對 20、40、60 度頂角完成計算；激波在速度高於 1.035a、1.18a、1.46a 時附著於彈尖，低於此則脫體前行，該結論已由 60 度錐的飛行照片準確驗證；計算壓力與高速風洞量測吻合良好；與 von Kármán 和 Moore 近似的比對則顯示後者只在 20 度錐的有限速度範圍內成立，不適用於更大頂角的錐。",

    note: "書目依出版社排版版 PDF 核對：印刷頁 298 連續至 311（末頁與 Hartree 及 Black 的下一篇論文共頁），下載戳記 article-pdf/139/838/298/27690/rspa.1933.0018.pdf，卷 139、期 838、起始頁 298 與 DOI 三者一致。相關參照：本站 B-01 原先把作者僅針對無限長錐計算、但推測可比擬有限錐或彈丸鼻部一句記在 Part I，實際出處是本篇第 298 頁開頭，該筆已更正。另注意本篇引用的三個臨界速度（1.035a、1.18a、1.46a）後來被 B-03 修正為略為偏低，見該筆。"

  {
    id: "B-03", track: "B", year: 1937, method: "理論", topic: "奠基理論",
    title: "The conical shock wave formed by a cone moving at a high speed",

    doi: "10.1098/rspa.1937.0083",
    question: "震波角的弱解與強解之中，真實流場選擇哪一支？判準是什麼？",
    contribution: "Maccoll 獨力延續 1933 年的工作，分兩部分。第一部分把驗證的標的自小口徑子彈換成兩磅砲彈（直徑 1.57 吋）的飛行照片，涵蓋頂角 20、40、60 度、速度 1100 至 2000 ft/s。照片品質使激波角可精確量測，而比對後發現在較低馬赫數處存在小而系統性的偏差；作者據此回頭以更精細的方法重解控制方程，證實是 1933 年的計算本身略有誤差，並對三個錐各重算兩點。修正後與實測吻合極好，且原先給出的三個臨界 U/a（20 度頂角為 1.035 等）被判定略為偏低——新照片在 U/a = 1.040 就拍到激波正要離開錐尖。第二部分把計算延伸到大頂角錐（半頂角 40、45、50、55 度），並改用級數解取代逐步積分：自錐面邊界條件反覆微分控制方程，得到錐面各階導數的封閉表達式，再代入泰勒級數；作者檢查收斂性後指出級數在偏離錐面 20 度以內大致收斂，實務上取到五次項並把該項乘以 0.5 以補償被略去的高階項，與逐步積分法的結果相符。最重要的單一結論是：以 us/c = 0.30 對應各大錐畫出激波條件曲線，其包絡與無限馬赫數下的激波關係式相交於一點，由此定出半頂角超過 57.6 度（頂角 115.2 度）的錐，無論速度多高都不可能形成附著的錐形激波。",
    summary: "本摘要由本站自出版社排版版 PDF（Royal Society，royalsocietypublishing.org）整理，頁碼為期刊印刷頁。\n\n定位（第 459 至 460 頁）：本文明言是 Taylor 與 Maccoll（1933）的續作。作者回顧前作已用高速風洞的表面壓力與錐頭子彈的飛行照片驗證計算，且照片顯示在數學解不存在的速度下激波不再呈錐形並自錐尖脫離。本文第一部分處理新的攝影驗證，第二部分處理大頂角錐的計算，並在此預告了全篇最強的結論——半頂角大於 57.6 度的錐永遠不可能有錐形激波。\n\n攝影設備（第 460 頁）：兩磅砲彈（直徑 1.57 吋）在伍利奇皇家兵工廠研究部門拍攝。裝置由持片大框、火花間隙與連接靜電系統的斷路器組成；激波通過斷路器時觸發短暫火花，把彈丸造成的空氣擾動記錄在片上。底片距彈道約 5 吋、距火花間隙 41 吋，火花間隙刻意偏離底片中心並沿飛行方向略為位移，以減少運動中鼻部影像的變形。\n\n實測反過來修正了理論計算（第 461 至 462 頁）：表 I 列出三種頂角在各馬赫數下量得的激波角。與計算比對後雖大致吻合，但在較低 U/a 處出現小而系統性的差異。作者判斷可能是原先的計算值略有誤差，並以更精細的方法重解控制方程後證實如此；表 II 對每個錐重算兩點，重算值與實測的吻合度作者形容為極好。連帶地，1933 年給出的三個臨界 U/a 被判定略為偏低：20 度頂角錐原記為 1.035，而新照片在 U/a = 1.040 拍到激波剛要離開錐尖，且該值與重算條件下的激波角更相稱，作者因此建議另兩個錐的臨界值也應同樣微幅上修。這一段是本站追問要對照的關鍵之一：真實流場選出的那一支，是與重算後的計算曲線在小數點後仍相符的那一支，而判準來自量測而非理論內部的取捨。\n\n小波與邊界層（第 463 至 464 頁）：U/a = 1.794 與 1.576 兩張照片在錐面與激波之間顯示一組小波，來自錐面的不規則，是小擾動相對彈丸向外傳播的路徑；作者對半頂角 20 度、us/c = 0.50、U/a = 1.65 的情形計算其形狀並與照片比對。其餘照片看不到小波，因為錐面速度已低於當地音速；該錐的錐面速度在 U/a = 1.34 達到臨界，故 1.321 那張近錐面的絨毛狀效應可解釋為錐面速度僅略低於當地音速——此時錐面附近條件對速度的微小變化極為敏感，任何輕微偏航都會造成很大影響。作者並附帶指出照片中可見肩部的膨脹區（類同 Meyer 1908 研究的二維超音速轉角膨脹）與沿彈身逐漸成長、多半已是紊流的邊界層。\n\n對理論的總體確認（第 464 頁）：作者總結三點——錐形激波的角度總能算到與實測相差一個很小的角度分數以內；錐形流態一旦不可能，激波就自錐尖脫離；小波在估計的馬赫數附近消失。三者合起來是對 1933 年理論的有力佐證。\n\n級數解取代逐步積分（第 464 至 466 頁）：第二部分沿用 Taylor 與 Maccoll（1933）式（8）的控制方程。在錐面上邊界條件為 u = us、v = du/dθ = 0，代入後直接得 d²u/dθ² = −2us；對方程逐次微分即可得到錐面上各階導數的封閉表達式，再代入泰勒級數展開求離錐面 (θ − θs) 處的速度分量。作者檢查了各種 us/c 與 θs 組合下的收斂性，結論是級數一般在 (θ − θs) 不超過 20 度時收斂，超過時仍可給出尚可接受的解；兩個級數都是交錯級數，實務上取到含 (θ − θs) 五次方的項，並把該項乘以 0.5 來補償被略去的高階項。\n\n兩種方法的交叉驗證（第 466 至 468 頁）：表 III 以 us/c = 0.30（接近這些大錐可行解的速度下限，此時激波與錐面夾角約 18 度以上，屬對級數最不利的情形）比較逐步積分（方法一）與級數解（方法二）。兩者的激波角、U/a 與表面壓力係數都相當接近，作者因此判定在更高的 us/c 下級數法的精度對本研究已足夠，後續四個大錐的完整計算全部採用級數法。\n\n最大錐角的判定（第 468 至 470 頁）：這是本篇最強的結論。作者觀察到大錐的錐形流態速度下限大致對應錐面速度 us = 0.30c，於是以此值對各大錐畫出激波附近 (β − α) 與 α 的關係曲線，把各激波實際位置標成圓點，再過這些點畫一條曲線 B 並延長，直到與 (γ+1)tan α = (γ−1)tan β 相交於點 A。由於後者代表無限馬赫數下的激波條件，點 A 必然對應可能的最大錐。由曲線 B 需延長的距離估得最大錐的半頂角為 57.6 度，再以 θs = 57.6 度、us/c = 0.30 直接積分控制方程驗證所得曲線確實通過點 A。結論是半頂角大於 57.6 度的錐，無論速度多高都不會產生錐形流態。\n\n極限條件的整理（第 471 頁）：圖 14 以兩條曲線總結錐形流態的下界——一條給出激波仍附著於錐所需的最小馬赫數，另一條給出特定錐所能出現的最大激波角。作者坦言後者對小錐不易精確定出，因為接近臨界馬赫數時角度變化極快，但認為圖中曲線不至於有大誤差。\n\n作者自陳的摘要（第 471 至 472 頁）：以兩磅砲彈飛行照片重新檢視前作，計算與實測的激波位置吻合很好；再以同樣方法計算頂角 80、90、100、110 度錐的激波條件，發現頂角超過 115.2 度時錐尖無法形成錐形激波。（注意摘要用的是頂角，正文用的是半頂角，115.2 度頂角即 57.6 度半頂角，兩者一致。）",

    contribution: "依使用者提供的整理。這是為特徵線法備料而生的數表集，不是期刊論文：以特徵線法解超音速流場必須先知道一條起始線上的流況，對尖頭旋成體而言該起始線由圓錐繞流解提供。作者在建立特徵線法程式時決定自行計算這個起始流場，而不沿用 Kopal (1947) 的既有數表，理由是不願被 Kopal 表的馬赫數取樣點限制住；本書即是為了他真正的目標（小攻角錐表，後來的 SP-3007）而連帶重算的零攻角基準。方法為 Taylor–Maccoll 二階常微分方程配四階 Runge–Kutta 積分，速度沿用 Kopal 的系統以絕熱膨脹入真空的極限速度無因次化，自錐面往外積分至震波，並對錐面速度做迭代，使錐角與自由流馬赫數都能指定；比熱比取 1.4。涵蓋錐半角 2.5 至 30 度（每 2.5 度一階共 12 個）乘以 16 個標稱自由流馬赫數（1.5 至 20），另對每個錐角算出完全超音速錐流場所能存在的最低自由流馬赫數，判別條件是錐面速度恰等於當地音速。全書 219 張表分三層，其中 202 張是個別完整流場表，給出自錐面穿越震波層直到震波的徑向分佈與特徵線座標——這正是特徵線法要的起始線資料，也是本書與一般錐流查表最大的差別。作者自述的誤差預算為：任一解任一點的最大積分誤差小於 5×10⁻⁸，Rankine–Hugoniot 條件滿足到 ±2×10⁻⁷，所有目標自由流馬赫數達六位以上有效位數。作者在前言載明本書數據在物理內容上與 Kopal (1947) 基本相同，差異只在呈現方式與比熱比取 1.4 而非 1.405。",
    summary: "本摘要依使用者提供的整理寫成，本站未持有原檔，因此依規則 pages 維持空白；以下段落標註的表號為使用者所述的原書表號，非本站查證所得。\n\n出版形式（書目上的一個常見誤解）：本書屬 NASA 的 Special Publication 系列，是專題出版品中的資料手冊或數表集性質，沒有經過期刊同儕審查，因此沒有卷期號。使用者提供的標準引用格式為 Sims, J. L., Tables for Supersonic Flow Around Right Circular Cones at Zero Angle of Attack, NASA SP-3004, 1964。發行單位為 NASA 科學與技術資訊辦公室，篇幅 vi 加 421 頁，屬美國政府著作、公眾領域。\n\n為什麼要另外重算一套（Introduction）：以特徵線法求解超音速流場，必須先給定一條起始線上的流況；對尖頭旋成體，這條起始線通常由圓錐繞流解提供。作者在建立特徵線法程式的過程中決定自行計算起始流場，而非沿用 Kopal 的既有數表。程式完成後，他原本的目標是製作小攻角、體固定座標系的錐表（即 SP-3007），但為了不被 Kopal 表的馬赫數取樣點限制住，必須連帶重算一套零攻角的基準表，也就是本書。這個緣由解釋了本書的內容取捨：它的重點不在錐面幾個數字，而在整個震波層的分佈。\n\n數值方法（Solution of the Equations）：採 Taylor–Maccoll 在球座標下的二階常微分方程，速度以絕熱膨脹入真空的極限速度無因次化（沿用 Kopal 的系統，以便直接套用其參數作為數值設定依據）。積分用四階 Runge–Kutta，方向是自錐面出發往外積分到震波，起始條件為指定的錐面速度，終止條件為滿足震波條件。由於指定錐面速度無法事先對應到想要的自由流馬赫數，程式內建對錐面速度的迭代，使錐角與自由流馬赫數都能指定。比熱比取理想氣體值 1.4。\n\n誤差預算：作者以積分步長研究得出任一解中任一點的最大積分誤差小於 5×10⁻⁸，Rankine–Hugoniot 條件滿足到 ±2×10⁻⁷，所有目標自由流馬赫數均達六位以上有效位數。就 1964 年的計算資源而言，這是一份明確可稽核的誤差陳述，也是本站追問（能否作為現代求解器的驗證基準）的關鍵依據。\n\n涵蓋範圍與存在性下界：錐半角自 2.5 度到 30 度、每 2.5 度一階共 12 個；標稱自由流馬赫數 16 個（1.5、1.75、2.0、2.5、3.0、3.5、4.0、4.5、5.0、6.0、7.0、8.0、10.0、12.0、15.0、20.0），非等間距但每個錐角共用同一組。另對每個錐角計算完全超音速錐流場所能存在的最低自由流馬赫數，判別條件為錐面速度恰等於當地音速（即錐面馬赫數為 1），這是任何解存在的下限。使用者轉述的表 1 數值為：2.5 度對 1.0121844、5.0 度對 1.0383341、7.5 度對 1.0735583、10.0 度對 1.1159051、12.5 度對 1.1643198、15.0 度對 1.2182190、17.5 度對 1.2773745、20.0 度對 1.3419094、22.5 度對 1.4123337、25.0 度對 1.4895952、27.5 度對 1.5751393、30.0 度對 1.6710795。由於 27.5 度與 30 度的最小馬赫數已高於 1.5，這兩個錐角沒有馬赫 1.5 的解，因此各只有 16 張表而非 17 張。使用者並指出表 1 中錐面馬赫數全部列為 1.0000050，可據以確認確為聲速錐面極限。\n\n表格結構的三層：第一層是最小馬赫數彙整，表 1 為錐面結果（自由流馬赫數、壓力比、密度比、溫度比、熵增、錐面速度比與馬赫數、壓力係數），表 10 為對應的震波結果。第二層是以錐角乘標稱馬赫數作二維查表的彙整表，表 2 至 9 給錐面各量含表面壓力係數，表 11 至 17 給震波角與震波後各量；這些彙整表是人工自機器印表結果謄錄並轉為十進位的。第三層是個別完整流場表，表 18 至 219 共 202 張，每張對應一組錐角與馬赫數，列出速度比、流向角與特徵線座標對錐射線角的分佈，自錐面起算逐步穿越震波層直到震波，表末附該解的熵增與錐面壓力、密度、溫度比。\n\n格式陷阱（使用者特別提醒）：個別流場表是當年機器印表的直接輸出，未轉為十進位。編碼是符號加八位數字、再加指數符號與兩位數字，讀法為 0.xxxxxxxx 乘以 10 的正負 ee 次方；例如 -47168732+00 應讀作 −0.47168732。角度以弧度表示。表中的座標是以錐頂為原點的圓柱座標，代表自錐底邊緣發出的左     contribution: "三頁的技術短文，目的是給出一條夠簡單、實務上真的用得動的錐面壓力近似式。作者指出既有選項各有不足：Lees 的壓力公式其實相當複雜，且在高超音速相似參數變小時不準；Hayes 與 Probstein 則走等密度近似。本文改以 Van Dyke 的高超音速小擾動流函數方程為出發點，把它改寫成積分方程並用逐次逼近求解——零階解直接略去積分項（可預期激波貼近錐面時該項相對小），代回被積函數後積分一次即得一階解。由此得到兩個閉式結果：其一，激波角與錐角之比 1/b = Kτ/Kδ = {[(γ+1)/2] + 1/Kδ²}^(1/2)，作者指出這與 Chernyi 對略帶鈍頭的錐所得的漸近式相同；其二，錐面壓力係數 Cpb/δ² 的顯式公式。兩個極限都對得上：Kδ 趨於無限大時 Cpb/δ² 化為 1 + [(γ+1)/(γ−1)]ln[(γ+1)/2]，對 γ = 7/5 得 2.094，而 Van Dyke 給的精確值是 2.091；Kδ 趨於零時 Cpb 正比於 δ²ln(1/Kδ²)，與線化理論的漸近形式相同。就本站追問而言，作者自己劃出的適用界線寫在第 1496 頁末：把公式中的 δ 換成 sin δ（τ 換成 sin τ）後，與 Kopal 的精確計算相比，在錐半角小於 30 度且 Kδ = M∞ sin δ 大於 1 時吻合良好。這個替換不是湊數，作者說明其動機是它讓 Kδ 趨於零時激波角正確地退化為馬赫角（Kτ = 1）。",
    summary: "本摘要由本站自出版社排版版 PDF（AIAA，arc.aiaa.org）整理，頁碼為期刊印刷頁。\n\n動機與既有方案（第 1495 頁）：作者開門見山說明用途——很多場合需要無偏航錐體表面壓力與其他流場變數的近似式，例如切錐近似法（tangent-cone approximation），但真正簡單到好用的近似式並不多。既有的兩個選項：Lees 的壓力公式實際上相當複雜，且在高超音速相似參數變小時不準確；Hayes 與 Probstein 則使用等密度近似。本文的路線是解 Van Dyke 的高超音速小擾動流函數方程，方法為逐次逼近。\n\n方程與邊界條件（第 1495 至 1496 頁）：採圓柱坐標，激波角記為 τ、錐角記為 δ = bτ。由於流場是錐形的，引入錐形變數 θ = r̄/τx̄ 把流函數化為單變數函數 f(θ)。定義兩個高超音速相似參數：以激波角為基準的 Kτ = M∞τ，以錐角為基準的 Kδ = M∞δ。側向速度擾動與壓力係數都可用 f 及其導數表出，軸向擾動則由高超音速小擾動形式的 Bernoulli 方程決定。邊界條件有三個：激波處 f(1) = 1/2 與 f′(1) = (γ+1)Kτ²/[2+(γ−1)Kτ²] ≡ a，錐面處相切條件 f(b) = 0。\n\n逐次逼近（第 1496 頁）：把控制方程改寫成積分方程，自激波往內積分兩次即同時滿足兩個激波條件。由於 f 在錐面為零，被積函數在該處也為零，因此當激波貼近錐面時積分項相對其餘各項為小——這正是零階近似 f₀ = 1/2 − (a/2)(1 − θ²) 的立足點。把 f₀ 代回被積函數積分即得一階解 f₁，其導數的第二項再依同一量級論證予以略去。\n\n兩個閉式結果（第 1496 頁）：以零階近似滿足錐面條件即得激波角與錐角之比 1/b = Kτ/Kδ = {[(γ+1)/2] + 1/Kδ²}^(1/2)，作者指出這與 Chernyi 針對略帶鈍頭之錐所得的漸近式相同。把一階解代入壓力式並用上式消去 b，得錐面壓力係數 Cpb/δ² = 1 + {[(γ+1)Kδ²+2]/[(γ−1)Kδ²+2]}·ln[(γ+1)/2 + 1/Kδ²]。\n\n兩端極限的檢核（第 1496 頁）：Kδ 趨於無限大時上式化為 Cpb/δ² = 1 + [(γ+1)/(γ−1)]ln[(γ+1)/2]；取 γ = 7/5 得 2.094，而 Van Dyke 給出的精確值為 2.091，兩者差約千分之一。Kδ 趨於零時 Cpb 正比於 δ²ln(1/Kδ²)，與線化理論在統一超音速—高超音速相似律下的漸近形式相同。也就是說這條公式在高超音速端與線化端都收得回去。\n\n適用範圍（第 1496 頁）：這是本站追問的直接答案。作者說明式（15）與式（16）在 δ 小、M∞ 大時與 Kopal 的精確計算吻合良好；而若把 δ 換成 sin δ（τ 換成 sin τ），較大的 δ 也能改善——理由是經此替換後 Kδ 趨於零時激波角會正確地退化為馬赫角 Kτ = 1。圖 2 即以此修正形式繪出，並與 Kopal 對 δ = 5 度與 30 度的精確值比較，作者的判定是：錐半角小於 30 度且 Kδ = M∞ sin δ 大於 1 時吻合良好。圖 2 的縱軸用的是 Cpb/sin²δ，橫軸為 Kδ，可直接看出兩組精確值落在同一條曲線上。",
